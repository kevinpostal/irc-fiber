{
    "app": {
        "name": "irc-fiber",
        "env": "development",
        "logLevel": "debug"
    },
    "server": {
        "host": "0.0.0.0",
        "port": 8090
    },
    "redis": {
        "host": "127.0.0.1",
        "port": 6379,
        "database": 0
    },
    "mongo": {
        "url": "mongodb://127.0.0.1:27017/ircfiber",
        "database": "ircfiber"
    },
    "irc": {
        "reconnectInitialDelay": 3,
        "reconnectMaxDelay": 60,
        "tlsVerify": false
    }
}
