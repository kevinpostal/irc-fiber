{
    "app": {
        "name": "irc-fiber",
        "env": "production",
        "logLevel": "info"
    },
    "server": {
        "host": "0.0.0.0",
        "port": 8090
    },
    "redis": {
        "host": "${IRCFIBER_REDIS_HOST}",
        "port": 6379,
        "database": 0
    },
    "mongo": {
        "url": "${IRCFIBER_MONGO_URL}",
        "database": "ircfiber"
    },
    "irc": {
        "reconnectInitialDelay": 1,
        "reconnectMaxDelay": 300,
        "tlsVerify": true
    }
}
