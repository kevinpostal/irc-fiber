[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info

# ---------------------------------------------------------------------------
# INPUT: tail Docker container JSON logs
# ---------------------------------------------------------------------------
[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*-json.log
    Parser            docker
    Path_Exclude      /var/lib/docker/containers/*fluent-bit*/*.log
    Refresh_Interval  5
    Mem_Buf_Limit     50MB
    Skip_Long_Lines   On

# ---------------------------------------------------------------------------
# OUTPUT: stdout for CI validation (no SigNoz in test stack)
# ---------------------------------------------------------------------------
[OUTPUT]
    Name              stdout
    Match             *

# ---------------------------------------------------------------------------
# PARSERS
# ---------------------------------------------------------------------------
[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    Time_Keep   On
