[PARSER]
    Name        docker
    Format      json
    Time_Key    time
    # Docker's json-file driver time is like 2026-08-07T06:07:50.589360811Z
    # (9 fractional digits, Z suffix). Fluent Bit's %L handles fractional
    # seconds up to nanoseconds (since v0.12). Use %S.%L without trailing Z;
    # the Z is parsed as UTC via the built-in timezone handling. Previous
    # configs used %L%z (expects +0000, not Z) and %fZ (invalid), causing
    # "invalid time format" warnings and fallback to ingestion time.
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On

[PARSER]
    Name        engine_json
    Format      json
    Time_Key    time
    # Engine JSON ts after fix is 2026-08-07T06:07:47.2434928Z (7 digits, single Z).
    # Same as docker: use %S.%L to handle 7-9 digit fractions. Trailing Z is
    # handled as UTC without needing explicit %Z in format.
    Time_Format %Y-%m-%dT%H:%M:%S.%L
    Time_Keep   On
