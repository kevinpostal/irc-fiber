---
# ircfiber_image role.
#
# Builds the IRC Fiber images (D engine/gateway, both from Containerfile):
#   - irc-fiber-gateway  (D gateway, from Containerfile)
#   - irc-fiber-engine   (D engine, from Containerfile)
#
# Strategies:
#   - With a registry: build on the Ansible control node, push, target pulls.
#   - Without a registry: build directly on each target host.

# ---- Preflight (always on the control node) --------------------------------
- name: Preflight — verify gateway Containerfile exists
  ansible.builtin.stat:
    path: "{{ ircfiber_repo_root }}/{{ ircfiber_gateway_containerfile }}"
  register: gateway_containerfile_check
  delegate_to: localhost
  become: false
  run_once: true

- name: Preflight — verify engine Containerfile exists
  ansible.builtin.stat:
    path: "{{ ircfiber_repo_root }}/{{ ircfiber_engine_containerfile }}"
  register: engine_containerfile_check
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail if gateway Containerfile missing
  ansible.builtin.fail:
    msg: "Gateway Containerfile not found at {{ ircfiber_repo_root }}/{{ ircfiber_gateway_containerfile }}"
  when: not gateway_containerfile_check.stat.exists
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail if engine Containerfile missing
  ansible.builtin.fail:
    msg: "Engine Containerfile not found at {{ ircfiber_repo_root }}/{{ ircfiber_engine_containerfile }}"
  when: not engine_containerfile_check.stat.exists
  delegate_to: localhost
  become: false
  run_once: true

# ---- With registry: build gateway image on control node, push --------------
- name: Build gateway image on the control node
  community.docker.docker_image:
    name: "{{ ircfiber_gateway_image_name }}"
    tag: "{{ docker_image_tag }}"
    build:
      path: "{{ ircfiber_repo_root }}"
      dockerfile: "{{ ircfiber_gateway_containerfile }}"
      args: "{{ ircfiber_gateway_build_args }}"
      pull: "{{ ircfiber_build_pull }}"
    source: build
    force_source: "{{ ircfiber_force_rebuild }}"
    push: true
    state: present
  delegate_to: localhost
  become: false
  run_once: true
  when: docker_registry_url | length > 0

- name: Tag gateway image as latest
  community.docker.docker_image:
    name: "{{ ircfiber_gateway_image_name }}:{{ docker_image_tag }}"
    repository: "{{ ircfiber_gateway_image_name }}:latest"
    source: local
    force_tag: true
    state: present
  delegate_to: localhost
  become: false
  run_once: true
  when: docker_registry_url | length > 0

- name: Push gateway latest tag
  community.docker.docker_image:
    name: "{{ ircfiber_gateway_image_name }}:latest"
    push: true
    source: local
  delegate_to: localhost
  become: false
  run_once: true
  when: docker_registry_url | length > 0

# ---- With registry: build engine image on control node, push ---------------
- name: Build engine image on the control node
  community.docker.docker_image:
    name: "{{ ircfiber_engine_image_name }}"
    tag: "{{ docker_image_tag }}"
    build:
      path: "{{ ircfiber_repo_root }}"
      dockerfile: "{{ ircfiber_engine_containerfile }}"
      args: "{{ ircfiber_engine_build_args }}"
      pull: "{{ ircfiber_build_pull }}"
    source: build
    force_source: "{{ ircfiber_force_rebuild }}"
    push: true
    state: present
  delegate_to: localhost
  become: false
  run_once: true
  when: docker_registry_url | length > 0

- name: Tag engine image as latest
  community.docker.docker_image:
    name: "{{ ircfiber_engine_image_name }}:{{ docker_image_tag }}"
    repository: "{{ ircfiber_engine_image_name }}:latest"
    source: local
    force_tag: true
    state: present
  delegate_to: localhost
  become: false
  run_once: true
  when: docker_registry_url | length > 0

- name: Push engine latest tag
  community.docker.docker_image:
    name: "{{ ircfiber_engine_image_name }}:latest"
    push: true
    source: local
  delegate_to: localhost
  become: false
  run_once: true
  when: docker_registry_url | length > 0

# ---- Without registry: build on each target host ---------------------------
- name: Ensure /opt/ircfiber-src ownership (fix 501 rsync set-times)
  ansible.builtin.file:
    path: /opt/ircfiber-src
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"
    recurse: true
  become: true
  when: docker_registry_url | length == 0

- name: Rsync irc-fiber repo to the target host (no-registry mode)
  ansible.posix.synchronize:
    src: "{{ ircfiber_repo_root }}/"
    dest: "/opt/ircfiber-src/"
    delete: false
    recursive: true
    owner: false
    group: false
    checksum: true
    times: true
    rsync_opts:
      - "--omit-dir-times"
      - "--no-perms"
      - "--exclude=.git"
      - "--exclude=node_modules"
      - "--exclude=.dub"
      - "--exclude=e2e/test-results"
      - "--exclude=*.log"
      - "--exclude=frontend/node_modules"
      - "--exclude=.reasonix"
      - "--exclude=.playwright-mcp"
      - "--exclude=test-results"
      - "--exclude=e2e/test-results"
      - "--exclude=*.log"
      - "--exclude=.worktrees"
      - "--exclude=.nosync"
      - "--exclude=.DS_Store"
      - "--exclude=.venv"
      - "--exclude=.venv*"
      - "--exclude=venv"
      - "--exclude=__pycache__"
      - "--exclude=.mypy_cache"
      - "--exclude=.pytest_cache"
      - "--exclude=.ruff_cache"
      - "--exclude=irc-fiber"
      - "--exclude=irc-fiber-*"
      - "--exclude=irc-fiber_*"
      - "--exclude=backend/irc-fiber*"
      - "--exclude=engine/irc-fiber*"
      - "--exclude=*\\ 2.html"
      - "--exclude=*\\ 2.*"
  throttle: 1
- name: Build gateway image on the target host (no-registry mode)
  ansible.builtin.command: >
    docker build
    --progress=plain
    --target runtime-gateway
    --tag {{ ircfiber_gateway_image_full }}
    {% for key, value in ircfiber_gateway_build_args.items() %}
    --build-arg {{ key }}={{ value }}
    {% endfor %}
    -f /opt/ircfiber-src/{{ ircfiber_gateway_containerfile }}
    /opt/ircfiber-src
  args:
    chdir: /opt/ircfiber-src
  changed_when: true
  when: docker_registry_url | length == 0

- name: Build engine image on the target host (no-registry mode)
  ansible.builtin.command: >
    docker build
    --progress=plain
    --target runtime-engine
    --tag {{ ircfiber_engine_image_full }}
    {% for key, value in ircfiber_engine_build_args.items() %}
    --build-arg {{ key }}={{ value }}
    {% endfor %}
    -f /opt/ircfiber-src/{{ ircfiber_engine_containerfile }}
    /opt/ircfiber-src
  args:
    chdir: /opt/ircfiber-src
  changed_when: true
  when: docker_registry_url | length == 0

# ---- Report ----------------------------------------------------------------
- name: Show resulting gateway image on target
  ansible.builtin.command: >-
    docker images {{ ircfiber_gateway_image_full }}
    --format '{{ "{{" }}.Repository{{ "}}" }}:{{ "{{" }}.Tag{{ "}}" }} -> {{ "{{" }}.ID{{ "}}" }}'
  register: gateway_image_inventory
  changed_when: false
  become: false

- name: Show resulting engine image on target
  ansible.builtin.command: >-
    docker images {{ ircfiber_engine_image_full }}
    --format '{{ "{{" }}.Repository{{ "}}" }}:{{ "{{" }}.Tag{{ "}}" }} -> {{ "{{" }}.ID{{ "}}" }}'
  register: engine_image_inventory
  changed_when: false
  become: false
