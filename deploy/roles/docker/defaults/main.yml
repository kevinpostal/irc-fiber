---
docker_apt_keyring: /etc/apt/keyrings/docker.asc
docker_apt_repo: >-
  deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}
  signed-by={{ docker_apt_keyring }}]
  https://download.docker.com/linux/{{ ansible_distribution | lower }}
  {{ ansible_distribution_release }} stable
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
# Users to add to the 'docker' group. Default is ['deploy'] so the
# non-root user provisioned by the deploy_user role can run docker
# without sudo. Override in inventory if you need different users.
docker_users:
  - deploy
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"
  storage-driver: overlay2
  default-address-pools:
    - base: "172.17.0.0/12"
      size: 24
