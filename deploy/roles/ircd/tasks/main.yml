---
# IRC Fiber — Deploy Ergo IRC daemon

- name: Preflight — vault_ircd_oper_password must be set
  ansible.builtin.assert:
    that:
      - vault_ircd_oper_password is defined
      - vault_ircd_oper_password | length > 0
      - vault_ircd_oper_password != "REPLACE-WITH-STRONG-PASSWORD"
    fail_msg: |
      vault_ircd_oper_password is missing or still a placeholder. Set it in
      inventories/production/group_vars/vault.yml:
        ansible-vault edit inventories/production/group_vars/vault.yml

- name: Ensure IRCd data volume exists
  community.docker.docker_volume:
    name: "{{ ircd_data_volume }}"
    state: present

- name: Pull ircd image
  community.docker.docker_image:
    name: "{{ ircd_image }}"
    source: pull
    state: present

- name: Generate oper password hash via ergo genpasswd
  # genpasswd reads the password from stdin (not a CLI arg) and outputs the
  # bcrypt hash on stdout, e.g. "$2a$04$<salt>$<hash>"
  ansible.builtin.shell: >
    docker run --rm -i --entrypoint /ircd-bin/ergo
    "{{ ircd_image }}"
    genpasswd --quiet
    <<< "{{ vault_ircd_oper_password }}"
  args:
    executable: /bin/bash
  register: ircd_oper_hash_raw
  changed_when: false
  no_log: true

- name: Set oper password hash fact
  ansible.builtin.set_fact:
    vault_ircd_oper_password_hash: "{{ ircd_oper_hash_raw.stdout | trim }}"
  no_log: true

- name: Ensure IRCd config dir exists
  ansible.builtin.file:
    path: "/etc/ircfiber/ircd"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render ircd.yaml
  ansible.builtin.template:
    src: ircd.yaml.j2
    dest: "/etc/ircfiber/ircd/ircd.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ircd

- name: Render MOTD
  ansible.builtin.template:
    src: motd.j2
    dest: "/etc/ircfiber/ircd/motd"
    owner: root
    group: root
    mode: "0644"
  notify: Restart ircd

- name: Run ircfiber-ircd
  community.docker.docker_container:
    name: "{{ ircd_container_name }}"
    image: "{{ ircd_image }}"
    state: started
    restart_policy: "{{ ircd_restart_policy }}"
    # ghcr.io/ergochat/ergo entrypoint (/ircd-bin/run.sh) reads config from
    # /ircd/ircd.yaml and generates self-signed TLS certs on first start.
    # No custom command needed — run.sh handles everything.
    networks:
      - name: "{{ docker_ircfiber_network }}"
    networks_cli_compatible: true
    ports:
      - "{{ ircd_port_plain }}:{{ ircd_port_plain }}"
      - "{{ ircd_port_tls }}:{{ ircd_port_tls }}"
    volumes:
      - "{{ ircd_data_volume }}:{{ ircd_data_mount }}"
      - "/etc/ircfiber/ircd/ircd.yaml:/ircd/ircd.yaml:ro"
      - "/etc/ircfiber/ircd/motd:{{ ircd_data_mount }}/motd:ro"
    healthcheck:
      # Probe the IRC port to confirm the daemon is accepting connections
      test: ["CMD-SHELL", "nc -w 3 127.0.0.1 {{ ircd_port_plain }} < /dev/null > /dev/null 2>&1 && exit 0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      com.ircfiber.component: "ircd"
      com.ircfiber.version: "{{ ircfiber_version }}"
      com.ircfiber.server_name: "{{ ircd_server_name }}"
