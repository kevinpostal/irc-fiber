---
# IRC Fiber — Deploy IRC daemon (RETIRED in this tree)
#
# Do not use: run the canonical playbook from the site tree instead:
#
#   cd site/deploy && ansible-playbook playbooks/ircd.yml -l vps-efb4b52d
#
# The Ergo-based role that used to live here was removed; the live stack is
# InspIRCd 4 + Anope 2 (site/deploy/roles/ircd/). The play below fails
# loudly rather than deploying the wrong daemon.

- name: Preflight — vault variables
  hosts: ircfiber
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"
  tasks:
    - name: Assert vault_ircd_oper_password is set
      ansible.builtin.assert:
        that:
          - vault_ircd_oper_password is defined
          - vault_ircd_oper_password | length > 0
        fail_msg: "vault_ircd_oper_password must be set in vault.yml"

- name: Manage Cloudflare DNS for irc.ircfiber.com
  hosts: ircfiber_backend
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"
  tasks:
    - name: Ensure irc.ircfiber.com A record exists (DNS-only, no proxy)
      community.general.cloudflare_dns:
        api_token: "{{ vault_cloudflare_api_token }}"
        zone: "{{ cloudflare_zone }}"
        record: "irc"
        type: A
        value: "{{ cloudflare_target_ip }}"
        ttl: 300
        proxied: false
        state: present
      when:
        - cloudflare_target_ip is defined
        - cloudflare_target_ip | length > 0

- name: Deploy IRC daemon (retired here — see site/deploy/playbooks/ircd.yml)
  hosts: ircfiber_backend
  become: true
  gather_facts: false
  tasks:
    - name: Refuse — ircd lives in the site tree now
      ansible.builtin.fail:
        msg: >-
          The top-level ircd role (Ergo) was retired. The live stack is
          InspIRCd 4 + Anope 2, deployed from site/deploy:
          cd site/deploy && ansible-playbook playbooks/ircd.yml
