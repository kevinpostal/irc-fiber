---
# One-time bootstrap: create the 'deploy' user with passwordless sudo
# and install an SSH key.
#
# Run this ONCE per host, as root, before any other playbook:
#
#   ansible-playbook playbooks/bootstrap.yml -e ansible_user=root
#
# NOTE: do NOT use `--user root` / `-u root` on the CLI. In ansible-core
# 2.20+, inventory's `ansible_user=deploy` overrides the CLI flag, so
# the playbook will still try to connect as `deploy` (who doesn't exist
# yet on a fresh host). Use `-e ansible_user=root` instead, which has
# higher precedence than inventory.
#
# Alternative: temporarily edit hosts.ini and change `ansible_user=deploy`
# to `ansible_user=root`, run bootstrap.yml, then change it back.
#
# After this succeeds, leave hosts.ini at `ansible_user=deploy` and all
# subsequent playbooks will connect as the non-root deploy user.
#
# By default the role copies whatever public key is in
# /root/.ssh/authorized_keys on the target host. If you want to install
# a different key, override one of these variables in your inventory
# or pass them on the command line:
#
#   --extra-vars 'deploy_user_ssh_public_key="ssh-rsa AAAA..."'
#   --extra-vars 'deploy_user_ssh_public_key_file=/path/to/key.pub'

- name: Bootstrap — create the deploy user
  hosts: ircfiber
  become: true
  gather_facts: true
  roles:
    - role: deploy_user
