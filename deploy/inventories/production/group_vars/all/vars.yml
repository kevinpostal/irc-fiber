---
# IRC Fiber — public defaults (safe to commit)
# Override per host in inventories/production/host_vars/<hostname>.yml

# --- Versions -----------------------------------------------------------------
ircfiber_version: "0.3.0"
ircfiber_session_ttl_days: 90

# --- Image registry ------------------------------------------------------------
# Docker Hub: set url to "docker.io" (or ""), namespace to your Docker Hub username.
# GHCR: set url to "ghcr.io" and namespace to your GitHub user/org.
# Private: set url to "registry.example.com" etc.
# Leave url empty ("") to skip the registry and build images directly on the target host.
docker_registry_url: ""
docker_registry_namespace: "kevindpostal"
docker_image_tag: "{{ ircfiber_version }}"

# --- Public-facing ------------------------------------------------------------
ircfiber_domain: "ircfiber.com"
# Email used by Caddy for Let's Encrypt ACME registration (only used when
# ircfiber_use_lets_encrypt is true)
# Left empty: the committed value was the literal "[email protected]" (a
# Cloudflare email-obfuscation artifact), which rendered `tls [email protected]`
# and crash-looped Caddy on 2026-09-02. Set a real address in host_vars/vault
# to register the ACME account; Let's Encrypt works without one.
ircfiber_acme_email: ""
# When true, Caddy requests a real Let's Encrypt cert (requires DNS for
# ircfiber_domain to point at the host's public IP and port 80/443 open).
# When false, Caddy uses a local self-signed cert — convenient for the
# /etc/hosts trick to access the host via its Tailscale IP. Browsers will
# show a cert warning; click through to proceed.
ircfiber_use_lets_encrypt: false

# --- Container runtime --------------------------------------------------------
mongo_image: "mongo:7"
redis_image: "redis:7-alpine"
caddy_image: "caddy:2-alpine"

# --- Tailscale ----------------------------------------------------------------
# Tag applied to all ircfiber hosts; use in Tailscale ACLs to scope the mesh.
tailscale_tags: "tag:ircfiber"
# Where to find tailscaled state
tailscale_state_dir: "/var/lib/tailscale"

# --- Internal networking -------------------------------------------------------
# The Docker bridge network used by gateway/caddy (and for management of backend containers).
docker_ircfiber_subnet: "172.30.0.0/16"
docker_ircfiber_network: "ircfiber_net"
docker_ircfiber_gateway: "172.30.0.1"

# --- Firewall -----------------------------------------------------------------
firewall_enabled: true
firewall_allow_ssh_cidr: "0.0.0.0/0"
# Whether to allow the engine admin port (8091) from the Tailscale subnet only.
firewall_open_engine_admin: true
# Public bouncer port (bnc.<domain>:7000 TLS).
firewall_extra_tcp_ports:
  - 7000
# --- Mongo --------------------------------------------------------------------
mongo_data_volume: "ircfiber_mongo_data"
mongo_initdb_database: "ircfiber"
mongo_port: 27017
mongo_replica_init: true
mongo_replica_members:
  - host: "{{ host_tailscale_ip }}"
    port: "{{ mongo_port }}"
    priority: 10

# --- Redis --------------------------------------------------------------------
redis_data_volume: "ircfiber_redis_data"
redis_port: 6379
redis_maxmemory: "256mb"
redis_appendonly: true

# --- Gateway ------------------------------------------------------------------
gateway_http_port: 8090
gateway_uploads_volume: "ircfiber_uploads"
gateway_logs_volume: "ircfiber_logs"
# Number of gateway container replicas (1 = single, backward-compatible name).
# Raise to 2-4 for process-level isolation and horizontal scale on the same host.
gateway_replica_count: 1
# When true and replica_count > 1, Caddy uses ip_hash load balancing so
# WebSocket clients stay pinned to the same replica.
gateway_replica_sticky: true
# Swappable API backend (Step 3): D gateway (default) vs Python gateway.
# When gateway_use_python is true, Caddy proxies /api/* and /ws to
# irc-fiber-api-py:8000 instead of ircfiber-gateway:8090. Frontend needs
# no rebuild — it keeps API_BASE=/api behind Caddy. Toggle via
# `gateway_use_python: true` in host_vars or with `--extra-vars`.
gateway_backend_host: "ircfiber-gateway"
gateway_backend_port: "{{ gateway_http_port }}"
gateway_use_python: false
gateway_python_host: "irc-fiber-api-py"
gateway_python_port: 8000
# --- Bouncer ("Connect with another client…") ---------------------------------
# Dedicated container from the gateway image; only a process with
# IRCFIBER_BNC_PORT set listens. TLS terminates in-process using the LE
# cert Caddy obtains for bnc_public_host (mounted read-only from the Caddy
# data volume). Add bnc_public_host to caddy_extra_serve_hosts and a
# non-proxied Cloudflare A record for it (see host_vars).
bnc_enabled: true
bnc_public_host: "bnc.{{ ircfiber_domain }}"
bnc_public_port: 7000
bnc_container_name: "ircfiber-bnc"
bnc_tls_cert_path: "/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ bnc_public_host }}/{{ bnc_public_host }}.crt"
bnc_tls_key_path: "/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/{{ bnc_public_host }}/{{ bnc_public_host }}.key"
# --- Caddy --------------------------------------------------------------------
caddy_data_volume: "ircfiber_caddy_data"
caddy_config_volume: "ircfiber_caddy_config"

# --- Backups ------------------------------------------------------------------
backup_dir: "/var/backups/ircfiber"
backup_keep_days: 14
backup_s3_enabled: false
backup_s3_bucket: ""
backup_s3_prefix: "ircfiber/"

# --- Operations ---------------------------------------------------------------
common_upgrade: false
image_prune_keep_count: 3

# --- Image build (control node) -----------------------------------------------
# The directory containing the IRC Fiber repo (with Containerfile, source/, public/, views/)
# Playbooks live in deploy/playbooks/, so the repo root is two levels up.
ircfiber_repo_root: "{{ playbook_dir }}/../.."
ircfiber_build_target: "release"

# Gateway image (D / full app)
ircfiber_gateway_containerfile: "Containerfile.site"
ircfiber_gateway_build_args:
  LDC_VERSION: "1.41.0"
  TARGETARCH: "{{ 'amd64' if ansible_architecture == 'x86_64' else ('arm64' if ansible_architecture == 'aarch64' else ansible_architecture) }}"
ircfiber_gateway_image_name: >-
  {{ (docker_registry_url + '/' if (docker_registry_url | length > 0) else '')
     + docker_registry_namespace + '/irc-fiber-gateway' }}
ircfiber_gateway_image_full: "{{ ircfiber_gateway_image_name }}:{{ docker_image_tag }}"

# Engine image (D — same Containerfile as gateway, builds both binaries)
ircfiber_engine_containerfile: "Containerfile"
ircfiber_engine_build_args:
  TARGETARCH: "{{ 'amd64' if ansible_architecture == 'x86_64' else ('arm64' if ansible_architecture == 'aarch64' else ansible_architecture) }}"
ircfiber_engine_image_name: >-
  {{ (docker_registry_url + '/' if (docker_registry_url | length > 0) else '')
     + docker_registry_namespace + '/ircfiber-engine' }}
ircfiber_engine_image_full: "{{ ircfiber_engine_image_name }}:{{ docker_image_tag }}"

# --- Engine defaults ----------------------------------------------------------
# NOTE: ircfiber_engine_id has NO default — it MUST be set per-host in
# host_vars/<hostname>.yml or via inline inventory vars. The old default
# of "{{ inventory_hostname_short }}" silently leaked hostnames like
# ircfiber-ovh-1 as engine server IDs, creating duplicate registrations
# in Redis when the correct host_vars override wasn't applied.
# Every engine host in [ircfiber_engines] must define its own id.
ircfiber_engine_bind_address: "0.0.0.0"
ircfiber_engine_admin_port: 8091
ircfiber_engine_log_level: "info"
# Per-user IPv6 (IRCCloud-style): routed prefix giving each user their own IP.
# Leave empty to disable (fallback to direct/Mullvad). Example: "2001:db8:abcd:0012::/64"
# When set, host is auto-configured with ip_nonlocal_bind + local route so any
# IID in the prefix is bindable without per-user ip addr add.
ircfiber_ipv6_prefix: ""
# rDNS pool host for id-<uid>.pool (e.g. "highgate.ircfiber.com") — optional, for PTR/WHOIS
ircfiber_ipv6_pool_host: ""

# --- Gateway defaults ---------------------------------------------------------
ircfiber_gateway_log_level: "info"
ircfiber_admin_password: "{{ vault_ircfiber_admin_password }}"  # set in vault.yml — no default

# --- IRCd (InspIRCd 4 + Anope 2 services) --------------------------------------
# Pinned upstream images (multi-arch). Anope 2.0.x links to InspIRCd 4 via
# its inspircd3 protocol module.
ircd_port_plain: 6667
ircd_port_tls: 6697
ircd_image: "inspircd/inspircd-docker:4.11.0"
ircd_container_name: "ircfiber-ircd"
# /inspircd/data — xline.db, permchannels.conf. (The old Ergo volume
# ircfiber_ircd_data is left in place untouched for rollback.)
ircd_data_volume: "ircfiber_inspircd_data"
ircd_services_image: "anope/anope:2.0.20"
ircd_services_container_name: "ircfiber-services"
ircd_services_data_volume: "ircfiber_services_data"

# --- Cloudflare DNS ------------------------------------------------------------
# Used by the `cloudflare` role to point DNS records at this host's public IP.
# `cloudflare_zone` is the registered domain (the zone that owns the records).
# Override per host in inventories/production/host_vars/<hostname>.yml.
# `cloudflare_target_ip` MUST be set in host_vars; the playbook refuses to
# auto-discover it (use `tailscale netcheck` to find the right value).
#
# When using Cloudflare Tunnel (cloudflared), DNS records are managed
# automatically by Cloudflare Zero Trust when you add Public Hostnames to
# the tunnel. The `cloudflare` role for manual A records becomes optional.
cloudflare_zone: "ircfiber.com"          # the registered CF zone
cloudflare_proxied: false                # true = orange cloud (CF proxies traffic),
                                         # false = DNS-only (CF is just authoritative DNS)
cloudflare_record_ttl: 300                # seconds; only used when cloudflare_proxied=false
cloudflare_record_prefixes:               # record names under cloudflare_zone to manage
  - "@"                                  # apex (e.g. ircfiber.com)
  - "www"                                # e.g. www.ircfiber.com

# --- Cloudflare Tunnel (cloudflared) -------------------------------------------
cloudflared_image: "cloudflare/cloudflared:latest"
cloudflared_container_name: "ircfiber-cloudflared"
cloudflared_no_autoupdate: true
cloudflared_restart_policy: "unless-stopped"
# Port Caddy listens on for tunnel-originated HTTP traffic.
# Must match caddy_tunnel_port in the Caddy role defaults.
cloudflared_caddy_tunnel_port: 8080

# --- Preflight assertions -----------------------------------------------------
ircfiber_min_docker_version: "20.10.0"
ircfiber_min_ubuntu_codename: ["jammy", "noble"]   # 22.04, 24.04
ircfiber_min_debian_codename: ["bookworm", "bullseye"]
