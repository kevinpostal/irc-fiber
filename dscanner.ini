; D-Scanner configuration for IRC Fiber.
; Loaded via `--config dscanner.ini` (see the `dscanner-*` targets in the
; Makefile). All checks run with their defaults unless overridden below.
;
; exception_check — the unit-test harnesses (app_test, app_test_real,
; logging_format_test) deliberately catch Throwable so that a failing
; AssertError (an Error, not an Exception) in one test does not abort the
; whole suite. Narrowing those catches to `catch (Exception)` would regress
; the harness, so the check is scoped off for exactly those modules.
[analysis.config.ModuleFilters]
exception_check="-app_test,-app_test_real,-logging_format_test"
