  - id: W3-T04
    title: ircStore.svelte.test.ts — initiateRejoin + sync-guard test suite
    description: |
      Add a new top-level `describe('initiateRejoin', ...)` block to
      `src/stores/ircStore.svelte.test.ts`, placed AFTER the existing
      `'sync guard for in-flight JOIN'` describe (around line 1348) so
      readers see the related invariants together.

      Required test cases (use the existing `createNetwork` /
      `createBuffer` helpers; mock sendRaw via the existing test wiring).
      Total: 10 cases.

      1. `initiateRejoin sets the state-machine quartet` — pre-condition:
         a real (non-phantom) buffer with isJoined=false; assert
         joinInFlight=true, pendingIsJoined=true, pendingConfirmations=2,
         joinError=null after the call.
      2. `initiateRejoin idempotent under isJoinPending` — call twice;
         assert sendRaw + markJoinPending called exactly once.
      3. `initiateRejoin on disconnected network does NOT reconnect
         by default` — net.connected=false; assert
         `vi.mocked(reconnectNetwork)` was NOT called.
      4. `initiateRejoin with allowReconnect=true on disconnected
         network DOES reconnect` — same net, pass opts; assert
         reconnectNetwork WAS called.
      5. `initiateRejoin on connected network with allowReconnect=true
         does NOT reconnect` — net.connected=true; assert no call.
      6. `initiateRejoin adds current nick to buf.users` — pre-pop; nicks
         array grows by 1, contains net.currentNick as bare nick.
      7. `initiateRejoin pre-pop is safe under JOIN-self echo + 353 follow-up`
         — call initiateRejoin (pre-populates `me`); then simulate the
         JOIN-self echo for the same nick via `updateChannelUsers('n1',
         '#chan', 'JOIN', 'me')`; then simulate a 353 with `@me` via
         `updateChannelUsers('n1', '#chan', '353', 'sender', ['#chan',
         '', '@me'])`. Assert: buf.users has EXACTLY one entry where
         `stripPrefix(u.nick) === 'me'`; that entry's `nick === '@me'`
         and `prefix === '@'`. (Reflects real production ordering:
         pre-pop → JOIN-self echo → 353.)
      8. `sync with isJoined:false arriving immediately after
         initiateRejoin does NOT clobber isJoined=true` — pre-condition:
         existing buffer isJoined=true (current joined state from a prior
         JOIN for self); call initiateRejoin (sets pendingIsJoined=true
         with pendingConfirmations=2). Fire a sync snapshot with
         isJoined=false on the same buffer. Assert: isJoined stays
         true; pendingIsJoined still defined; pendingConfirmations
         decremented.
      9. `WS resume with buffersToDelete during in-flight JOIN does not
         reap` — call initiateRejoin (which calls recordJoin); fire a
         `buffersToDelete` WS message containing the same bufferName.
         Assert: buffer survives (activeJoinList guard preserved).
      10. `WS-reconnect race: clicking Rejoin on a disconnected network`
         — known-issue regression test. Simulates: net.connected=false;
         user clicks Rejoin from BufferHeader; helper fires
         reconnectNetwork (allowReconnect=true) AND recordJoin (so
         activeJoinList has the buffer); THEN resetPendingState fires
         from the WS-reset hook (clears pendingJoins + joinInFlight +
         pendingIsJoined + pendingConfirmations but PRESERVES
         activeJoinList); THEN an engine sync arrives showing the
         buffer as not-yet-joined (because the engine's JOIN list
         hadn't refreshed yet). Assert: activeJoinList still contains
         the buffer (buffersToDelete guard valid); isJoined transitions
         to false on the sync (document this as a known flicker window).
         The brief `isJoined=false` flicker is acceptable because the
         engine's eventual JOIN echo restores isJoined=true within one
         WS round-trip. If unacceptable, mitigation is to add a
         `reconnectQueue: Set<string>` paralleling `activeJoinList`
         that survives resetPendingState. Out of scope for this plan.

      Use the existing test scaffolding (`flushSync`, mock `sendRaw`,
      `vi.mocked(reconnectNetwork)`).

