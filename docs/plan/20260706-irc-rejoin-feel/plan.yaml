  - id: W4-T01
    title: Browser smoke against acceptance criteria (gem-browser-tester)
    description: |
      Manual smoke against the user-stated acceptance criteria under
      `make local-dev-up` (or running dev server). Use playwright /
      vitest-browser tooling already in the project.

      Scenario A — happy path:
      1. Open the IRC Fiber dev server in browser.
      2. Connect to a network with at least one parted channel like #test.
      3. Click Rejoin via context menu.
      4. Within 50ms, assert:
         - Sidebar .buffer-item has .buffer-item--joining class.
         - BufferHeader shows .join-inflight-chip.
         - Member panel (if open) includes the user's nick.
      5. After JOIN echo arrives (usually <200ms):
         - .join-inflight-chip is gone.
         - .buffer-item--joining is gone.
         - Member panel still shows the nick.

      Scenario B — sync clobber regression:
      1. Pause JS events in the dev server (use `page.route` to delay
         the WS sync message by 500ms).
      2. Click Rejoin.
      3. Within the WS round-trip window, observe isJoined stays true.
      4. When sync with isJoined:false arrives, isJoined still true.

      Scenario C — disconnect rejoin:
      1. Disconnect via ConnectionStatus → markUserDisconnected path.
      2. Click Rejoin.
      3. Observe: reconnectNetwork fires + JOIN queues.
      4. After reconnect, JOIN completes, buffer goes active.

      Scenario D — invite-only failure:
      1. Have a known invite-only channel.
      2. Click Rejoin.
      3. Within ~500ms, observe: .join-error-chip "Invite-only channel"
         rendered (not .join-inflight-chip — the failure response
         overrides the in-flight chip).

      Capture screenshots + timeline logs into
      `docs/plan/20260706-irc-rejoin-feel/logs/smoke-*.png`.

      Output a brief markdown summary at
      `docs/plan/20260706-irc-rejoin-feel/logs/smoke-summary.md` listing
      pass/fail per scenario.
