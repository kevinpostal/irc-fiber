plan_id: 20260706-irc-rejoin-feel
objective: Make IRC Fiber's channel "Click-to-Rejoin" UX match IRCCloud's feel — instant visual feedback (Joining chip + sidebar modifier + member panel self-row within one tick), resilient against stale-engine-sync clobber, unified across every rejoin entry point.
created_at: '2026-07-06T22:47:00Z'
created_by: gem-planner
status: pending
tldr: |
  Three rejoin entry points (BufferHeader, ChannelContextMenu, /cycle|hop|rejoin slash)
  and one URL-nav auto-joiner (maybeAutoJoinChannel) all diverge from the canonical
  state-machine init — none consistently set pendingIsJoined/pendingConfirmations, only
  BufferHeader sets markJoinPending/recordJoin/joinInFlight, and ChannelContextMenu is
  a stripped sendRaw. Consolidate around one helper initiateRejoin in
  ircStore.svelte.ts, mirror joinInFlight in the Sidebar (.buffer-item--joining on
  ALL four channel buffer-item sites: 150 Pinned, 251 Active, 293 Inactive, 364
  Archived), pre-populate self-nick into buf.users at click time with stripPrefix-safe
  dedup, drop the PART-before-JOIN from /cycle|hop|rejoin to match IRCCloud semantics,
  and add 10 store tests + 7 component tests that pin the invariants from W1-T06 / W7-T01.

plan_metrics:
  wave_1_task_count: 1
  total_dependencies: 14
  risk_score: medium
quality_warnings:
  - "Wave 1 is a deliberate consolidation across 4 entry-point files (BufferHeader, ChannelContextMenu, slashCommands, App.svelte:maybeAutoJoinChannel) — implementer must read each callsite's prior behavior table from the task description before refactoring, otherwise W7-T01 invariants may regress."
  - "Self-nick pre-population at click time must dedup by stripPrefix (already true for 353/1710-1738). Do NOT use exact-match — services that auto-op grant a prefix char on JOIN echo and the 353 in-place promotion depends on dedup by stripped nick."

