tasks:
  # ─────────────────────────────────────────────────────────────────────────
  # WAVE 1 — extract `initiateRejoin` helper + collapse 4 entry points
  # ─────────────────────────────────────────────────────────────────────────
  - id: W1-T01
    title: Extract initiateRejoin helper and refactor all 4 rejoin entry points
    description: |
      Single design change spanning four files: introduce one helper
      `initiateRejoin(networkId, bufferName, opts)` in
      `frontend/src/stores/ircStore.svelte.ts` and rewire every rejoin
      entry point to delegate to it.

      HELPER SIGNATURE (new export in ircStore.svelte.ts, placed alongside
      `maybeAutoJoinChannel`'s sibling helpers — near line 388 / `markJoinPending`):

      ```ts
      interface InitiateRejoinOptions {
        /** When true, kick reconnectNetwork() if !network.connected.
         *  Defaults to false — only the BufferHeader Rejoin button wants
         *  to reconnect; context-menu / slash / URL-nav should let the
         *  existing connection-recovery paths handle that. */
        allowReconnect?: boolean;
      }
      export function initiateRejoin(
        networkId: string,
        bufferName: string,
        opts: InitiateRejoinOptions = {}
      ): void {
        const normalized = normalizeChannelName(bufferName);
        const net = ircState.networks.find(n => n.networkId === networkId);
        if (!net) return;
        const buf = net.buffers.find(b => b.name === normalized);

        // Idempotency: if a JOIN is already in flight for this buffer, the
        // existing pendingJoins entry blocks double-issuance. Mirrors
        // maybeAutoJoinChannel's guard at App.svelte:557.
        if (isJoinPending(networkId, normalized)) return;

        // Set the FULL state-machine quartet. This is the single source
        // of truth — every caller sets all four flags.
        if (buf) {
          buf.joinError = null;        // clear stale failure text
          buf.joinInFlight = true;     // drives BufferHeader chip + sidebar modifier
          buf.pendingIsJoined = true;  // belt-and-suspenders for WS-round-trip clobber
          buf.pendingConfirmations = 2; // require TWO confirming syncs to clear
          // W1-T06: track user-initiated JOIN so buffersToDelete during WS
          // resume cannot reap this buffer.
          prePopulateOwnNick(buf, net.currentNick);
        }
        markJoinPending(networkId, normalized);
        recordJoin(networkId, normalized);
        sendRaw(networkId, 'JOIN ' + normalized);

        if (opts.allowReconnect && !net.connected) {
          reconnectNetwork(networkId).catch(() => {});
        }
      }
      ```

      The helper imports reconnectNetwork from `'../stores/api'`.
      Add a small private helper `prePopulateOwnNick(buf, nick)` colocated
      inside ircStore.svelte.ts that mirrors the JOIN-for-self block at
      line 1710-1738 (stripPrefix-safe dedup so 353 in-place promotion
      at line 1696 still works).

      REFACTOR POINTS:
      - `BufferHeader.rejoin()` (BufferHeader.svelte:125-145) →
        replace its body with a single call to
        `initiateRejoin(activeNetwork.networkId, activeBufferObj.name, { allowReconnect: true });`
        preserves the existing disconnect-then-JOIN behavior.
      - `ChannelContextMenu.rejoin()` (ChannelContextMenu.svelte:89-93) →
        replace with `initiateRejoin(networkId, buf.name, { allowReconnect: false });`
        preserves the onClose behavior (still called after).
      - `slashCommands.ts:201-206` (/cycle /hop /rejoin) →
        replace its **double** `sendRaw` call — `sendRaw('PART ' + chan)`
        + `sendRaw('JOIN ' + chan + ...)` — with a single
        `initiateRejoin(networkId, chan, { allowReconnect: false })`.
        This is a user-visible `/cycle` semantics change: the previous
        behavior was PART-then-JOIN, the new is JOIN-only — matches
        IRCCloud's "just rejoin" feel. PART-before-JOIN would clobber
        `isJoined` mid-flow and break the optimistic chip. Keep the
        key extraction unchanged. Log this in
        `docs/CHANGELOG.md` under the next release.
      - `maybeAutoJoinChannel` (App.svelte:545-569) →
        DELEGATE — keep the URL-nav guards (already-joined, !connected,
        isJoinPending skip) but call initiateRejoin for the actual side
        effects. Move the joinInFlight+joinError+pendingIsJoined writes
        into the helper. Keep the early-return guards inline so
        maybeAutoJoinChannel retains its lightweight entry-point
        character.

      DO NOT TOUCH updateChannelUsers, JOIN-for-self echo handler, or
      resetPendingState. DO NOT change the wire protocol or the engine.
