assumptions:
  - "The sync-clobber architecture in updateNetworkFromSync (ircStore.svelte.ts:1378-1412) is correct; the rejoin entry points must conform to it. We do not redesign the sync guard mechanism."
  - "maybeAutoJoinChannel (App.svelte:545-569) is the canonical pre-existing pattern that already sets joinInFlight+pendingIsJoined+markJoinPending+recordJoin. We delegate to a shared helper rather than rewrite, to avoid duplicated logic."
  - "Existing chip UI in BufferHeader.svelte:174-184 (.join-inflight-chip, .join-error-chip) is sufficient — we keep its render location and styling, only ensure the state flags are set correctly by every rejoin entry point."
  - "IRCCloud's 'Joining…' textual chip is acceptable; no spinner design work. .join-spinner is already a span with aria-hidden (line 176); no change."
  - "Sidebar styling for .buffer-item--joining follows the visual vocabulary already established by .buffer-item.unread / .buffer-item.highlight (italic + reduced opacity); no design-system work needed."
  - "slashCommands.ts:201-206 (/cycle /hop /rejoin) is also a rejoin entry point and shares the same consolidation. Without it, /cycle can vanish the buffer from the active section without engaging recordJoin, so buffersToDelete may reap it on WS resume."
  - "ircCloud-parity means visible chip + sidebar modifier within 50ms of click. Real numbers come from 1-frame tick scheduling in Svelte 5; we don't need to instrument timer claims — vitest-browser assertions prove the DOM transition."
  - "The 'no flicker on 473' property is structural: joinInFlight=true drives the Joining chip, joinError='invite-only' drives the error chip. They render in if/else if, so a failure that arrives during the WS round-trip window can't show both — it shows the error chip directly. No animation-suppression code needed."
  - "We do NOT change the engine, the wire protocol, or the Redis snapshot schema. Frontend-only."

