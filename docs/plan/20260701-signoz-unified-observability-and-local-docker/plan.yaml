plan_id: 20260701-signoz-unified-observability-and-local-docker
objective: |
  Unify observability on SigNoz for IRC Fiber. Fluent Bit replaces the bridge
  otel-collector's filelog/containers receiver as the Docker-log shipper,
  pushing container logs via OTLP HTTP to signoz-ingester. SigNoz stores
  traces, logs, and metrics natively — Tempo + Prometheus become redundant.
  The bridge otel-collector stays for network-crossing OTLP proxy (engine
  traces+metrics) but loses its filelog receiver. Grafana repurposed to query
  SigNoz as its sole datasource. A new local Docker Compose
  (`deploy/local/docker-compose.yml`) uses the Foundry multi-container stack
  for dev/test parity.
created_at: 2026-07-01T12:15:00Z
updated_at: 2026-07-01T18:30:00Z
created_by: gem-planner
status: pending
tldr: |
  4-wave plan (14 tasks). Wave 1 (4): local Docker Compose (SigNoz Foundry
  multi-container stack) + smoke test + Vite proxy + test compose Fluent Bit.
  Wave 2 (4): Fluent Bit prod config (json parser, docker socket, recursion
  guard) + rewrite Ansible logging role + migrate Loki alerts to SigNoz +
  unified strip (old stack, bridge filelog, Tempo/Prometheus, orphaned assets,
  signoz role, signoz-test). Wave 3 (3): Grafana SigNoz datasource (correct
  port :8080 query-service, NOT ClickHouse) + Caddy route cleanup + deploy
  SigNoz alert rules. Wave 4 (3): local README + Makefile targets + CREATE
  AGENTS.md observability section.

