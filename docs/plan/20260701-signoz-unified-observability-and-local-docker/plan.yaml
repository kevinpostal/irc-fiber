  - id: w2-t3-migrate-loki-alerts-to-signoz
    title: Migrate Loki alerting rules to SigNoz alert rules
    description: |
      Migrate all 14 alert rules from
      `deploy/roles/logging/templates/loki-rules.yml.j2` to SigNoz
      LOGS_BASED_ALERT rules. Create a migration manifest as
      `deploy/roles/logging/signoz-alerts.yml.j2` — an Ansible template
      that renders to a list of SigNoz alert rule definitions.
      The 14 rules to migrate:
      1. IrcfiberTLSFailures — event=tls_fail, 3 in 5m → severity warning
      2. IrcfiberReconnectStorm — event=reconnect_scheduled, 10 in 5m → warning
      3. IrcfiberHandoffTLSFailures — event=handoff_fail,reason=tls → warning
      4. IrcfiberSASLFailures — event=sasl_fail, 2 in 10m per network → critical
      5. IrcfiberEngineSilent — no logs for 10m → critical
      6. IrcfiberErrorSpike — level=error, rate >1/s for 5m → warning
      7. IrcfiberConnectionDrop — event=disconnected, 3 in 5m → warning
      8. IrcfiberPrefsFieldInvalid — event=prefs_field_invalid → warning
      9. IrcfiberPrefsLoadFail — event=prefs_load_fail → critical
      10. IrcfiberTLSWriteFail — event=tls_write_fail → warning
      11. IrcfiberCmdExecFail — event=cmd_exec_fail, 10 in 5m → warning
      12. IrcfiberCmdDroppedNoConn — event=cmd_dropped_no_conn → warning
      13. IrcfiberLineTooLong — event=line_too_long → warning
      14. IrcfiberServerErrorDetected — event=server_error_detected → warning
      Each rule maps the Loki LogQL query to a SigNoz filter expression
      (`attribute.event = 'tls_fail'`) + threshold + evaluation window.
      NOTIFY: The migration manifest should document the notification
      channel (Slack webhook or PagerDuty, per user preference).
    wave: 2
    agent: gem-devops
    covers:
      - alert-migration
      - signoz-alerts
    dependencies:
      - w2-t2-rewrite-logging-role
    conflicts_with: []
    context_files:
      - path: deploy/roles/logging/templates/loki-rules.yml.j2
        description: Source rules to migrate (full file with 14 rules)
      - path: docs/plan/20260630-admin-signoz-logs-panel/plan.yaml
        description: Reference for existing SigNoz integration patterns and alerting conventions
    acceptance_criteria:
      - "h1: `deploy/roles/logging/signoz-alerts.yml.j2` exists and contains all 14 rules mapped to SigNoz LOGS_BASED_ALERT format"
      - "h2: Each rule has `filter: attribute.event = '<event_name>'` replacing the Loki LogQL selector"
      - "h3: Thresholds and evaluation windows match Loki rules"
      - "h4: Ansible syntax check passes"
      - "h5: `deploy/roles/logging/templates/loki-rules.yml.j2` is deleted"
    success_criteria:
      - "Ansible template renders valid SigNoz alert rule JSON"
      - "Each Loki rule has exactly one SigNoz counterpart (title, severity, event filter match)"
    handoff:
      target_files:
        - deploy/roles/logging/signoz-alerts.yml.j2
        - deploy/roles/logging/templates/loki-rules.yml.j2 (to delete)
      do_not_reinvestigate:
        - "The 14 Loki rule patterns and thresholds are the source of truth"
      minimal_change: "Create alert migration template; delete old loki-rules.yml.j2"
      acceptance_checks:
        - "Each migrated rule has the same severity+threshold as the Loki original"
        - "`grep -r 'event=' deploy/roles/logging/signoz-alerts.yml.j2` matches 14 event types"

  - id: w2-t4-unified-strip
    title: Remove old stack, bridge filelog, Tempo/Prometheus, orphaned assets
    description: |
      After Fluent Bit is shipping logs (w2-t1), the new docker-compose
      rendered (w2-t2), SigNoz alerts active (w2-t3), and Grafana datasource
      deployed (w3-t1), execute the unified cleanup:
      A) Old stack removal (original w2-t4):
         - `docker compose -f /etc/ircfiber/logging/docker-compose.yml down`
         - Remove Docker volumes: ircfiber_loki_data, ircfiber_loki_config,
           ircfiber_promtail_config, ircfiber_promtail_positions,
           ircfiber_tempo_data, ircfiber_tempo_config,
           ircfiber_otelcol_config, ircfiber_prometheus_data
         - Remove old config dirs: /etc/ircfiber/{loki,promtail,tempo,otelcol,prometheus}/
         - Verify no containers running for old services
      B) Bridge filelog/containers strip:
         - Edit `deploy/roles/signoz_bridge/templates/otel-collector-config.yaml.j2`
         - Remove the `filelog/containers` receiver block (lines 136-156)
         - Remove `filelog/containers` from the `logs` pipeline receiver list
         - Optionally add transform/newrelic processor note to ensure
           container log attributes are not duplicated (Fluent Bit now
           sets its own resource attributes)
         - Keep all other receivers (otlp, hostmetrics, docker_stats, filelog/caddy)
         - Keep all processors (memory_limiter, batch, resourcedetection,
           transform/newrelic, redaction)
         - Keep the exporter (otlp/signoz to signoz-ingester:4317)
         - Restart the bridge collector after config change
         - Verify: `grep -c 'filelog/containers' otel-collector-config.yaml` returns 0
      C) Tempo + Prometheus removal (merged from w3-t2 — user already decided):
         - Remove Tempo datasource from Grafana provisioning
         - Remove Prometheus datasource from Grafana provisioning
         - Remove Tempo container + volume (if still running)
         - Remove Prometheus container + volume (if still running)
         - (Already handled by the logging role rewrite in w2-t2 for
           the compose template; this step ensures orphan containers
           are also removed)
      D) Old signoz role removal:
         - Remove `deploy/roles/signoz/` entire directory (old ClickHouse
           config role — superseded by Foundry)
         - Audit all playbooks for `roles/signoz` references and update
         - Remove `deploy/test/signoz-config/` entire directory (ClickHouse
           config regression tests — no longer applicable)
      E) Orphaned test/debug assets removal:
         - Check `deploy/roles/grafana/` for stray test/cruft files and remove
         - Check `deploy/roles/signoz_bridge/` for stray test/debug files and remove
         - Check `deploy/roles/caddy/` for orphaned signoz test assets and remove
      Task is idempotent — exit 0 if items already absent.
    wave: 2
    agent: gem-devops
    covers:
      - stack-teardown
      - bridge-cleanup
      - cleanup
      - disposition
    dependencies:
      - w2-t3-migrate-loki-alerts-to-signoz
      - w3-t1-signoz-data-source
    conflicts_with: []
    context_files:
      - path: deploy/roles/signoz_bridge/templates/otel-collector-config.yaml.j2
        description: Bridge config to strip filelog/containers from
      - path: deploy/roles/signoz/
        description: Old role directory to remove entirely
      - path: deploy/test/signoz-config/
        description: Old test directory to remove entirely
    acceptance_criteria:
      - "A-h1: `docker ps -a --filter name=ircfiber-loki --filter name=ircfiber-promtail --filter name=ircfiber-tempo --filter name=ircfiber-otel-collector --filter name=ircfiber-prometheus` returns empty"
      - "A-h2: `docker volume ls --filter name=ircfiber_loki --filter name=ircfiber_promtail --filter name=ircfiber_tempo --filter name=ircfiber_otelcol --filter name=ircfiber_prometheus` returns empty"
      - "B-h1: `grep -c 'filelog/containers' deploy/roles/signoz_bridge/templates/otel-collector-config.yaml.j2` returns 0"
      - "B-h2: Bridge collector restarts clean: `docker inspect ircfiber-otel-collector --format '{{.State.Status}}'` returns running"
      - "C-h1: Grafana datasource list shows no Tempo or Prometheus datasource"
      - "D-h1: `ls deploy/roles/signoz/ 2>&1` returns 'No such file or directory'"
      - "D-h2: `ls deploy/test/signoz-config/ 2>&1` returns 'No such file or directory'"
      - "E-h1: No files named *test*, *debug*, or *cruft* in deploy/roles/grafana/, deploy/roles/signoz_bridge/, deploy/roles/caddy/"
    success_criteria:
      - "Run cleanup tasks; verify old services absent; verify bridge config has no filelog/containers; verify signoz role dir removed; verify Grafana still serves dashboards"
    handoff:
      target_files:
        - deploy/roles/logging/tasks/cleanup-old-stack.yml
        - deploy/roles/signoz_bridge/templates/otel-collector-config.yaml.j2 (to edit)
      do_not_reinvestigate:
        - "filelog/containers in bridge config must be removed (lines 136-156)"
        - "Bridge otlp receiver and transform/newrelic processor stay"
        - "signoz_test and signoz role directories are safe to delete (superseded by Foundry)"
      minimal_change: "Edit bridge config in place; remove dirs; add cleanup task file"

