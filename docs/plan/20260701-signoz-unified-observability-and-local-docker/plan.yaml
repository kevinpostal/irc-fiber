tasks:
  # ═══════════════════════════════════════════════════════════════════════
  # WAVE 1 — Local Docker Compose (test harness for entire unified stack)
  # ═══════════════════════════════════════════════════════════════════════
  - id: w1-t1-local-compose
    title: Create deploy/local/docker-compose.yml with SigNoz Foundry stack
    description: |
      Create `deploy/local/docker-compose.yml` with the Foundry multi-container
      SigNoz stack (NOT the combined signoz/signoz image — which is brittle on
      ARM64). Services:
      - `signoz-query-service`: signoz/query-service:latest on port 8080
        (REST API — NOT ClickHouse). Host-map 3301→8080. Healthcheck on
        `http://localhost:8080/api/v1/services`.
      - `signoz-ingester`: signoz/otel-collector:latest on ports 4317 (gRPC)
        and 4318 (HTTP OTLP). Accepts traces+metrics+logs OTLP HTTP.
        Healthcheck on :13133.
      - `signoz-clickhouse`: clickhouse/clickhouse-server:24.8 on ports
        9000 (native), 8123 (HTTP). Named volume for data persistence.
        Memory limit env: `CLICKHOUSE_MEMORY_LIMIT_GB=2`.
      - `signoz-signoz`: signoz/frontend:latest on port 3301 (UI). Healthcheck.
      - `signoz-alertmanager`: signoz/alertmanager:latest. Internal only.
      - `fluent-bit`: fluent/fluent-bit:latest, mounts
        `/var/lib/docker/containers/` read-only via volumes.
        Config inline: [INPUT] tail with docker parser, Path_Exclude pattern
        for Fluent Bit's own logs (recursion guard).
        [OUTPUT] opentelemetry to signoz-ingester:4318.
        `json_parser` operator on `$log` field for structured extraction
        of `event`, `level`, `network`, `nick`, `channel`.
      - `ircfiber-gateway`: build from Containerfile, command `/app/irc-fiber`.
        Env: IRCFIBER_OTEL_ENDPOINT=http://signoz-ingester:4318,
        IRCFIBER_REDIS_URL=redis://redis:6379/0,
        IRCFIBER_MONGO_URL=mongodb://mongo:27017/ircfiber. Port 8090:8090.
      - `ircfiber-engine`: same build, command `/app/irc-fiber-engine`.
        Env: IRCFIBER_SERVER_ID=localdev1,
        IRCFIBER_OTEL_ENDPOINT=http://signoz-ingester:4318.
      - `ircd`: build from docker/ircd/Dockerfile, port 6667.
      - `redis`: redis:7-alpine with healthcheck.
      - `mongo`: mongo:7 with healthcheck.
      All services on a shared `ircfiber_local` bridge network.
      Named volumes: redis_data, mongo_data, signoz_clickhouse_data.
      Healthchecks on every service.
    wave: 1
    agent: gem-devops
    covers:
      - local-dev-compose
      - signoz-foundry
      - fluent-bit-setup
    dependencies: []
    conflicts_with: []
    context_files:
      - path: docker-compose.test.yml
        description: Reference for IRC service config (env vars, healthchecks, networks)
      - path: Containerfile
        description: Source for local gateway + engine build
      - path: deploy/roles/signoz_bridge/templates/otel-collector-config.yaml.j2
        description: Reference for OTLP ingest pattern and port conventions
    acceptance_criteria:
      - "h1: `docker compose -f deploy/local/docker-compose.yml up -d` exits 0"
      - "h2: `curl -fsS http://localhost:8090/health` returns OK"
      - "h3: `curl -fsS http://localhost:3301/api/v1/services` returns valid JSON services list (port 3301 maps to signoz-query-service:8080)"
      - "h4: `curl -fsS http://localhost:4318/v1/logs` with OTLP-shaped POST returns 200 (signoz-ingester reachable)"
      - "h5: `curl -fsS http://localhost:6667` connects to ircd"
      - "h6: All 11 containers show healthy in `docker ps --filter network=ircfiber_local`"
      - "h7: Fluent Bit starts without config errors: `docker logs ircfiber-fluent-bit 2>&1 | grep -i error` returns empty"
    success_criteria:
      - "Run `docker compose -f deploy/local/docker-compose.yml up -d` and verify all services healthy within 120s"
      - "Verify SigNoz UI at http://localhost:3301 loads"
      - "Verify gateway health at http://localhost:8090/health"
      - "Verify Fluent Bit ingesting container logs appears in SigNoz logs explorer"
    handoff:
      target_files:
        - deploy/local/docker-compose.yml
      do_not_reinvestigate:
        - "Port 3301 maps to signoz-query-service:8080 (API port — NOT ClickHouse)"
        - "Fluent Bit OTLP endpoint: signoz-ingester:4318"
        - "Engine OTel endpoint: signoz-ingester:4318 (no bridge needed in local compose)"
      minimal_change: "Create new file deploy/local/docker-compose.yml; do NOT modify docker-compose.test.yml"
      acceptance_checks:
        - "Verify SigNoz shows >0 services after 60s ingestion window"
        - "Verify engine connects to ircd (look for JOIN event in SigNoz logs)"

  - id: w1-t2-smoke-script
    title: Create tests/local-dev/smoke-observability.sh
    description: |
      Create a bash smoke test script that validates the entire local stack
      end-to-end. Checks:
      a) Gateway health: `curl -fsS http://localhost:8090/health`
      b) SigNoz API reachable: `curl -fsS http://localhost:3301/api/v1/services`
         returns valid JSON with at least one entry.
      c) OTLP ingestion: query
         `http://localhost:3301/api/v5/query_range` with a known service name
         (ircfiber-gateway or ircfiber-engine) — confirm at least one trace
         or log record returned.
      d) Fluent Bit running: `docker ps --filter name=ircfiber-fluent-bit --format json`
         and container status = running.
      e) OTLP endpoint reachable: `curl -s -o /dev/null -w '%{http_code}'
         http://localhost:4318` returns non-zero (signoz-ingester port is
         HTTP-accessible, not a port conflict).
      Each check prints `PASS:` or `FAIL:` with ISO-8601 timestamp and the
      response details. Exits 0 only if ALL checks pass.
    wave: 1
    agent: gem-implementer
    covers:
