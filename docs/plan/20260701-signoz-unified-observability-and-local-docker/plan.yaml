  - id: w2-t1-fluent-bit-prod-config
    title: Create Fluent Bit production config with JSON extraction and recursion guard
    description: |
      Create `deploy/roles/logging/templates/fluent-bit.conf.j2` — the
      Ansible template for production Fluent Bit config on the OVH server.
      Config structure:
      - [INPUT] tail of /var/lib/docker/containers/*/*-json.log with
        `docker` parser, tag docker.*, Mem_Buf_Limit 50MB.
        Exclude_Path: pattern matching `ircfiber-fluent-bit` container logs
        (recursion guard — Fluent Bit must not read its own logs).
      - No Kubernetes filter (bare Docker deployment).
      - [FILTER] json_parser on `$log` body to extract structured fields:
        `event`, `level`, `network`, `nick`, `channel` from IRC engine
        JSON log lines. These become OTLP log record attributes so
        `attribute.event = join` queries work in SigNoz.
      - [FILTER] modify: add `service` label derived from container name
        (mirror current Promtail's component label logic).
      - [OUTPUT] opentelemetry to signoz-ingester:4318 via HTTP
        (the SigNoz ingester accepts OTLP HTTP on port 4318).
        Logs_Format otlp.
      - [OUTPUT] (optional) stdout for debugging — disabled by default.
      JSON field extraction detail:
        The engine emits structured JSON like:
        `{"event":"join","level":"info","network":"LiberaChat","nick":"bot","channel":"#dev"}`
        Fluent Bit must:
        a) Parse the `log` field with a `json_parser` operator
        b) Extract top-level keys as individual attributes
        c) Pass them through to the OTLP output as log record attributes
      Container mount: Docker socket + /var/lib/docker/containers/
      (the docker-compose template in w2-t2 mounts these. The config
      file is just the Fluent Bit config — volume mounts are in the
      docker-compose template).
    wave: 2
    agent: gem-devops
    covers:
      - fluent-bit-config
      - production-logging
      - json-field-extraction
    dependencies:
      - w1-t1-local-compose
    conflicts_with: []
    context_files:
      - path: deploy/roles/logging/templates/promtail-config.yml.j2
        description: Reference — current log-shipping config (will be replaced)
      - path: deploy/roles/signoz_bridge/templates/otel-collector-config.yaml.j2
        description: Reference for OTLP port conventions and structured log field patterns
    acceptance_criteria:
      - "h1: `deploy/roles/logging/templates/fluent-bit.conf.j2` exists and is valid Fluent Bit config syntax"
      - "h2: Template uses {{ }} Jinja2 vars for configurable host/port/parser"
      - "h3: OTLP output targets signoz-ingester:4318 (configurable via ansible var)"
      - "h4: Config excludes Fluent Bit's own container logs (Exclude_Path recursion guard)"
      - "h5: Config has json_parser operator extracting event, level, network, nick, channel from log body"
    success_criteria:
      - "Validate with: `docker run --rm -v $(pwd)/deploy/roles/logging/templates/fluent-bit.conf.j2:/fluent-bit/etc/fluent-bit.conf fluent/fluent-bit:latest --dry-run`"
      - "Rendered template with defaults passes Fluent Bit's config parser"
    handoff:
      target_files:
        - deploy/roles/logging/templates/fluent-bit.conf.j2
      do_not_reinvestigate:
        - "OTLP output to signoz-ingester:4318 (NOT the bridge otel-collector)"
        - "Recursion guard: exclude container name matching ircfiber-fluent-bit"
        - "JSON extract fields: event, level, network, nick, channel"
      minimal_change: "Create new template file; do not modify other templates in this task"
      acceptance_checks:
        - "Template renders to valid Fluent Bit config with ansible-playbook --check"

