# PLANNING ANALYSIS (HIGH complexity — full section)
# ═══════════════════════════════════════════════════════════════════════════
open_questions:
  - question: |
      Fluent Bit OTLP output uses HTTP/1.1 (not gRPC). Does signoz-ingester
      accept OTLP HTTP on port 4318 or only gRPC on 4317?
    context: |
      SigNoz ingester (otel-collector based) accepts both HTTP and gRPC by
      default. The bridge otel-collector uses gRPC (4317) for its export but
      Fluent Bit's OTLP plugin sends HTTP. Verify ingester config accepts
      /v1/logs HTTP before cutover.
    type: decision_blocker
    affects: [w2-t1, w3-t1]
  - question: |
      Fluent Bit's OTLP plugin preserves Docker log fields (container_name,
      container_id, source) as OTLP resource attributes. Do these need explicit
      mapping or are they automatically included?
    context: |
      The `docker` parser in Fluent Bit extracts fields like `time`,
      `log`, `source`, `container_id`, `container_name`. The OTLP plugin
      may or may not include all of these in the outgoing record. If IRC
      Fiber dashboards filter by container_name, we need explicit field
      mapping in the Fluent Bit config.
    type: decision_blocker
    affects: [w2-t1, w4-t1]
  - question: |
      signoz_bridge runs on both ircfiber_net AND ircfiber_logging. The local
      Docker Compose needs only ircfiber_net for bridge services. Should the
      local compose include a bridge-like OTLP proxy, or can engine push
      directly to signoz-ingester?
    context: |
      For local dev, the engine can push OTLP directly to signoz-ingester:4318
      (simpler). The bridge is only needed in production for the dual-network
      crossing. w1-t1 should configure engines to push to signoz-ingester:4318
      directly.
    type: decision_blocker
    affects: [w1-t1]
  - question: |
      Grafana Dashboards that query Loki/Tempo/Prometheus — do we migrate them
      to query SigNoz in this plan, or leave them broken and document?
    context: |
      Dashboard migration is explicitly out-of-scope in the original
      objective. These dashboards will show no data after the datasource
      switch. Plan to document the gap in AGENTS.md and the local README.
      A follow-up plan should migrate dashboards.
    type: decision_blocker
    affects: [w4-t3]

assumptions:
  - "Fluent Bit >= 2.2.0 has native OTLP output plugin (required for fluent-bit.conf.j2)."
  - "SigNoz Foundry multi-container images (signoz/otel-collector, signoz/query-service, signoz/frontend, etc.) are published for both linux/amd64 and linux/arm64."
  - "signoz-ingester accepts OTLP HTTP on port 4318 for /v1/logs, /v1/traces, /v1/metrics (standard otel-collector behavior)."
  - "Engine D code (tracing.d) pushes OTLP HTTP to the configured endpoint. The local compose points it to signoz-ingester:4318 directly (no bridge needed)."
  - "Fluent Bit's `docker` parser extracts container_name + container_id as top-level fields, which become OTLP resource attributes via the opentelemetry output plugin."
  - "ClickHouse in the local Foundry stack uses ephemeral storage by default — named volume (signoz_clickhouse_data) must be mounted explicitly."
  - "Grafana 11.x supports the grafana-signoz-datasource plugin (or the Infinity datasource fallback)."
  - "Loki alert rules migrate reasonably via SigNoz LOGS_BASED_ALERT with `attribute.event =` filters matching the LogQL `event=` selectors."

pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: |
        Fluent Bit OTLP output drops structured JSON fields (`event`,
        `level`, `network`) because the `docker` parser extracts them
        into the body but the OTLP output nests the entire body as a
        single string, burying the structured fields.
      likelihood: medium
      impact: high
      mitigation: |
        Test with a known engine log line (`event:join`). Verify in
        SigNoz logs explorer that `attribute.event = join` returns
        results. If the body is a flat string, add a `json_parser`
        operator in the Fluent Bit config to re-parse `$log` before
        OTLP serialization.
    - scenario: |
        Foundry multi-container stack fails to start on ARM64 Mac because
        signoz-clickhouse is only published for linux/amd64 and Rosetta 2
        falls over with a ClickHouse segfault.
      likelihood: high
      impact: high
      mitigation: |
        Pin signoz-clickhouse image to `clickhouse/clickhouse-server:24.8`
        (which has official ARM64 images). If the Foundry images require
        x86 ClickHouse, add `platform: linux/amd64` to the clickhouse
        service in docker-compose.yml.
    - scenario: |
        Engine/gateway OTel endpoint change causes a brief trace/metric
        gap during Fluent Bit cutover if the old bridge and new
        signoz-ingester are both online with conflicting hostname
        resolution.
      likelihood: low
      impact: medium
      mitigation: |
        For local dev: no bridge, engine → signoz-ingester directly, no
        conflict. For production: keep bridge (it stays), just remove its
        filelog receiver. Engine OTel endpoint unchanged (bridge still
        at ircfiber-otel-collector:4318).
    - scenario: |
        Grafana SigNoz datasource plugin not available or broken on
        Grafana 11.3.0, blocking cross-source dashboards.
      likelihood: medium
      impact: high
      mitigation: |
        w3-t1 must validate plugin availability FIRST. Fallback: use
        Infinity datasource (yesoreyeram-infinity-datasource). Document
        in the task.
    - scenario: |
        Local Docker Compose runs out of RAM on an 8GB dev machine
        (ClickHouse ~4GB, query-service ~512MB, ingester ~256MB,
        IRC stack ~1GB = ~5.8GB before macOS overhead).
      likelihood: high
      impact: medium
      mitigation: |
        Set ClickHouse memory limits via docker-compose env or
        `CLICKHOUSE_MEMORY_LIMIT_GB=2`. Configure
        `max_memory_usage=2GB` in clickhouse config overrides.
        Document prominently in README.
    - scenario: |
        Removing deploy/roles/signoz/ (old ClickHouse config role)
        breaks an existing playbook that includes this role.
      likelihood: medium
      impact: critical
      mitigation: |
        Audit all playbooks for `roles/signoz` references BEFORE
        removal. Update to use Foundry equivalent or remove the
        include. Document all callers in w2-t4.

coordination_notes:
  - "Wave 1 (local compose) must complete before Wave 2 (production deploy)
    because the local compose is the test harness for Fluent Bit config
    validity and SigNoz Foundry ingestion."
  - "w2-t4 (unified strip) depends on w2-t1 (Fluent Bit), w2-t2 (role
    rewrite), w2-t3 (alerts migrated), AND w3-t1 (Grafana datasource)
    because you cannot remove old container-log shipper, bridge filelog
    receiver, Tempo, Prometheus, old signoz role, or orphaned test assets
    until the new stack is fully operational."
  - "signoz_bridge filelog/containers removal (part of w2-t4) is the
    transition point: before removal, both bridge and Fluent Bit will be
    ingesting container logs (duplicate). Schedule a 1-minute overlap
    window where both run, confirm Fluent Bit logs appear in SigNoz,
    then remove the bridge receiver and restart the bridge."
  - "Loki rules migration (w2-t3) is a data-loss risk — current alerts
    stop firing the moment Loki goes down. Create SigNoz alert rules
    BEFORE removing Loki. Schedule a 2-minute overlap window."
  - "The old `deploy/roles/signoz/` ClickHouse config role is separate
    from `deploy/roles/signoz_bridge/` (OTel bridge). Only the former is
    removed in w2-t4. The bridge role stays."

