  - id: w3-t1-signoz-data-source
    title: Replace Grafana datasources with SigNoz (correct port)
    description: |
      Update `deploy/roles/logging/templates/grafana-datasources.yml.j2`
      to replace the Loki/Tempo/Prometheus datasources with a single
      SigNoz datasource. Requirements:
      a) Remove the Loki datasource block entirely.
      b) Remove the Tempo datasource block entirely.
      c) Remove the Prometheus datasource block entirely.
      d) Add a SigNoz datasource:
        - Name: "SigNoz"
        - Type: prefer "grafana-signoz-datasource" plugin if available;
          fallback to "yesoreyeram-infinity-datasource" or Grafana's
          built-in "grafana" datasource type for Prometheus-style metrics.
        - URL: `http://signoz-signoz:8080` (production — query-service API,
          internal Docker network. Port 8080 is the query-service HTTP API,
          NOT ClickHouse).
          Local override: set `signoz_grafana_url` default to
          `http://signoz:3301` for host-mapped local access.
        - Access: proxy
        - JSON data: API key injected from ansible vault var
          `signoz_grafana_api_key`
        - isDefault: true
        - editable: false
      e) FIRST validate that the SigNoz datasource plugin is available
        for Grafana 11.3.0. If not, use the Infinity datasource
        (yesoreyeram-infinity-datasource) as the primary.
      f) Add `sigNoz_alert_provisioning` section to the defaults/main.yml
        for alert rule deployment (consumed by w3-t3).
    wave: 3
    agent: gem-devops
    covers:
