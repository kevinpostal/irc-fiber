pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
  - scenario: Wave 1 wire-format changes break existing pre-update clients (old SPA talking to new engine or vice versa)
    likelihood: medium
    impact: critical
    mitigation: Gate all Wave 1 wire changes behind feature flags; default OFF for first wave deploy. Old clients continue to function when flags are off. See PM7 for two-phase deploy ordering.
  - scenario: R#6 Ignore migration silently breaks user's existing ignore list (e.g. nick 'evil*' was regex wildcard, now becomes literal in IRCCloud 3-level map and matches nothing)
    likelihood: high
    impact: high
    mitigation: 'Heuristic: upgrade ONLY pure bare-nick patterns (NOT contains(''!'') AND NOT contains(''@'') AND NOT contains(''*'') AND NOT contains(''?'')). Patterns with any separator OR wildcard are
      preserved as-is in the IRCCloud 3-level map (host=''*'', user=''*'', nick=pattern literal). Console-log the original pattern before any transformation for audit.'
  - scenario: R#5 buffersToDelete deletes user-rejoined channels on reconnection (wire race)
    likelihood: medium
    impact: high
    mitigation: 'Client-side guard: `(bid NOT in activeJoinList)` before calling deleteBuffer; intersect with archivedMap + pinnedMap + hiddenChannelsMap. Existing hideChannel at ircStore.svelte.ts:301
      protects user-deleted; extend same guard.'
  - scenario: W1-T01 pref_update expansion only fixes half the gap (handlePrefUpdate but not mergePreferences) — conversationsCollapsed silently resets on stat_user boot
    likelihood: high
    impact: high
    mitigation: W1-T01 MUST add `conversationsCollapsed` case to BOTH handlePrefUpdate (App.svelte:737-837) AND mergePreferences (App.svelte:630-735), mirroring the inactiveCollapsed pattern. Acceptance
      criteria explicitly cover both paths.
  - scenario: Wave 4 theme picker regresses default dark theme on browsers without CSS-variable support
    likelihood: low
    impact: medium
    mitigation: All IRC Fiber targets (Chrome 90+, Safari 14+, Firefox 90+) support CSS custom properties. Verify via existing `_midnight.scss` precedence in test. Browser-test against default dark before
      toggling.
  - scenario: Wave 5 WS→XHR fallback sends duplicate events when WS reconnects mid-stream
    likelihood: medium
    impact: medium
    mitigation: 'Reuse existing `maxEidTracker` (wsConnection.svelte.ts:13-17) for eid-based dedup. Explicit ''WS primary, XHR shadow'' lifecycle: WS on → XHR off; WS off → XHR on. See PM8 for XHR lifecycle
      race.'
  - scenario: Pref-update fan-out floods Redis pub/sub on rapid collapse toggles (member panel slide)
    likelihood: medium
    impact: low
    mitigation: Existing additive-only merge at App.svelte:737-837 already handles bursts. Apply 250ms debounce on the broadcast side in rest.d (mirroring the localStorage 500ms debounce in preferences.svelte.ts:181-194).
  - scenario: PM7 — Wave 1 deploy order races with frontend refresh (engine-before-frontend)
    likelihood: high
    impact: medium
    mitigation: 'Two-phase deploy for Wave 1: frontend FIRST via `make update-assets`, wait 10 minutes for clients to refresh, THEN engine via `make handoff`. Specified in W1-DEPLOY coordination_notes.'
  - scenario: PM8 — Wave 5 XHR fallback double-applies events on WS reconnect race
    likelihood: medium
    impact: medium
    mitigation: 'Explicit ''WS primary, XHR shadow'' lifecycle: WS on → XHR off (close XHR); WS off → XHR on. Add `xhrStreamHandler.close()` call to WS reconnection success path BEFORE the WS handshake
      completes. W5-T01 acceptance criterion enforces this.'
  - scenario: PM9 — Wave 4 theme picker drops default dark theme on cache-bust for existing midnight users
    likelihood: low
    impact: high
    mitigation: 'W4b-T03 keeps `#app.midnight-theme` as backward-compat selector mapping to the same `--chat-bg` overrides. W4a-T13 visual regression test with saved `theme: ''midnight''` localStorage value
      verifies.'
  - scenario: PM10 — Wave 3 archive-names endpoint server RAM cost (500+ archives = ~50KB JSON per Cmd+K open)
    likelihood: medium
    impact: medium
    mitigation: '5-minute in-memory TTL on client cache; re-fetch on cache age > TTL. Documented in W3-T01 acceptance criteria. Server-side: bulk query against Mongo with Redis cache invalidated on PART
      events.'
  - scenario: PM11 — Wave 5 lastSpoke persistence creates Mongo hot-write path
    likelihood: high
    impact: low-to-medium
    mitigation: Debounce persist to 30s per (networkId, nick); skip if lastSpoke delta < 60s. Redis hash `member-activity:<networkId>:<nick>` with 30s debounce per key + skip no-op writes. This is a `schema_change`
      — flagged as high_risk_signal.
coordination_notes:
- Each wave's reviewer gate (W*-REV) blocks deploy. Deploy task (`make update` / `make update-assets`) only starts after reviewer returns `approved`.
- Critic reviews (W0-CRIT-as-needed, W1-CRIT, W4a-CRIT) run AFTER wave items complete but BEFORE reviewer. Critic is read-only; produces verdict + open issues for the reviewer.
- Engine changes must build on the BuildKit pipeline — no local `dub build` then `scp` per AGENTS.md. Verifier checks `engine` artifact size delta before/after.
- Frontend dist rebuilt with `npm run build` before `make update`; vite output to `public/dist/`. Frontend-only deploys use `make update-assets` (Makefile:1325) to skip D rebuild.
- 'Test pattern: lib tests in `frontend/src/lib/**/*.test.ts` use vitest directly (Node); client tests in `frontend/src/**/*.test.ts` and `*.svelte.test.ts` run in headless Chromium. NO `__tests__/` directory
  (AGENTS.md).'
- Wave 4 visual regression uses existing `capture_comparison.js` script (project root) + Playwright snapshots per AGENTS.md Testing Guide.
- docs/CHANGELOG.md entries ship with each wave; protocol-change notes go in docs/HEARTBEAT.md, docs/IGNORE_MIGRATION.md, docs/PREF_VERSION.md, docs/ARCHIVE_NAMES.md.
- 'W1-DEPLOY is TWO-PHASE: (1) `make update-assets` first to push frontend with new WS handlers; (2) wait ≥10 minutes for browser cache + load balancer refresh; (3) `make handoff` to deploy engine. Closes
  PM7 race.'
- 'Wave 5 implementation order (highest-risk-first): W5-T05 → W5-T01 → W5-T02 → W5-T03 → W5-T04. Implementer may execute in this order regardless of task ID sequence.'
- 'Wave 4b-T03 must keep `#app.midnight-theme` selector active alongside new `body.theme-*` family for backward compatibility with users whose localStorage holds `theme: ''midnight''`.'
