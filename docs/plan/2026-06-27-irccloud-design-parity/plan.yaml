  format: Mirrors existing inactiveCollapsed/membersCollapsed envelope at App.svelte:801-808 (handlePrefUpdate) AND App.svelte:690-699 (mergePreferences)
- from_task: W1-T02
  to_task: W2-T03
  interface: 'UserPreferences.prefVersion : long (incremented on every write; persisted alongside pref blob)'
  format: D `long` in JSON; TS `number`; used for last-write-wins resolution. Atomic increment+save via Redis MULTI/EXEC (NOT fetch-then-write). Documented that prefVersion resolves engine-vs-client but
    NOT tab-vs-tab (handled by localStorage events).
- from_task: W1-T03
  to_task: W2-T01
  interface: 'WS message envelope: { type: ''heartbeat_echo'', cid: networkId, bid: string[], ts: number_ms }'
  format: JSON object; bid is ARRAY of buffer names for ONE network per 30s frame (NOT one frame per buffer). Engine batches per network to keep frame count ~N-networks per 30s regardless of buffer count.
- from_task: W1-T05
  to_task: W1-T06, W3-T01
  interface: getDisplayName(bufName, isupport) → string (strips safeChanPrefix)
  format: Pure function in frontend/src/lib/utils.ts; null-safe (returns input unchanged if no prefix configured). Used by W3-T01 ChannelSwitcher for archive disambiguation.
- from_task: W1-T06
  to_task: W3-T01
  interface: 'WS message envelope: { type: ''buffersToDelete'', bid: string[] } (buffer IDs to drop on resync)'
  format: 'Mirrors IRCCloud''s `buffers_to_delete` envelope; bid = `${networkId}:${bufferName}`. Client guard: `(bid NOT in activeJoinList)` AND intersect with archived/pinned/hidden maps before deletion.'
- from_task: W1-T08
  to_task: W3-T01, W3-T03
  interface: Engine events `temp_unavailable` (with countdown_ms + serverTs) and `idle` (per-network idle_since)
  format: Extends IRCRawEvent in source/ircfiber/models/irc_event.d; parsed via parser.d:26. Per NETWORK idle timer (one timer per connection). Client countdown anchored on `serverTs + remaining_ms` not
    `Date.now() + countdown_ms` to avoid drift.
- from_task: W3-T01a
  to_task: W3-T01
  interface: 'REST GET /api/buffers/archive-names → { networkId: string[] } (archived buffer names for ALL user''s networks in one bulk payload)'
  format: JSON object keyed by networkId; bulk Mongo query; Redis cache with TTL invalidation on PART. <100ms for users with up to 500 archives. NOT per-network endpoint.
- from_task: W3-T01
  to_task: ChannelSwitcher.svelte consumers
  interface: '<ChannelSwitcher scope: ''all'' | ''active'' /> (default ''all'')'
  format: Svelte 5 component prop; 'all' = cross-network with serverName disambiguation badge; 'active' = active-network-only (future refactor path). IRCCloud parity is 'all'.
