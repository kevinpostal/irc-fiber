quality_warnings:
  - "Test coverage spans both lib project (signoz.test.ts) and client project
    (logsStore.test.ts, logsLiveTail.test.ts, LogRow.svelte.test.ts,
    LogTable.svelte.test.ts, JsonDrawer.svelte.test.ts,
    LogsToolbar.svelte.test.ts, Logs.svelte.test.ts). Client tests run in
    headless Chromium with fileParallelism:false - keep fixtures minimal
    and deterministic."
  - "Live-tail WS endpoint /signoz/ws/logs/v5/{orgId} depends on the existing
    /signoz/* Caddy handler auto-handling the Upgrade header. Caddy v2
    reverse_proxy does this by default, but the dev-proxy rule in vite.config.ts
    must mirror it: /signoz must use ws:true (handled in Wave 1)."
  - "BLOCKER preflight: w3-t0 verifies the WS endpoint against the live
    SigNoz instance via curl with Sec-WebSocket-Key BEFORE w3-t1 builds
    logsLiveTail.ts. If 404/502/refused, task exits non-zero with a
    specific remediation message (VITE_SIGNOZ_URL unset OR ircfiber-caddy
    missing SIGNOZ_API_KEY OR /signoz/ws/logs/* not in Caddyfile)."
  - "REVIEWER FINDING (fixed): JSON expand now uses an absolutely-positioned
    overlay (JsonDrawer.svelte) anchored to the row, NOT inline expansion.
    The previous inline-expand plan broke the 32px row-height invariant
    the moment any expanded row's pretty-printed JSON exceeded 32px,
    throwing off the 20-row overscan offset calculation. Overlay dismisses
    on Esc, backdrop click, or X button."
  - "Saved views are localStorage-only in v1 by user requirement. The store
    API (listViews/saveView/loadView/deleteView) is the future contract for
    a SigNoz SavedView backend - keep it stable."
  - "Decision (locked): roll a simple offset-based virtualization (no new
    dep) for LogTable. Rows are uniform-height; MessageList.svelte's complex
    windowing is overkill here. Reuses existing CSS variables."
  - "Cross-wave conflicts_with entries have been removed (w2-t4 <-> w4-t1).
    Wave ordering already enforces serial execution; same-wave conflicts
    remain for the rare intra-wave resource contention."

# ═══════════════════════════════════════════════════════════════════════════
# PLANNING ANALYSIS (HIGH complexity - full section)
# ═══════════════════════════════════════════════════════════════════════════
open_questions:
  - question: |
      Is the local dev backend (gateway at 127.0.0.1:8090) configured to
      proxy /api/v1..5/* to signoz-signoz:8080? If not, every frontend
      call to /api/v1/services in dev will hit the gateway, return 404,
      and the panel will look broken even though prod works.
    context: |
      Caddy in prod proxies /api/v1..5/* directly to signoz-signoz:8080
      with SIGNOZ-API-KEY header. The vite dev server currently proxies
      /api/* to BACKEND_URL (the gateway) which has no SigNoz route. The
      gateway does not speak SigNoz protocol. This was confirmed via
      curl http://127.0.0.1:8090/api/v1/services returning 404 today.
    type: decision_blocker
    affects:
      - w1-t3-vite-dev-proxy
      - w1-t5-deploy-assertion
  - question: |
      Does the existing /signoz/* Caddy handler transparently upgrade
      WebSocket connections to signoz-signoz:8080? If Caddy v2 does not
      auto-handle the Upgrade header (some hardened configs disable it),
      the live-tail will silently fail.
    context: |
      Caddyfile.j2 line 60-79 sets up handle_path /signoz and /signoz/*
      with reverse_proxy to signoz-signoz:8080. Caddy v2 reverse_proxy
      directive auto-detects Upgrade websocket headers and forwards the
      connection with proper hop-by-hop handling. RESOLVED via w3-t0
      preflight: the BLOCKER-grade curl + Sec-WebSocket-Key test runs
      BEFORE logsLiveTail.ts is built, with a clear remediation message
      on any non-101 response. w3-t3 remains as a secondary audit + patch.
    type: decision_blocker
    affects:
      - w3-t0-ws-preflight
      - w3-t1-live-tail-store
      - w3-t3-caddy-ws-audit
assumptions:
  - >-
    SigNoz v5 log query contract is POST /api/v5/query_range with compositeQuery
    payload (compositeQuery.queryType=builder, builder queries for logs).
    v1 /api/v1/services returns {data: [{serviceName: "..."}, ...]} per
    docs/OBSERVABILITY.md.
  - >-
    Org ID is discoverable from GET /api/v1/user returning
    {data: {orgId: "..."}}.
  - >-
    WebSocket live-tail endpoint is /ws/logs/v5/{orgId} with query-string
    filter and start timestamp (SigNoz v0.130 contract). v1 fallback
    /ws/logs/tail. VERIFIED by w3-t0 preflight BEFORE logsLiveTail.ts is built.
  - >-
    SIGNOZ-API-KEY is injected by Caddy ONLY for paths under /signoz/*
    and /api/v1..5/* (per Caddyfile.j2 lines 36-97). It is NOT injected
    for /api/admin/* (gateway routes those). Confirmed by Caddyfile scope.
    The Caddyfile conditional skip when /etc/ircfiber/signoz-mcp/.api_key
    is missing (no route block, no startup error) is a known operational
    gap tracked in relevant_context.vite_dev_proxy_gap.
  - >-
    Svelte 5.19 with runes ($state, $derived, $props, $effect) -
    established pattern in admin App.svelte and existing pages.
  - >-
    Admin SPA uses hash-based router (no SvelteKit); /admin#/logs already
    maps to Logs.svelte in App.svelte line 49.
  - >-
    Toast pattern via stores/ui.ts toast/toastError/toastWarn helpers -
    ToastViewport is already mounted at app shell level.
  - >-
    Tailnet listener URL is centralised in frontend/src/admin/lib/signozUrl.ts
    exporting TAILNET_SIGNOZ_URL and TAILNET_SIGNOZ_LOGS_URL. Replaces the
    hard-coded http://100.126.197.92:3003 in Logs.svelte:15 and the planned
    duplication in w2-t4. Keeps the IP discoverable for reconfiguration.
  - >-
    JSON row expansion lives in a separate JsonDrawer.svelte component
    rendered as an absolutely-positioned overlay anchored to the clicked
    row. This preserves the LogTable's fixed 32px row-height invariant
    and 20-row overscan math (an inline expansion breaks the offset
    calculation the moment pretty-printed JSON exceeds 32px).
  - >-
    WebSocket auto-reconnect with exponential backoff (1s to 30s, jittered)
    matches the holder-strict-mode retry pattern in source/conn_holder/.
    Live-status pill states are exactly: 'idle' | 'connecting' | 'open' |
    'reconnecting' | 'closed' - the implementer does not need to guess.
  - >-
    No new dependency needed; svelte-virtual-list is intentionally NOT
    added (per minimum-viable-plan rule). Offset-based virtualization
    rolled in-house.
pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: |
        Operator runs npm run dev against 127.0.0.1:8090 backend; the
        gateway returns 404 for /api/v1/services because the gateway has
        no SigNoz route; panel shows "no services" empty state even
        though logs exist.
      likelihood: high
      impact: high
      mitigation: |
        Wave 1 task w1-t3 adds a more specific Vite proxy rule for
        /api/v1/, /api/v2/, /api/v3/, /api/v4/, /api/v5/, and
        /signoz/* pointing at a configurable VITE_SIGNOZ_URL (default
        http://127.0.0.1:8080). If unset, panel renders a clear "SigNoz
        URL not configured - set VITE_SIGNOZ_URL" empty state. Wave 1
        task w1-t5 explicitly verifies this end-to-end via curl against
        ircfiber.com and the dev proxy.
    - scenario: |
        Caddy v2 reverse_proxy blocks WebSocket upgrade due to a custom
        transport block missing flush_interval or WebSocket support
        settings; live-tail silently never connects.
      likelihood: low
      impact: critical
      mitigation: |
        Wave 3 task w3-t0 is a BLOCKER preflight: curl + Sec-WebSocket-Key
        against /signoz/ws/logs/v5/{orgId} runs BEFORE logsLiveTail.ts is
        built. On non-101, task exits non-zero with a specific remediation
        message (VITE_SIGNOZ_URL unset OR ircfiber-caddy missing
        SIGNOZ_API_KEY OR /signoz/ws/logs/* not in Caddyfile). Wave 3 task
        w3-t3 remains as secondary audit + optional flush_interval -1 patch.
    - scenario: |
        Inline-expanded JSON row breaks the LogTable virtualization
        invariant: 20-row overscan is calculated assuming fixed 32px
        row height, but the expanded JSON routinely exceeds 32px and
        shifts every subsequent row offset. Rows render at wrong
        positions, the user clicks the wrong row, scroll-snap
        desynchronises from data.
      likelihood: high
      impact: high
      mitigation: |
        Wave 2 task w2-t1 splits expand UI into a separate JsonDrawer.svelte
        overlay component. Overlay is absolutely-positioned, anchored to
        the clicked row's viewport position, dismisses on Esc / backdrop
        click / X button. LogTable retains the fixed-32px row invariant;
        JsonDrawer sits in its own stacking context and does not affect
        table offsets. Tests assert the table height is invariant under
        expand-collapse cycles.
    - scenario: |
        10k+ log rows in a 24h window cause DOM thrash because rows
        aren't virtualized.
      likelihood: medium
      impact: medium
      mitigation: |
        Wave 2 LogTable component (w2-t1) uses fixed row height + offset
        virtualization: render only the visible slice + 20-row overscan
        buffer. Document the row-height constant in the component.
    - scenario: |
        Saved views localStorage quota exceeded - silent write failure -
        user loses their last query without warning.
      likelihood: low
      impact: medium
      mitigation: |
        Wave 1 savedViews.ts (w1-t4) wraps every localStorage write in
        try/catch, prunes to most-recent 50 views on quota error, and
        surfaces a toast warning when pruning happens.
    - scenario: |
        Live-tail WebSocket reconnect storm during SigNoz restart causes
        1000s of failed WS connections per minute.
      likelihood: medium
      impact: medium
      mitigation: |
        Wave 3 logsLiveTail.ts (w3-t1) implements exponential backoff with
        jitter: 1s, 2s, 4s, 8s, 16s, 30s cap, random +/-20 percent jitter,
        stops retrying after 10 consecutive failures and surfaces a
        permanent error toast.
    - scenario: |
        Org ID discovery via /api/v1/user fails (key rotation in flight)
        and live-tail can't construct the WS URL.
      likelihood: low
      impact: medium
      mitigation: |
        logsLiveTail.ts falls back to 'default' org ID with a console.warn
        and a single toast on first connection attempt. Subsequent fetches
        of /api/v1/user refresh the org ID.
    - scenario: |
        Copy-as-cURL button on rendered query exposes the
        SIGNOZ-API-KEY if a developer accidentally embeds it client-side.
      likelihood: very_low
      impact: critical
      mitigation: |
        signoz.ts never sees the API key - the browser only sends
        relative /api/* requests and Caddy injects the header server-side.
        cURL export contains ONLY the URL, method, and JSON body. Add a
        code-comment warning in signoz.ts so future contributors don't
        accidentally add a header parameter.
    - scenario: |
        Caddyfile.j2 signoz_mcp conditional skip is triggered (no route
        block, no startup error) - ircfiber-caddy comes up but /signoz/*
        returns 404 because /etc/ircfiber/signoz-mcp/.api_key is missing.
        Logs panel silently returns empty results.
      likelihood: medium
      impact: high
      mitigation: |
        Wave 1 task w1-t5 deploy assertion probes
        https://ircfiber.com/signoz/api/v1/services (or
        /api/v1/services) and reports a specific remediation message
        when 404 / connection refused. Wave 3 w3-t3 audit task validates
        the Caddyfile route block is actually present and SIGNOZ_API_KEY
        env var is set in the container.
    - scenario: |
        Filter syntax confusion (e.g. user types level=ERROR instead
        of severity_text = 'ERROR') - no results, user has no idea why.
      likelihood: high
      impact: low
      mitigation: |
        Wave 2 FilterCheatsheet.svelte modal (w2-t3) opens on ? keypress
        and lists every supported filter field with examples. Also rendered
        inline as a placeholder hint in the query input.
coordination_notes:
  - "Wave 1 must complete before Wave 2; waves 2 and 3 can be parallelized
    (3 does not depend on UI components, only on signoz.ts)."
  - "w3-t3 Caddy audit runs in Wave 3 in parallel with w3-t1/t2 - if the
    audit reveals a missing WS block, gem-implementer for w3-t2 is not
    blocked because logsLiveTail.ts already retries on connection failure
    and the toolbar surfaces a clear 'live unavailable' indicator."
  - "All Svelte components must use Svelte 5 runes ($state, $derived,
    $props, $effect) - established convention in admin App.svelte and
    the components/ directory."
  - "signoz.ts must NOT import anything from svelte/ or svelte/store -
    keeps it eligible for the lib project test config (node, no DOM,
    fast). Mirror fuzzyMatch.ts, autolinker.ts patterns."
  - "All log API calls go through relative URLs (e.g. /api/v5/query_range)
    - never absolute URLs. Caddy adds the SIGNOZ-API-KEY header server-side."
  - "Saved views localStorage keys prefixed with ircfiber:admin:logs: to
    namespace against other admin modules."
  - "AGENTS.md update (w4-t4) goes last in Wave 4 to reflect the final
    file layout and the new dev-proxy rule."
contracts:
  - from_task: w1-t1-signoz-lib
    to_task: w1-t2-logs-store
    interface: |
      signoz.ts exports: queryRange(req), services(), fields(),
      fieldValues(name, q?), currentUser(), wsUrl(orgId). All return
      raw JSON (no {ok,data} envelope - SigNoz API does not use it).
    format: TypeScript module under frontend/src/lib/signoz.ts
  - from_task: w1-t2-logs-store
    to_task: w2-t4-logs-page
    interface: |
      logsStore.ts exports: state (Readable), setQuery, setService,
      setSeverity, setTimeRange, toggleLive, runQuery (debounced 200ms),
      cancelQuery, resetFilters. LogsState shape: query, services,
      severities, timeRange, results, loading, error, live, wsReady,
      expandedRowIds, lastQueryBody.
    format: Svelte store module under frontend/src/admin/stores/logsStore.ts
  - from_task: w1-t4-saved-views
    to_task: w2-t4-logs-page
    interface: |
      savedViews.ts exports: views (Readable), saveView(name, q),
      loadView(id) -> LogsQuery, deleteView(id). SavedView: id, name,
      query, timeRange, createdAt. localStorage key
      ircfiber:admin:logs:views.
    format: Svelte store module under frontend/src/admin/stores/savedViews.ts
  - from_task: signoz-url-lib
    to_task: w2-t4-logs-page
    interface: |
      signozUrl.ts exports TAILNET_SIGNOZ_URL and TAILNET_SIGNOZ_LOGS_URL
      constants. Centralises the tailnet listener URL that was previously
      hard-coded in Logs.svelte:15. Keep the IP discoverable in one place
      for future reconfiguration. Created as part of w1-t3 (vite-dev-proxy)
      to bundle all URL constant centralisation in one wave.
    format: TypeScript module under frontend/src/admin/lib/signozUrl.ts
  - from_task: w2-t1-log-row-table
    to_task: w2-t4-logs-page
    interface: |
      LogTable emits expand(rowId, anchorRect) when a row is clicked.
      JsonDrawer.svelte receives (row, anchorRect, onClose) and renders
      an absolutely-positioned overlay anchored to the row's viewport
      position. Dismissable via Esc, backdrop click, or X button.
      LogTable itself never changes height - the overlay sits in its
      own stacking context and does not affect virtualization math.
    format: Svelte component under
      frontend/src/admin/components/logs/JsonDrawer.svelte
  - from_task: w3-t1-live-tail
    to_task: w2-t3-logs-toolbar
    interface: |
      logsLiveTail.ts exports: startLiveTail(filter, onRow), stopLiveTail(),
      ready (Readable boolean), error (Readable string|null), status
      (Readable 'idle' | 'connecting' | 'open' | 'reconnecting' | 'closed').
      Idempotent start/stop. Surfaces status/ready/error via stores so the
      toolbar status pill renders one of the 5 enumerated states without
      managing WS state directly.
    format: Svelte store module under frontend/src/admin/stores/logsLiveTail.ts
  - from_task: caddy-prod
    to_task: w2-t4-logs-page
    interface: |
      Caddy reverse-proxies /api/v1..5/* to signoz-signoz:8080 with
      header_up SIGNOZ-API-KEY (already deployed). Caddy reverse-proxies
      /signoz/* to signoz-signoz:8080 with the same header (already
      deployed). Caddy v2 auto-handles WebSocket upgrade inside
      reverse_proxy - BLOCKER-graded preflight (w3-t0) confirms 101
      against live SigNoz; w3-t3 remains as secondary audit + patch.
    format: Caddyfile.j2 deploy/roles/caddy/templates/

