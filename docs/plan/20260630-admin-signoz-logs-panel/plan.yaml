      - svelte5-runes
      - vitest
    test_coverage: |
      LogRow.svelte.test.ts - covers severity chip class per level,
      trace_id renders as link when present, onToggle called on click.
      LogTable.svelte.test.ts - covers render slice based on scrollTop,
      expand emits (rowId, anchorRect), LogTable height is invariant
      under expand-collapse cycles (no inline expansion).
      JsonDrawer.svelte.test.ts - covers Esc closes, backdrop click
      closes, X button closes, renders JSON with key highlighting.
    estimated_files:
      - frontend/src/admin/components/logs/LogRow.svelte
      - frontend/src/admin/components/logs/LogTable.svelte
      - frontend/src/admin/components/logs/JsonDrawer.svelte
      - frontend/src/admin/components/logs/LogRow.svelte.test.ts
