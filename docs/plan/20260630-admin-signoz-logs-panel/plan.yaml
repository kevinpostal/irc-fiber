  # ─── Wave 3 — WS preflight + Live tail + Caddy WS audit ───────────────
  - id: w3-t0-ws-preflight
    title: BLOCKER preflight - verify /signoz/ws/logs/v5/{orgId} against live SigNoz before building logsLiveTail
    description: |
      BLOCKER-grade preflight: confirm the live SigNoz instance actually
      serves the /signoz/ws/logs/v5/{orgId} WebSocket endpoint BEFORE
      logsLiveTail.ts is built. Building on top of an unverified endpoint
      would waste weeks of work when the implementer later hits
      "connected, zero messages" or "404 not found".

      Procedure (script: ws-preflight.sh):
      1. Fetch orgId from https://ircfiber.com/api/v1/user (validates
         Caddy SIGNOZ-API-KEY injection + org discovery together)
      2. curl -i -H 'Connection: Upgrade' -H 'Upgrade: websocket'
         -H 'Sec-WebSocket-Version: 13'
         -H 'Sec-WebSocket-Key: x3JJHMbDL1EzLkh9GBhXDw=='
         https://ircfiber.com/signoz/ws/logs/v5/{orgId}
      3. Expect HTTP 101 Switching Protocols
      4. On non-101: identify failure mode and print specific
         remediation

      Failure-mode messaging (this is the whole point of the task):
      - connection refused / timeout:
        "VITE_SIGNOZ_URL unset OR ircfiber-caddy missing SIGNOZ_API_KEY -
         check deploy/roles/signoz_mcp + caddy env vars"
      - HTTP 404:
        "/signoz/ws/logs/* path not in Caddyfile.j2 - check
         deploy/roles/caddy/templates/Caddyfile.j2:60-79 handle_path block"
      - HTTP 502:
        "signoz-signoz container not reachable - check
         docker compose ps on ircfiber-ovh-1"
      - HTTP 401:
        "SIGNOZ_API_KEY invalid - rotate via signoz_mcp role"

      This task is a "do not merge" gate - logsLiveTail.ts work (w3-t1)
      cannot proceed if the WS endpoint is not reachable.
    wave: 3
    agent: gem-implementer
    status: pending
    covers:
      - WS endpoint live verification (curl + Sec-WebSocket-Key)
      - Org-ID discovery validation
      - Specific remediation message generation per failure mode
    dependencies:
