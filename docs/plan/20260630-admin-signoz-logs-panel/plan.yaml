  - id: w2-t1-log-row-table
    title: Create LogRow.svelte + LogTable.svelte (offset virtualization) + JsonDrawer.svelte (overlay expand)
    description: |
      LogRow renders one row with timestamp / severity chip / service /
      truncated body / trace_id link + an expand toggle (signals intent
      but does NOT inline-expand).

      LogTable is the virtualized list: fixed row height (32px), renders
      only the visible window + 20-row overscan, scrollTop -> startIndex
      derivation. Emits expand(rowId, anchorRect) when a row is clicked;
      owns the expandedRowId state but never changes its own height.

      JsonDrawer.svelte is the expand UI: absolutely-positioned overlay
      card with backdrop, anchored to the clicked row's viewport
      position. Renders pretty-printed JSON with syntax highlighting on
      keys. Dismissable via Esc keypress, backdrop click, or X button.
      Lives in its own stacking context so it does not affect
      LogTable's virtualization math.

      This three-component split (LogRow + LogTable + JsonDrawer) is a
      reviewer-mandated fix. The previous inline-expand plan broke the
      32px row-height invariant the moment any expanded row's pretty-
      printed JSON exceeded 32px, throwing off the 20-row overscan
      offset calculation.
    wave: 2
    agent: gem-implementer
    status: pending
    covers:
      - LogRow component (props: row, expanded, onToggle)
      - LogTable component (virtualized list, props: rows, onToggleRow)
      - JsonDrawer.svelte overlay (props: row, anchorRect, onClose)
      - Offset-based virtualization; no new npm dep
    dependencies:
      - w1-t2-logs-store
      - w1-t6-test-spike
    conflicts_with: []
    context_files:
      - path: frontend/src/admin/lib/format.ts
        description: truncate(), relative() helpers
