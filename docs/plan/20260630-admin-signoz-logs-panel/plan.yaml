      flaky: false
      retries_used: 0
      requires_design_validation: true
    acceptance_criteria:
      - "LogRow renders timestamp in local TZ (ms precision), severity chip with tone class (debug/info/warn/error/fatal), service.name, truncated body (max 200ch), trace_id link when present"
      - "LogTable uses fixed 32px row height + offset virtualization: renders only rows [startIndex, startIndex + viewportRows + 20]"
      - "LogTable height stays invariant under expand-collapse cycles (the test asserts this explicitly)"
      - "Click on a row -> LogTable emits expand(rowId, anchorRect); LogTable itself does not render expanded content"
      - "JsonDrawer.svelte receives (row, anchorRect, onClose) and renders pretty-printed JSON with key syntax highlighting"
      - "JsonDrawer dismisses on Esc, backdrop click, or X button"
