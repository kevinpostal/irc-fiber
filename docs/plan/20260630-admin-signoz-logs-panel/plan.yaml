  - id: w3-t1-live-tail-store
    title: Create frontend/src/admin/stores/logsLiveTail.ts - WS connect + exponential backoff + status state machine
    description: |
      Manages a single WebSocket connection to /signoz/ws/logs/v5/{orgId}
      (orgId discovered via signoz.currentUser() on first connect; falls
      back to 'default' with toast warning). Parses incoming rows into
      the LogRow shape used by the table. Implements exponential
      backoff: 1s, 2s, 4s, 8s, 16s, 30s cap with +/-20 percent jitter.
      After 10 consecutive failures, surfaces a permanent error toast
      and stops retrying.

      The status writable is a strict 5-state machine that the toolbar
      status pill renders verbatim - the implementer does not need to
      guess:
      - 'idle'         - startLiveTail not yet called, or stopLiveTail called
      - 'connecting'   - WS opening handshake in flight
      - 'open'         - WS open, rows streaming
      - 'reconnecting' - WS closed, backoff timer running, attempt N of cap
      - 'closed'       - 10-failure cap reached, permanent error

      Depends on w3-t0-ws-preflight having returned 101 against the live
      SigNoz instance.
    wave: 3
    agent: gem-implementer
    status: pending
    covers:
