plan_id: 20260630-admin-signoz-logs-panel
objective: |
  Replace the placeholder Logs.svelte with a full enterprise-grade native
  SigNoz logs panel inside the IRC Fiber admin SPA at /admin#/logs. The panel
  calls the SigNoz REST API directly through the existing Caddy proxy at
  /api/v1..5/* (SIGNOZ-API-KEY header injected by Caddy from the EDITOR
  service account). Live-tail streams over WebSocket through /signoz/ws/logs/*
  (Caddy v2 auto-handles upgrade in the existing /signoz/* reverse_proxy).
  A "Open SigNoz ↗" link to the tailnet listener (http://100.126.197.92:3003/logs)
  remains for advanced features (saved views, pivots, anomalies) that the
  native panel intentionally does not implement in v1.
created_at: 2026-06-30T21:42:00Z
created_by: gem-planner
status: pending
tldr: |
  4-wave plan (18 tasks). Wave 1 (6): signoz.ts lib + logsStore + savedViews
  store + Vite dev proxy + signozUrl.ts + deploy assertion + test-spike
  gate. Wave 2 (4): LogRow/LogTable (virtualized) + JsonDrawer overlay +
  LogsToolbar + FilterCheatsheet + Logs.svelte rewrite. Wave 3 (4): WS
  preflight + logsLiveTail WS store + toolbar wire + Caddy WS audit.
  Wave 4 (4): keyboard shortcuts, copy-as-cURL, empty/error states,
  AGENTS.md update.

