      - "On connection refused: prints 'VITE_SIGNOZ_URL unset OR ircfiber-caddy missing SIGNOZ_API_KEY'"
      - "On 404: prints '/signoz/ws/logs/* not in Caddyfile.j2 handle_path block'"
