# ═══════════════════════════════════════════════════════════════════════════
# TASKS — Tier 1 (immediate freeze fix, 4 waves, 11 tasks)
# ═══════════════════════════════════════════════════════════════════════════
tasks:

  # ══════════════════════════════════════════════════════════════════════
  # TIER 1 — WAVE 1 (Per-session outbound queue + priority demotion)
  # Goal: the WS read fiber returns to client immediately under flood.
  # ══════════════════════════════════════════════════════════════════════
  - id: t1-w1-t1-outbound-queue
    title: "Tier 1 — Per-session outbound queue + dedicated write fiber"
    description: |
      Decouple the WebSocket read fiber from the WebSocket write fiber so
      that a flood of IRC events cannot block the gateway from accepting
      client commands. Today `sessionManager.sendToSession(...)` writes
      directly to `socket.send()` on whatever fiber holds the WS event
      loop. With 10K msgs/sec, that fiber is busy in `socket.send` NIO
      syscalls; the read fiber never gets time → HTTP also doesn't get
      time → site freezes.

      Implementation:

      1. Add `Queue!string outbound` (bounded, capacity 500) and
         `uint coalescedN` (track dropped messages for dev visibility)
         fields to `UserSession`.
      2. Change `sendToSession(UUID, string)` to enqueue instead of send:
         drop-oldest on overflow (keeps newest for chat-tail coherence).
      3. In `handleWebSocket()`, after `enterUpdateLoop`, spawn a dedicated
         drain fiber via `runTask` that pops the queue 5ms at a time and
         calls `socket.send`.
      4. On disconnect, set `session.isActive = false` BEFORE the loop
         exits, so any final-frame enqueue is silently dropped.
      5. Add a `coalescedN` log line at disconnect with the dropped
         count for diagnostics.
    wave: 1
    tier: 1
    agent: gem-implementer
    covers:
      - outbound-queue
      - drain-fiber
      - coalescing
    dependencies: []
    conflicts_with: []
    context_files:
      - path: source/ircfiber/api/session.d
        description: Define UserSession struct + sendToSession
      - path: source/ircfiber/api/websocket.d
        description: Where handleWebSocket + redisEventListener live
      - path: source/ircfiber/storage/buffer.d
        description: sanitizeUtf8 used inside sendToSession
      - path: frontend/src/lib/messageBatcher.ts
        description: Existing 200ms trailing-edge debounce on the client
    acceptance_criteria:
      - "h1: UserSession.outbound is a bounded Queue!string with capacity 500"
      - "h2: sendToSession never blocks; backpressure is queue-full + drop-oldest"
      - "h3: drain fiber keeps the WS write side alive without contending with the read fiber"
      - "h4: Existing unit tests in src/app_test.d still pass"
      - "h5: irc_parity tests (9 scenarios) all remain green"
      - "h6: coalescedN counter increments are logged at session disconnect"
    success_criteria:
      - "When 1 WebSocket session receives 10K events/sec, the gateway's CPU is < 50% (was 100%+ previously)"
      - "While the flood runs, /health returns < 200ms p99 from a parallel curl loop"
    handoff:
      target_files:
        - source/ircfiber/api/session.d
        - source/ircfiber/api/websocket.d
      do_not_reinvestigate:
        - "Coalescing happens at the gateway-side queue, not the client"
        - "Capacity 500 is per-session; total memory bound is sessions x 500 frames x ~2KB ≈ 10MB at 10 active sessions"
      minimal_change: "Two-file diff. No public API change."
      acceptance_checks:
        - "Add `coalescedN: uint` to UserSession and increment on drop"
        - "Track and log coalescedN non-zero per session at disconnect"

  - id: t1-w1-t2-listener-priority
    title: "Tier 1 — Demote redisEventListener + OTel span flush to background priority"
    description: |
      `redisEventListener` callback (websocket.d:662) and the OTel span
      flush (app.d:211) both run on the shared fiber pool. With a flood,
      the listener callback runs 10K times/sec — each invocation calls
      `parseJsonString(msg)` which can take 1-10µs and yields nothing.
      Over 10 seconds that's measurable but bounded; what tips over HTTP
      is that the listener's fiber doesn't yield BEFORE the next callback,
      so other fibers starve.

      Implementation wraps 4 `runTask` calls with `TaskSettings(100)`:

      - redisEventListener outer task
      - OTel span flush task
      - startEngineHealthMonitor (app.d:230)
      - startShutdownListener (app.d:278)
    wave: 1
    tier: 1
    agent: gem-implementer
    covers:
      - listener-priority
      - background-task-priority
      - yield-cadence
    dependencies:
      - t1-w1-t1-outbound-queue
    conflicts_with: []
    context_files:
      - path: source/ircfiber/api/websocket.d
        description: redisEventListener at lines 656-705
      - path: source/app.d
        description: Span flush at 211; engine health monitor at 230; shutdown listener at 278
      - path: dub.packages-cache/vibe-core-2.14.0/source/vibe/core/task.d
        description: TaskSettings struct (priority field semantics)
    acceptance_criteria:
      - "h1: redisEventListener task priority = 100 (background)"
      - "h2: Span flush task priority = 100"
      - "h3: Engine health monitor priority = 100"
      - "h4: Shutdown listener priority = 100"
      - "h5: HTTP-request fibers keep priority 65536 (default)"
      - "h6: WebSocket read fiber priority = 65536 (default)"
      - "h7: OTel metric `fiber_priority_dist` exported"
    success_criteria:
      - "After t1-w4-t1 runs 10K msg/sec load for 30s, the gateway reports 100+ high-priority fiber-scheduled events per second (HTTP/WS) and ~100 low-priority (background)"
    handoff:
      target_files:
        - source/ircfiber/api/websocket.d
        - source/app.d
      do_not_reinvestigate:
        - "Priority is a RATIO; do not expect preemption"
        - "vibe-core 2.14 priority 65536 = task.basePriority; lower numbers get scheduled less frequently"
      minimal_change: "Wrap 4 runTask(...) calls with TaskSettings(100)."
      acceptance_checks:
        - "Verify all 4 wrapper sites via grep`"

  - id: t1-w1-t3-yield-cadence
    title: "Tier 1 — Insert explicit yield() in replayMissedEvents + subscribe + performStateDump"
    description: |
      Three hot loops have implicit unbounded work without yielding:

      1. `replayMissedEvents` (websocket.d:584-654) — loops over all
         entries in the user's missed-events stream. After t1-w1-t1 the
         send is just an enqueue, but the JSON parse +16-iteration
         reversal still runs on the WS read fiber. Add `yield();
         sleep(1.msecs);` every 50 iterations.
      2. The Redis subscriber callback (websocket.d:662-694) — for each
         msg, parses JSON. For 10K msgs/sec, that's 10K parseJsonString
         calls/sec. Add `yield()` every 100 callbacks.
      3. `performStateDump` (websocket.d:193) — when there are 10s of
         buffers per network and tens of networks per user, the dump
         building loop can run O(seconds). Add yield() every 50
         netObj["buffers"] iterations.

      Acceptance: the gateway reports a non-zero count of `yield()`
      invocations per second under load (instrumented via a Counter).
    wave: 1
    tier: 1
    agent: gem-implementer
    covers:
      - yield-cadence
      - hot-loop-mitigation
    dependencies:
      - t1-w1-t1-outbound-queue
    conflicts_with: []
    context_files:
      - path: source/ircfiber/api/websocket.d
        description: replayMissedEvents 584, redisEventListener 656, performStateDump 193
      - path: source/ircfiber/observability.d
        description: Pre-existing OTel counters
    acceptance_criteria:
      - "h1: replayMissedEvents yields every 50 iterations"
      - "h2: subscriber.listen body yields every 100 calls"
      - "h3: performStateDump yields every 50 buffer iterations"
      - "h4: Debug Counter `ws_yields_total` increments at the expected rate"
    success_criteria:
      - "Under 10K msg/sec flood, the gateway's `ws_yields_total` increments >= 100/sec"
    handoff:
      target_files:
        - source/ircfiber/api/websocket.d
      do_not_reinvestigate:
        - "Yield MUST come before sleep; sleep without yield can deadlock if the fiber has other work pending"
        - "Use sleep(1.msecs) NOT sleep(0.msecs) (the latter is a busy-wait)"
      minimal_change: "Three places. Five lines total."
      acceptance_checks:
        - "Compare gateway CPU% before/after with same load test (expect ≤50%)"

  # ══════════════════════════════════════════════════════════════════════
  # TIER 1 — WAVE 2 (Mongo off the WS read fiber)
  # ══════════════════════════════════════════════════════════════════════
  - id: t1-w2-t1-prefs-save-off-fiber
    title: "Tier 1 — Move prefs.save + sync_dump to runWorkerTask"
    description: |
      `prefs.save(...)` (websocket.d:759-762) and `performStateDump`
      (websocket.d:735-737) both do synchronous Mongo reads/writes on
      the WS read fiber. When MongoDB auth/network glitches, these
      become tight retry loops that pin the WS read fiber — and since
      the same fiber is what HTTP routes must service, the whole site
      stalls.

      Implementation:

      1. `prefs.save` becomes fire-and-forget `runWorkerTask`.
      2. `performStateDump` uses `runWorkerTaskH` (awaitable) so the
         result can be awaited by the WS read fiber WITHOUT blocking it.
      3. `NetworkRepository.findByUserId` on sync command uses
         `runWorkerTaskH` + awaitUninterruptible.

      Caveat: `runWorkerTask` runs on the SAME `st_workerPool` as the
      fiber scheduler workers — so a long runWorkerTask CAN starve
      fibers. We mitigate by keeping each task to < 1ms of CPU work
      (most of the time is spent in Mongo I/O, which yields).
    wave: 2
    tier: 1
    agent: gem-implementer
    covers:
      - runWorkerTask-pattern
      - future-bridge
      - prefs-save
    dependencies:
      - t1-w1-t1-outbound-queue
    conflicts_with: []
    context_files:
      - path: source/ircfiber/api/websocket.d
        description: handleClientMessage("sync") at 731; buffer at 755
      - path: source/ircfiber/storage/preferences.d
        description: PreferencesRepository.save
      - path: dub.packages-cache/vibe-core-2.14.0/source/vibe/core/core.d
        description: runWorkerTask + runWorkerTaskH signatures
    acceptance_criteria:
      - "h1: prefs.save on buffer switch uses runWorkerTask; the WS read fiber does not block"
      - "h2: performStateDump on sync command uses runWorkerTaskH + awaitUninterruptible"
      - "h3: NetworkRepository.findByUserId on sync uses runWorkerTaskH"
      - "h4: Errors in the worker task are logged but never propagate to the WS fiber"
    success_criteria:
      - "With MongoDB paused (iptables or simulated), the WS read fiber still services new connections within 100ms"
    handoff:
      target_files:
        - source/ircfiber/api/websocket.d
        - source/ircfiber/async.d
        - source/ircfiber/db/preferences.d
      do_not_reinvestigate:
        - "UserPreferences must be cloned before crossing the worker boundary (it's a struct with strings)"
        - "runWorkerTaskH + awaitUninterruptible is the awaitable form; .join() deadlocks on error"
      minimal_change: "Add helpers in async.d; call them from 3 places in websocket.d."

  - id: t1-w2-t2-mongodb-bounded-retry
    title: "Tier 1 — Bounded retry + circuit breaker for Mongo writes"
    description: |
      During the recent wedge, MongoDB's `Failed to connect` error fired
      a `logWarn` + retry every iteration — what made the gateway CPU
      peg at 100%. The retry loop needs:

      1. Bounded retry count (e.g. 5 retries with exponential backoff
         up to 30s).
      2. Circuit breaker: after N consecutive failures, the path
         refuses to attempt Mongo for coolDown window (default 60s).
         During cool-down, prefs.save silently no-ops, sync dump
         returns the previous cached state. Goal: never let a Mongo
         hiccup wedge the gateway.

      Lives in `source/ircfiber/db/mongo.d`:

      ```d
      class MongoCircuitBreaker {
          int state;            // closed, open, half_open
          int failures;
          SysTime openedAt;
          long coolDownMs = 60_000;
          bool allowRequest() { ... }
          void recordFailure() { ... }
          void recordSuccess() { ... }
      }
      ```

      Every Mongo path wraps its call in `circuitBreaker.allowRequest()`.
    wave: 2
    tier: 1
    agent: gem-implementer
    covers:
      - circuit-breaker
      - retry-with-backoff
      - mongo-resilience
    dependencies:
      - t1-w2-t1-prefs-save-off-fiber
    conflicts_with: []
    context_files:
      - path: source/ircfiber/db/mongo.d
        description: AppMongoConnection class
      - path: source/ircfiber/storage/preferences.d
        description: PreferencesRepository
      - path: source/ircfiber/storage/network.d
        description: NetworkRepository
      - path: source/ircfiber/observability.d
        description: OTel metrics pipeline
    acceptance_criteria:
      - "h1: MongoCircuitBreaker class with state machine (closed/open/half_open)"
      - "h2: Default coolDown = 60s; configurable IRCFIBER_MONGO_CIRCUIT_COOLDOWN_MS"
      - "h3: After 5 consecutive failures, breaker opens and all subsequent Mongo calls short-circuit"
      - "h4: After coolDown expires, breaker enters half_open — next call attempt is real, success closes, failure reopens"
      - "h5: OTel metric `mongo_circuit_state` exposed"
      - "h6: SigNoz log when breaker state transitions"
    success_criteria:
      - "With Mongo down for 5 minutes, the gateway's `Failed to connect to MongoDB` log line appears AT MOST 1 time per state transition, not 100+ times per second"
      - "While Mongo is down, /health responds in < 50ms"
    handoff:
      target_files:
        - source/ircfiber/db/mongo.d
        - source/ircfiber/storage/preferences.d
        - source/ircfiber/storage/network.d
        - source/ircfiber/observability.d
      do_not_reinvestigate:
        - "The breaker is process-local (not distributed). Each gateway/engine process has its own"
        - "The half_open transition fires on the next Mongo call attempt after coolDown expires"
      minimal_change: "New class in mongo.d. Wrap 4-5 existing Mongo call sites."

  - id: t1-w2-t3-engine-health-priority
    title: "Tier 1 — Engine health monitor + janitor: error budget + pause on fail"
    description: |
      `startEngineHealthMonitor` (app.d:230) runs an infinite loop with
      `try { sleep(10.seconds); registry.healthCheckAll(); }`. Each
      cycle calls Redis ops — fast on success, but on fail can take time.
      With a Redis hiccup, this became a tight loop at 100% CPU.

      Fix:

      1. Add explicit error budget: per cycle, if healthCheckAll throws,
         log at WARN and increment a counter. After 10 consecutive
         failures, mark the engine "unknown" and STOP calling
         healthCheckAll for 5 minutes. Re-arm after a successful call.

      2. Add yield/sleep rate limit: each loop iteration must
         sleep(10.seconds, ...) to back off even under bad-Redis
         conditions.

      Implementation: wrap the body in `try { healthCheckAll(); } catch
      { consecutiveFailures++; sleep(10.seconds); continue; }`. After
      10 failures, set isPaused = true; sleep(5.minutes) at the top of
      the next iteration.
    wave: 2
    tier: 1
    agent: gem-implementer
    covers:
      - error-budget
      - back-pressure-on-health-monitor
      - pause-on-fail
    dependencies:
      - t1-w1-t2-listener-priority
      - t1-w2-t2-mongodb-bounded-retry
    conflicts_with: []
    context_files:
      - path: source/app.d
        description: startEngineHealthMonitor at 230-268
      - path: source/ircfiber/irc/engine_janitor.d
        description: EngineJanitor.cycle pattern
    acceptance_criteria:
      - "h1: Engine health monitor has consecutive-failure counter"
      - "h2: After 10 consecutive failures, monitor pauses for 5 minutes"
      - "h3: After a successful healthCheckAll, failures reset to 0"
      - "h4: Janitor cycle has equivalent error budget (lift-and-shift)"
      - "h5: OTel counter `gateway_health_check_errors_total` exported"
    success_criteria:
      - "With Redis down for 30 minutes, the gateway CPU stays <= 10%"
    handoff:
      target_files:
        - source/app.d
        - source/ircfiber/irc/engine_janitor.d
      do_not_reinvestigate:
        - "Pause state is process-local, in-memory. Process restart starts fresh"
      minimal_change: "Two 30-line refactors"

