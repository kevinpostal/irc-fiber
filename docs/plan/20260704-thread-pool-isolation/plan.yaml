  # ══════════════════════════════════════════════════════════════════════
  # TIER 2 — WAVE 5 (Stateless session tokens + Mongo-free hot path)
  # Goal: eliminate MongoDB from the per-message WS hot path.
  # ══════════════════════════════════════════════════════════════════════
  - id: t2-w5-t1-stateless-sessions
    title: "Tier 2 — Stateless Redis-backed session tokens (no Mongo on WS hot path)"
    description: |
      Currently every WS reconnect calls `authenticateRequest` which
      hits Mongo. Under 50K WS connections with frequent reconnects,
      this saturates Mongo.

      Tier 2 introduces opaque session tokens stored ONLY in a Redis
      hash `irc:sessions:<userId>`. The token is HMAC-signed (key from
      vault) so it can be verified statelessly; the per-userId Redis
      hash is the source of truth for "is this token still valid" and
      `lastSeenAt`.

      Implementation:

      1. New module `source/ircfiber/auth/session_token.d`:
         - `mintToken(userId, ttl=24h)` returns `opaqueToken`
         - `verifyToken(opaqueToken)` returns `Nullable!UserSession`
         - Refresh-on-WS-message bumps `lastSeenAt` and rolls TTL.
      2. New endpoint `POST /api/me/refresh` issues a new token
         without a full login round-trip; sliding refresh is 1h.
      3. WebSocket handler accepts the new token in the `Sec-WebSocket-
         Protocol` header OR `Authorization: Bearer <token>`.
      4. Mongo `authenticateRequest` becomes the FALLBACK path; tokens
         minted by the new path skip it.

      Load-test impact: WS connect latency drops by ~5-15ms (no Mongo
      round trip), Mongo CPU drops ~30% under reconnect storms.
    wave: 5
    tier: 2
    agent: gem-implementer
    covers:
      - stateless-sessions
      - token-rotation
      - sliding-refresh
    dependencies:
      - t1-w4-t2-load-test-gate
    conflicts_with: []
    context_files:
      - path: source/ircfiber/auth.d
        description: Existing authenticateRequest + hashPassword
      - path: source/ircfiber/api/websocket.d
        description: handleWebSocket auth path
      - path: source/ircfiber/api/rest.d
        description: Where /api/me/refresh will land
      - path: source/ircfiber/storage/redis.d
        description: Redis hash helpers
    acceptance_criteria:
      - "h1: New module ircfiber.auth.session_token with mintToken/verifyToken"
      - "h2: Redis hash irc:sessions:<userId> stores {opaqueToken, lastSeenAt, ttl, mint}"
      - "h3: WS handler accepts new tokens; old auth code is fallback"
      - "h4: POST /api/me/refresh issues a 1h-sliding refreshed token"
      - "h5: HMAC verifier uses clock_gettime, not Clock.currTime"
      - "h6: Token rotation invalidates the old token within 100ms"
    success_criteria:
      - "50K concurrent WS sessions, reconnect-storm 1% per minute — Mongo CPU < 30% peak"
      - "No full re-login required for token refresh within 24h of activity"
