  - id: t2-w7-t3-stream-replay-pipeline
    title: "Tier 2 — Stream replay now uses XREAD (no LRANGE)"
    description: |
      Today `replayMissedEvents` uses LRANGE on the user's stream to
      fetch missed events. Under 50K connections all reconnecting at
      once, LRANGE on 50K keys at once floods Redis.

      Tier 2 replaces LRANGE with XREAD COUNT 200 STREAMS
      `irc:stream:<userId>` sinceEid, returning at most the events the
      client actually missed. This is O(missed events), not O(stream
      length).

      Implementation in websocket.d replayMissedEvents:
      - Replace `db.lrange(streamKey, 0, -1)` with XREAD.
      - Keep the 200-cap (IRCCloud parity).
      - Add OTel metric `stream_replay_xread_calls_total`.
    wave: 7
    tier: 2
    agent: gem-implementer
    covers:
