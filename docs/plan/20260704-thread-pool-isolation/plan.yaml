  - id: t2-w6-t3-load-shedding-policy
    title: "Tier 2 — Adaptive per-session backpressure (drop-not-block)"
    description: |
      When a single WS session's drain queue fills beyond 400/500 (80%),
      it's stuck — typically because the client's network is slow.
      Rather than block the drain fiber, the gateway marks the session
      `flowControlled: true` and adds a `_server` warning event to the
      queue telling the user to refresh.

      Adaptive policy:

      - When the queue fills: increment `droppedFramesTotal`.
      - At 80% sustained for 5s: send a single warning event, then
        start dropping NEW frames for that session (oldest are still
        drop-oldest; new are dropped immediately).
      - When the queue drains below 20%: reset flow control.
      - Record flow-control events in OTel metrics.

      Goal: 49 healthy sessions don't lose frames because 1 stuck
      session is hogging the drain fiber.
    wave: 6
    tier: 2
    agent: gem-implementer
    covers:
      - adaptive-backpressure
      - per-session-flow-control
      - drop-not-block
    dependencies:
      - t1-w1-t1-outbound-queue
      - t2-w6-t2-frame-coalescer-frontend
    conflicts_with: []
    context_files:
      - path: source/ircfiber/api/session.d
        description: UserSession.outbound + flow control state
      - path: source/ircfiber/api/websocket.d
        description: drainOutboundLoop
    acceptance_criteria:
      - "h1: New `flowControlled` field on UserSession"
      - "h2: When queue > 400 for 5s, mark flowControlled and emit a warning event"
      - "h3: When queue < 100 sustained, reset flowControlled"
      - "h4: OTel gauges `ws_flow_controlled_total` + `ws_dropped_frames_total`"
      - "h5: Manual unit test: simulate one stuck session, verify other sessions still drain"
    success_criteria:
      - "With 1 stuck session at 25K msg/sec, the other 49 sessions' p99 frame delivery stays < 50ms"
    handoff:
