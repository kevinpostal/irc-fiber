      - "h2: Both v1 and v2 parsers/renderers exist; v1 is the default"
      - "h3: Feature flag IRCFIBER_WS_PROTOCOL_V2_ENABLED gates v2"
      - "h4: Per-session protocolVersion tracks which version the SPA is using"
      - "h5: Existing v1 frames still parse + render identically"
      - "h6: OTel counter `ws_protocol_v2_frames_total` separate from v1"
