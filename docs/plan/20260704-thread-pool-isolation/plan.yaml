  - id: t3-w9-t3-frontend-affinity-cookie
    title: "Tier 3 — Frontend sets + sends `lb_route` cookie"
    description: |
      The frontend `wsConnection.svelte.ts` must send the `lb_route`
      cookie on every WS upgrade so the load balancer can pin the
      session to its initial replica.

      Implementation:

      - On connect success, capture the `lb_route` cookie value.
      - On reconnect, send the cookie via `document.cookie`.
      - If the cookie expires (load balancer rebuilds the pool), the
        SPA falls back to a fresh connection; the LB picks a new
        replica and the session token retokenizes.

      This requires browser support for cookies on WebSocket upgrade
      headers, which is standard for all modern browsers (the cookie
      is sent on the HTTP upgrade request).
    wave: 9
    tier: 3
    agent: gem-implementer
    covers:
      - frontend-cookie-handling
      - ws-upgrade-with-cookie
