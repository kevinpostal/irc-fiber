  - id: t3-w12-t1-vibe-core-decision
    title: "Tier 3 — DECISION_BLOCKER: vibe-core upgrade path (Go / D-bump / accept-limits)"
    description: |
      **This is a decision_blocker.** Tier 3.4+ may not start until
      this resolves.

      Decision:
      - **Option A — Go rewrite**: Replace the D gateway with a Go
        gateway. Goroutines are cheap. Cap raises to ~500K WS
        sessions per process. Estimated 3-4 months.
      - **Option B — D-lib bump**: Bump to vibe-core 1.x + vibe-http
        2.x. Per-listener pools expose real OS-thread isolation.
        Estimated 2-3 weeks porting + regression tests.
      - **Option C — Accept limits**: Keep D as is. Horizontal scale
        via multiple gateway replicas (already in t3-w9-t2). Cap of
        ~50K WS sessions per single gateway replica. Operationally
        simplest; documents the limit.

      **Deliverable**: docs/decisions/2026-XX-XX-vibe-core-upgrade.md
      (ADR). After user picks, this task becomes the seed of
      sub-plan t3-upgrade-vibe-core.

      **Sub-plan t3-upgrade-vibe-core**: created by gem-planner AFTER
      the decision, scoped to Option A, B, or C.
