open_questions:
  - question: |
      Which path for the vibe-core upgrade?
        Option A: Rewrite the gateway in Go (net/http + gorilla/websocket
                  + a single-task model is not necessary in Go because
                  goroutines are cheap). Estimated 3-4 months.
        Option B: Keep D, bump to vibe-core 1.x + vibe-http 2.x. Per-
                  listener pools expose actual OS-thread isolation. Estimated
                  2-3 weeks of porting + regression test work.
        Option C: Keep D, accept the single-pool cap at ~50K WS sessions
                  per process. Spin more gateway replicas instead. Cheapest
                  path; documents the cap as a known limit.
    context: |
      vibe-core 2.14 has a single shared TaskPool. With ~16 cores we have
      ~64 workers today. At 50K active WS sessions with 25K msg/sec peak,
      the fiber scheduler overhead is the dominant cost. Option B unlocks
      per-listener pools at the cost of porting sessions.d, websocket.d,
      rest.d to the new async API. Option C is operationally simpler but
      caps the single-process ceiling. The decision affects every Tier 3
      task downstream of w12.
    type: decision_blocker
    affects:
      - t3-w12-t1-vibe-core-decision
      - t3-w13-t1-multi-region-failover
      - t3-w13-t2-200k-loadtest
  - question: |
      Statelesness — should session tokens be signed JWTs (HMAC-SHA256,
      verifiable without a Redis hit) or opaque random strings (need an
      O(1) Redis HGET to verify)?
    context: |
      JWTs scale slightly better at the edge (no Redis hit per WS message
      header check), but they expire in the token alone — sliding refresh
      is harder. Opaque tokens need Redis but allow instant revocation.
      For IRC Fiber the user pool is small (< 1M) and Redis is fast, so
      the HMAC verification cost on JWT may exceed the saved Redis hit.
      Recommend starting with opaque tokens. Defer JWT migration until
      profiled.
    type: decision_blocker
    affects:
      - t2-w5-t1-stateless-sessions
      - t2-w5-t2-network-config-cache
  - question: |
      Loadtest target tier numbers — are 50K+200K the right peaks for
      OVH vs our upcoming enterprise customers?
    context: |
      ircfiber.com is a single-tenant IRC client front-end. The
      "hundreds of thousands of users" requirement implies a future white-
      label / embedded IRC SaaS tier. Capacity plan: 200K WS sessions =
      ~50% headroom on the current OVH (16 cores / 32 GB) at 4 replicas.
      Confirm with the user before locking the target.
    type: decision_blocker
    affects:
      - t2-w8-t3-tier2-gate
      - t3-w13-t2-200k-loadtest
  - question: |
      WS protocol v2 migration — co-exist or hard cutover?
    context: |
      Co-existence keeps one minor version of v1 parsing alive for ~1
      release so the SPA can roll out without coordination. Hard
      cutover avoids two parsers in the codebase. Tier 2 ships v2;
      feature-flag `IRCFIBER_WS_PROTOCOL_V2_ENABLED=1` defaults true
      on tier-2 deployments, false on tier-1 (rolls back cleanly).
    type: decision_blocker
    affects:
      - t2-w6-t1-ws-protocol-v2
      - t2-w6-t2-frame-coalescer

