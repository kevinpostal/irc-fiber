        description: lpush helper
    acceptance_criteria:
      - "h1: New batchLpush helper in redis.d with explicit maxBatchSize"
      - "h2: manager.d uses batchLpush with cap 100 + window 50ms"
      - "h3: Feature flag IRCFIBER_BATCHED_USERSTREAM=1 gates rollout"
      - "h4: OTel counter `redis_batched_lpush_calls_total` + `redis_batched_lpush_events_total`"
      - "h5: Idempotent: failed batches retry individually"
