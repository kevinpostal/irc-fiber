      minimal_change: "1 new helper + 1 call-site swap"

  - id: t2-w7-t2-gateway-pipeline-read
    title: "Tier 2 — Gateway uses Redis pipeline for batch subscriber reads"
    description: |
      With 50K active WS sessions, the gateway's Redis subscriber
      currently opens 50K Redis subscriptions (per-user channels). Under
      the engine batch-publish from t2-w7-t1, this still spawns 50K
      callbacks. Tier 2 introduces shared subscription:

      - Use Redis Streams consumer groups instead of pub/sub. Each
        gateway instance consumes from one stream per user (still
        per-user, but the stream is a single XREADGROUP call).
      - Migration path: phase out `irc:events:<userId>` pub/sub, phase
        in `irc:stream:<userId>` XADD (which is already used for
        replay, see RedisKeys.userStream).
      - The live path becomes XREADGROUP > BLOCK 100 > consumer-group;
        multiple gateways with the same group name load-balance the
        stream naturally.

      Caveat: XREADGROUP can't deliver to a specific user-subscriber
      without a group-per-user. We use one consumer group per user
      with the engine's hostname as the consumer name; a failover
      repoints the gateway to the new consumer name.
    wave: 7
    tier: 2
    agent: gem-implementer
    covers:
      - stream-consumer-group
      - shared-subscription
      - failover-friendly
    dependencies:
