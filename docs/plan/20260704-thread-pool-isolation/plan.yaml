  - id: t2-w6-t2-frame-coalescer-frontend
    title: "Tier 2 — Gateway write coalescer + frontend v2 parser"
    description: |
      Two-part task:

      Backend coalescer (gateway-side):
      - The drain fiber (from t1-w1-t1) coalesces N adjacent frames with
        the same `channel` and `type` into a single envelope with
        `batchSize: N`. This is structural insurance; the frontend's
        messageBatcher.ts already does similar work, but server-side
        coalescing reduces WS frame count from 25K/sec to ~2K/sec at
        peak.
      - Implementation in `source/ircfiber/api/drain_coalesce.d`:
        a 5ms window per channel; if 5 frames arrive within 5ms on
        the same channel, emit one batched frame and bump batchSize.

      Frontend v2 parser:
      - Update `frontend/src/stores/wsConnection.svelte.ts` to parse
        v2 envelopes; if `batchSize > 1`, iterate `payload[]`.
      - Keep v1 fallback — if `v: 1` or absent, parse as today.
      - New unit tests in `wsConnection.v2.test.ts`.

      Critical: the v2 parser MUST not duplicate frames or drop them
      under coalescing.
