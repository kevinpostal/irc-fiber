      minimal_change: "2 fields + 1 logic block"

  # ══════════════════════════════════════════════════════════════════════
  # TIER 2 — WAVE 7 (Engine publish batching + Redis pipeline)
  # ══════════════════════════════════════════════════════════════════════
  - id: t2-w7-t1-engine-batch-publish
    title: "Tier 2 — Engine batch-publishes events to per-user Redis stream"
    description: |
      Today the engine does one LPUSH per IRC event:

      ```d
      redis.lpush(RedisKeys.userStream(userId), eventJson);  // 1 round trip per event
      ```

      Tier 2 introduces a per-write-task batching scheme:

      ```d
      // Coalesce up to 100 events or 50ms, whichever first
      auto batch = new Bson[100];
      foreach (ev; events) {
          batch ~= ...;
          if (batch.length == 100) flush(batch);
      }
      flush(batch);
      ```

      Saves ~99% of Redis round trips on a 50K msg/sec fanout.

      Lives in source/ircfiber/irc/manager.d. Existing code path is
      preserved; the batching is opt-in via
      `IRCFIBER_BATCHED_USERSTREAM=1`.
    wave: 7
    tier: 2
    agent: gem-implementer
    covers:
      - batch-publish
      - redis-round-trip-reduction
      - user-stream-coalesce
    dependencies:
      - t2-w6-t2-frame-coalescer-frontend
    conflicts_with: []
    context_files:
