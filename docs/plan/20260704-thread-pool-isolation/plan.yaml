  - id: t2-w5-t3-lru-prefs-cache
    title: "Tier 2 — In-memory LRU cache for hot prefs (write-through to Redis hash)"
    description: |
      Even with the Redis-hash cache in t2-w5-t2, every WS message
      bumps `lastSeenAt` on the prefs hash, which is a Redis HSET
      round trip. Tier 2 adds an in-memory LRU keyed by userId that
      caches the prefs struct itself; writes coalesce and flush to
      Redis every 30s (not per-message).

      Implementation in source/ircfiber/storage/prefs_lru.d:

      - `LRU!UserPrefs` (size 5000) keyed by userId
      - `getPrefs(userId)` returns from LRU; on miss, read Redis hash
      - `setLastSeenAt(userId)` updates the in-memory copy only;
        periodic flusher (every 30s) writes to Redis hash
      - On process exit, flush all dirty entries before returning

      This removes ~50K Redis HSET/sec from the steady-state cost.
