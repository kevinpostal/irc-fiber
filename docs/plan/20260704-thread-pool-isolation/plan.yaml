pre_mortem:
  overall_risk_level: high
  critical_failure_modes:
    - scenario: |
        Tier 1's outbound queue silently drops messages and the frontend
        notices "messages disappeared" under flood.
      likelihood: medium
      impact: high
      mitigation: |
        Bounded queue drops ONLY when capacity exceeded (default 500 frames
        per session). Under normal typing load we never hit 50 frames
        queued, let alone 500. Coalescing in JS-side messageBatcher means
        any drop is invisible to the eye. Add a `coalescedN` counter to
        the WS frame metadata so t1-w3-t2 surfaces it in /api/health.
        Frontend t1-w4-t1 loadtest shows drop percentage must stay < 0.1%.
    - scenario: |
        Tier 2's stateless session tokens invalidate more often than
        expected because of clock skew, and the frontend must re-auth
        every few minutes.
      likelihood: medium
      impact: high
      mitigation: |
        Token TTL is 24 hours with 1-hour sliding-refresh on each WS
        message. Re-auth only happens after 24h of disconnect, not on
        minor clock drift. Mint tokens with NTP-corrected Unix seconds;
        verify with `clock_gettime` not `Clock.currTime` on the validator
        side. Add a /api/me/refresh endpoint that issues a new token
        without a full login round-trip.
    - scenario: |
        Tier 3 Redis Cluster's shard hot-spotting: a single gateway
        replica gets 80% of WS sessions and the slot it owns hits 90%
        CPU, while other replicas are idle.
      likelihood: medium
      impact: high
      mitigation: |
        Use consistent-hashing on `userId % 16384` for slot assignment.
        Enable Redis Cluster's `cluster-allow-reads-when-down no` to
        fail closed (the frontend can show "service degraded" instead
        of serving stale data). Caddy LB does session affinity by
        sticky cookie but verifies with a heartbeat every 30s; if a
        replica is unreachable the LB evicts it from the pool and
        remaps its sessions.
    - scenario: |
        Tier 3 MongoDB sharded migration corrupts an in-flight IRC
        server log buffer if the shard key isn't backfilled.
      likelihood: low
      impact: critical
      mitigation: |
        Run the `convertShardKeyToHash` migration in `JSMIGRATE_DRY_RUN=1`
        first to print counts; deploy via `make update` which already
        ships a janitor-migrate dry-run-then-apply pattern (see AGENTS.md).
        The migration uses background index build + `mongomirror` if
        the dataset is too large to migrate online. Roll back is
        supported by un-sharding the collection (mongos does this
        without data loss as long as no documents crossed chunks).
    - scenario: |
        Tier 3's vibe-core upgrade path (option B) breaks every
        admin API endpoint due to vibe-http 2.x async change.
      likelihood: medium
      impact: high
      mitigation: |
        Drive the upgrade off a feature branch. Run the full `unittest`
        test suite BEFORE merge. Re-run `tests/irc_parity` against a
        local docker-compose up. Admin SPA e2e test (a Playwright spec
        against the local dev server) covers 50+ admin endpoints; if
        any break, the migration aborts. Each ported module lands as
        its own PR — never bundling the upgrade with feature work.
    - scenario: |
        Tier 3 multi-region failover fails: gateway replica in region B
        cannot reach Redis Cluster in region A because of network
        partition, but Caddy still routes 50% of sessions to it.
      likelihood: medium
      impact: critical
      mitigation: |
        Each region's gateway replicas connect to a LOCAL Redis Cluster
        replica. Cross-region writes use Redis Streams with explicit
        consumer-group IDs so a region A replica can re-read its own
        writes on recovery. Caddy's `health_uri` for each upstream is
        `/api/health/local` which checks only LOCAL dependencies; if
        local health fails, Caddy drops the replica from the LB.
        Simulate this in t3-w13-t1 monthly.

  coordination_notes:
    - "Tier 1 (immediate freeze fix) is the HIGHEST value. Wave 1 alone
      can ship and unblocks the prod site; waves 2-4 are hardening."
    - "Tier 2 is single-process. It adds internal abstractions (stateless
      sessions, protocol v2, coalescer) but does NOT change deploy
      topology. The Caddy route, the docker-compose service count, and
      the ansible role layout are unchanged."
    - "Tier 3 introduces deploy changes. Re-running an existing
      playbook (gateway, redis, mongo) remains idempotent. New work
      is added under deploy/roles/tier3_* and new playbooks
      (tier3_gateway_lb.yml, tier3_redis_cluster.yml, tier3_mongo_sharded.yml)."
    - "Tier ordering is a HARD constraint: tier2 may not start until
      tier1_gate_passed returns true. Same for tier3. The CLI helper
      ./scripts/check-tier-gate.sh is the canonical gate."
    - "Tier 3.4 (vibe-core upgrade) is the longest path. If the user
      picks Option C (accept limits), tiers 3.1-3.3 still ship; t3-w13-t2
      becomes a multi-replica validation only."
    - "Loadtest progression MUST be reproducible. Each tier's loadtest
      is a separate dub binary configuration and a separate shell
      wrapper. The irc_parity tests stay green throughout."
    - "ROADMAP COMMITMENT: We do NOT add tasks that aren't required by
      an acceptance criterion, a tier gate, or a process-level
      isolation requirement. Any task that survives this filter should
      make the cut."

