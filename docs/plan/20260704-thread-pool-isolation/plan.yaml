  - id: t3-w11-t1-mongodb-sharded-cluster
    title: "Tier 3 — MongoDB sharded cluster deploy (config + 2 shards + mongos)"
    description: |
      Deploy a sharded MongoDB cluster:

      ```
      configsvr-1   configsvr-2   configsvr-3   (3-node RS)
      shard1-rs1    shard1-rs2    shard1-rs3    (3-node RS)
      shard2-rs1    shard2-rs2    shard2-rs3    (3-node RS)
      mongos-1      mongos-2                    (2 mongos fronting it)
      ```

      Total: 11 containers for Mongo.

      Shard keys:
      - `users` collection → `{_id: 1}` (already sharded by ObjectId)
      - `networks` collection → `{userId: 1}`
      - `buffers` (messages) collection → `{networkId: 1, bufferName: 1}` hashed
      - `messages` collection → `{channelId: 1, eid: 1}` (compound; balances by network+channel)
      - `preferences` collection → `{userId: 1}`

      Ansible role `deploy/roles/tier3_mongo/`:
      - Renders mongod.conf per node (configsvr/shard RS member)
      - Initiates replica sets via `mongosh --eval 'rs.initiate()'`
      - Connects mongos to configsvr, adds shards
      - Runs `sh.shardCollection()` for each coll with the right key
    wave: 11
    tier: 3
    agent: gem-devops
    covers:
