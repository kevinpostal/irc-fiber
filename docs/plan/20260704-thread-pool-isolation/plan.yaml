  - id: t3-w10-t2-cluster-aware-d-client
    title: "Tier 3 — Cluster-aware D Redis client (vibe-d per-slot)"
    description: |
      For TRUE horizontal Redis scaling (Tier 3.2), we need Redis
      CLUSTER (not just Sentinel) so the keyspace can grow beyond one
      machine's memory. Tier 3.2 = Redis Cluster with 16384 slots
      distributed across 6 nodes (3 masters + 3 replicas).

      The D side needs a cluster-aware client. vibe-d's RedisStorage is
      single-connection. Tier 3.2 introduces:

      - `source/ircfiber/storage/redis_cluster.d`:
        - Class `RedisClusterClient` that maintains a `RedisConnection[N]`
          pool, one per master node.
        - Hashes keys via CRC16(key) % 16384 to pick the master.
        - On `MOVED <slot> <host>:<port>` reply, re-routes the command.
        - On `ASK <slot> <host>:<port>` reply, follows the redirect.
      - All existing call sites continue to use `RedisStorage`'s public
        API; `RedisClusterClient` is a drop-in.

      Sunset t3-w10-t1's Sentinel setup; cluster-mode supersedes.
    wave: 10
    tier: 3
    agent: gem-implementer
    covers:
      - redis-cluster
      - crc16-routing
      - moved-redirect
    dependencies:
      - t3-w10-t1-redis-sentinel-cluster
    conflicts_with: []
    context_files:
      - path: source/ircfiber/storage/redis.d
        description: Existing single-connection client
    acceptance_criteria:
      - "h1: New class RedisClusterClient with per-master connection pool"
      - "h2: hashSlot(key) routes keys to the correct master"
      - "h3: MOVED reply triggers re-routing; ASK reply follows"
      - "h4: Cluster topology cached for 30s; refreshed on PONG-fail"
      - "h5: OTel metric `redis_cluster_routed_per_node_total`"
    success_criteria:
      - "Slot is uniform-distributed within ±5% across 3 masters"
      - "MOVED is followed within 1 retry"
    handoff:
