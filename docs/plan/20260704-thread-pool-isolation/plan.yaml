  - id: t1-w3-t1-fiber-watchdog
    title: "Tier 1 — Fiber watchdog: detect + log long-running fibers"
    description: |
      Add a watchdog that walks the watchedRunTask registry every 5s and
      reports any task that has been on a worker thread for > 5 seconds
      without yielding. vibe-core 2.14 doesn't expose Task.lastYield, so
      we use a wrapper helper `watchedRunTask(...)` that updates an
      external map at each yield. The watchdog checks for stale entries.

      Wrap all `runTask` sites in `app.d`, `websocket.d`, `app_engine.d`
      with the helper.

      Watchdog alerts via:
      - OTel log (severity=warn, attribute.task=...)
      - OTel metric `gateway_long_running_fiber_seconds` (gauge)
      - In-memory counter visible via `/api/admin/internal/fibers`
