  # ══════════════════════════════════════════════════════════════════════
  # TIER 3 — WAVE 9 (Multi-replica gateway + Caddy load balancer)
  # Goal: process-level isolation. Scale the gateway horizontally.
  # ══════════════════════════════════════════════════════════════════════
  - id: t3-w9-t1-caddy-load-balancer
    title: "Tier 3 — Caddy load_balancer + sticky-cookie WS affinity"
    description: |
      Add a Caddy v2 `load_balancer` directive in front of the gateway
      fleet. Each gateway replica exports:

      - /api/health/live — liveness (only local check)
      - /api/health/ready — readiness (also checks Redis/Mongo, returns
        503 if breaker is open)
      - /api/health — full health (existing endpoint)

      Caddy uses `health_uri /api/health/live` + `health_interval 5s`
      to mark failed replicas dead and stop routing to them. Cookie
      affinity: the first request sets a `lb_route` cookie = replica ID;
      subsequent requests route to the same replica.

      ```caddyfile
      reverse_proxy ircfiber-gateway-1:8090 ircfiber-gateway-2:8090 ircfiber-gateway-3:8090 ircfiber-gateway-4:8090 {
          lb_policy cookie lb_route
          lb_try_duration 5s
          health_uri /api/health/live
          health_interval 5s
          health_timeout 3s
      }
      ```

      Implementation in `deploy/roles/caddy/templates/Caddyfile.j2`.
    wave: 9
    tier: 3
    agent: gem-devops
    covers:
      - caddy-load-balancer
      - sticky-cookie
      - health-gated-routing
    dependencies:
      - t2-w8-t3-tier2-rollout-runbook
    conflicts_with: []
    context_files:
