  # ══════════════════════════════════════════════════════════════════════
  # TIER 2 — WAVE 6 (WS protocol v2 + frame coalescer)
  # ══════════════════════════════════════════════════════════════════════
  - id: t2-w6-t1-ws-protocol-v2
    title: "Tier 2 — WS protocol v2: {type, channel, payload, eid, batchSize?}"
    description: |
      v1 sends one JSON object per IRC event as one WS frame.
      v2 introduces a frame envelope:

        {
          "v": 2,
          "type": "irc_event" | "sync" | "stat_user" | ...,
          "channel": "buffer-name-or-empty",
          "payload": { ...the existing v1 JSON object... },
          "eid": 12345,
          "batchSize": 1,            // optional; >1 means N events were coalesced
          "droppedBefore": 0         // optional; coalescedN from server queue
        }

      Two wire-encoding modes:
        1. JSON envelope (default, backward compatible with v1 parser)
        2. MessagePack envelope (optional via Sec-WebSocket-Protocol
           header, opt-in by the SPA's configureWebSocket)

      Co-exists with v1 for one minor version (router-side feature flag
      `IRCFIBER_WS_PROTOCOL_V2_ENABLED=1`). Frontend adopts v2 in
      t2-w6-t2.

      Backend changes:
        - websocket.d sendToSession takes an optional `(type, payload)`
          struct instead of a raw string, builds the envelope
        - Per-session flag `protocolVersion` defaults to 1 on first
          connect, upgrades to 2 once the SPA sends the upgrade header
    wave: 6
    tier: 2
    agent: gem-implementer
    covers:
      - ws-protocol-v2
      - envelope-shape
      - back-compat
    dependencies:
      - t2-w5-t1-stateless-sessions
    conflicts_with: []
