        - source/tools/chaos_region_failover.d
        - dub.sdl
        - deploy/playbooks/tier3_chaos_drill.yml
      do_not_reinvestigate:
        - "Chaos is destructive on a single region"
      minimal_change: "1 binary + 1 dub config + 1 playbook"

  - id: t3-w13-t2-200k-ws-loadtest
    title: "Tier 3 — 200K WS sessions loadtest (50K x 4 replicas)"
    description: |
      Extend `ircfiber-loadtest` to `--tier 3`:

      - `--tier 3 --rps 100000 --duration 120 --sessions 200000`
      - 4 parallel Node sub-processes, each spawning 50K WS clients
        pointed at a different gateway replica (via the `lb_route`
        cookie).
      - 100K msg/sec distributed across 200K user channels (0.5
        msg/sec/user avg).
      - Reports: per-replica CPU, per-replica RPS, dropPercent,
        /api/health p99 per replica.

      Goal: prove the Tier-3 architecture can hold 200K WS at 100K
      msg/sec distributed.
    wave: 13
    tier: 3
    agent: gem-implementer
    covers:
      - tier-3-loadtest
      - multi-replica-driver
      - per-replica-metrics
    dependencies:
      - t3-w13-t1-multi-region-failover-sim
    conflicts_with: []
    context_files:
      - path: source/loadtest/main.d
        description: D loadtest driver
      - path: scripts/loadtest-ws-clients.js
        description: Tier-2 simulator (extended)
    acceptance_criteria:
      - "h1: ircfiber-loadtest --tier 3 --rps 100000 --duration 120 --sessions 200000"
      - "h2: Per-replica CPU + RPS in the JSON report"
      - "h3: drops at < 0.1% of total messages"
      - "h4: p99 /api/health per replica < 200ms"
    success_criteria:
      - "5 consecutive runs pass on OVH-tier hardware (4 replicas x 16-core)"
    handoff:
      target_files:
        - source/loadtest/main.d
        - scripts/loadtest-ws-clients.js
        - scripts/run-loadtest.sh
      do_not_reinvestigate:
        - "Memory for 200K WS clients = ~6GB resident (Node)"
      minimal_change: "Driver tier flag + tier-3 driver spawn"

  - id: t3-w13-t3-tier3-ci-gate
    title: "Tier 3 — ./scripts/check-tier-gate.sh --tier 3"
    description: |
      Extends the gate to tier-3:

      ```bash
      ./scripts/check-tier-gate.sh --tier 3 \
          --sessions 200000 --rps 100000 --duration 120
      ```

      Asserts:
      - 200K WS sessions held by 4 gateway replicas
      - 100K msg/sec sustained 120s with p99 < 200ms
      - dropPercent < 0.1%
      - Mongo CPU < 50% peak (now sharded)
      - Redis Cluster keys distributed ±10% across 3 masters
      - Chaos drill (t3-w13-t1) passes 5 times

      Exits 0 + `TIER3_GATE_PASSED=true` on PASS.
    wave: 13
    tier: 3
    agent: gem-implementer
    covers:
      - ci-gate-tier3
      - perf-budget-tier3
      - regression-guard
    dependencies:
      - t3-w13-t2-200k-ws-loadtest
    conflicts_with: []
    context_files:
      - path: scripts/check-tier-gate.sh
        description: Gate orchestrator (extended to tier 3)
      - path: Makefile
        description: pre-deploy target
    acceptance_criteria:
      - "h1: Gate runs all tier-3 loadtest scenarios"
      - "h2: Gate prints TIER3_GATE_PASSED=true on success"
      - "h3: Promotion to OVH production is BLOCKED if TIER3_GATE_PASSED != true"
    success_criteria:
      - "Gate passes on Tier-3 patched gateway fleet"
    handoff:
      target_files:
        - scripts/check-tier-gate.sh
        - Makefile
      do_not_reinvestigate:
        - "Total CI time +~150s"
      minimal_change: "Extend the existing gate script; one Makefile hook"

# ═══════════════════════════════════════════════════════════════════════════
# RETROSPECTIVE — what we WISH we had known sooner
# ═══════════════════════════════════════════════════════════════════════════
retrospective:
  what_worked:
    - "T+0 diagnosis was fast: docker stats + curl + docker logs on OVH
      immediately revealed the gateway pegged at 100% CPU; Caddy behind
      it returned 525 from Cloudflare"
    - "vibe-core 2.14 source was readable in ~/.dub/packages — pivot to
      alternative API (priority + worker task) was straightforward"
    - "The irc_parity test harness (9 scenarios) stays green throughout
      Tier 1 — every reload keeps the engine → gateway → client path
      observable"
    - "Tier separation forced us to commit to scopes. Tier 1 fixes the
      freeze and ships; Tier 2 is structural scaling; Tier 3 is
      deploy isolation. No scope creep across tiers."
  what_we_wish_we_knew_earlier:
    - "vibe-d 0.10 has a single shared pool — there's no clean way to
      add per-concern pools without bumping. Tier 3 should have been
      on the roadmap at v1 launch"
    - "MongoDB connection storm handling MUST be a first-class concern
      at design time. The current `_ = db.findOne()` pattern in
      healthCheck silently masks auth failures behind generic errors"
    - "Watchdog pattern (long-running fiber detection) should have been
      there from day 1"
    - "mongo-init.js was stale relative to the running gateway env;
      the discrepancy masked the real wedge from being debugged via
      environment inspection alone. Add an env-assertion step at boot"
    - "Caddy load balancing is invisible from inside the gateway. We
      need explicit gateway-internal metrics (outbound queue depth,
      pref save latency) to spot a wedge BEFORE the LB times out.
      Added in Tier 1 wave 3."
  future_thinking:
    - "Tier 3.4 (vibe-core upgrade) is the longest path. If Option B
      wins, schedule it AFTER enterprise customers are locked in
      (the migration risk is real)"
    - "Long-term: a dedicated IRC event forwarder process (separate
      binary, Kafka-style) would give real process-level isolation.
      This is the architecture Twitter / Discord / Slack use. Tier 3
      moves us closer but stops at Sentinel + Cluster"
    - "Frontend messageBatcher.ts is already a 200ms debounce. Server-
      side coalescing in t1-w1-t1 is structural insurance, not a
      behavior change visible to users."
    - "If Option C (accept limits) wins, the SLA is documented in
      docs/SCALING.md. If Option A (Go rewrite) wins, we have a real
      issue-tracking story for the migration (~3-4 months)."
  questions_to_revisit:
    - "Does t1-w1-t1's drop-oldest queue introduce eid ordering issues?
      Confirm with irc_parity tests AND with the new wsConnection.v2.test.ts"
    - "How does TaskSettings(100) interact with the io-worker-pool under
      flood? Need to loadtest for a full second"
    - "Is the lb_route cookie HMAC verification actually safe against
      a malicious client picking a stale-but-valid replica? Profile
      with `httperf` style benchmarking"
    - "At 200K WS sessions, what does the gateway's resident memory
      look like (vibe.d's fiber stack allocation per WS connection)?"
    - "Does the Redis Cluster MOVED reply storm during a resharding
      degrade gateway p99 below 200ms?"

