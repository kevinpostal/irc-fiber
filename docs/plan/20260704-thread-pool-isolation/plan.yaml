  - id: t2-w5-t2-network-config-cache
    title: "Tier 2 — Network/prefs config cache in Redis hash + LRU"
    description: |
      `NetworkRepository.findByUserId` and `PreferencesRepository.load`
      run on every WS connect AND on the periodic sync command. At
      50K connections with 25K msg/sec, Mongo can't sustain this.

      Tier 2 moves these reads to a Redis hash `irc:userconfig:<userId>`
      that mirrors Mongo. The hash is populated by a periodic bulk-load
      task (every 5 minutes) and on-demand by the gateway on a cache
      miss. Writes go to Mongo (write-through) and to the hash
      (write-behind via runWorkerTaskH).

      Implementation:

      1. New module `source/ircfiber/storage/userconfig_cache.d`:
         - `NetworkConfig[] getNetworksForUser(UUID userId)`
         - `UserPreferences getPrefsForUser(UUID userId)`
         - Both backed by Redis hash; on miss, fall through to Mongo
           and repopulate.
      2. Bulk-loader task starts at boot: scan all `users` from Mongo,
         populate `irc:userconfig:*` hashes.
      3. Update invalidation: when `updateNetwork`, `updatePrefs` etc.
         is called via REST, both Mongo AND the cache hash are updated.
