  - id: t3-w11-t2-shard-migration-tool
    title: "Tier 3 — janitor-migrate-style shard-migrate for existing data"
    description: |
      Migrate the EXISTING Mongo data into the sharded cluster with zero
      downtime. New tool `janitor-shard-migrate.d`:

      ```bash
      dub build --config=janitor-shard-migrate
      JSMIGRATE_DRY_RUN=1 ./janitor-shard-migrate \
        --src=mongodb://mongo-direct:27017 \
        --dst=mongodb://mongos-1:27017
      ```

      Steps:
      1. List all collections + counts
      2. For each, run `mongodump` → `mongorestore --sharded-from-dump`
         against the destination.
      3. For ongoing writes during the migration, the gateway's tier-3
         D client switches writes to mongos as soon as both ends are
         verified consistent (lag < 1s).
      4. Cutover: gateway's `IRCFIBER_MONGO_URL` is updated via the
         ansible role; gateway restarts; mongos is now sole writer.

      Rollback: switch `IRCFIBER_MONGO_URL` back to the direct
      connection (read-only) and `mongodump` again.
    wave: 11
    tier: 3
    agent: gem-implementer
    covers:
      - shard-migration
      - online-cutover
      - rollback
    dependencies:
      - t3-w11-t1-mongodb-sharded-cluster
    conflicts_with: []
    context_files:
