plan_id: 20260704-thread-pool-isolation
objective: |
  Eliminate the "site freezes when IRC traffic floods" symptom on ircfiber.com
  AND redesign the gateway architecture to be enterprise-grade and capable
  of handling hundreds of thousands of concurrent users.

  The plan is structured as three tiers, each gated by an explicit capacity
  milestone that must be provable before the next tier begins:

    Tier 1 (week 1)         — IMMEDIATE freeze fix in the current single
                                process. Per-session outbound queues, priority
                                demotion, explicit yields, Mongo circuit
                                breaker, fiber watchdog, /api/health
                                contention surface, SigNoz alert,
                                ircfiber-loadtest + p99<200ms gate.
                                CAPACITY TARGET: 10K concurrent WS sessions,
                                10K msg/sec.

    Tier 2 (weeks 2-3)      — Single-process, 50K-user scale. No deploy
                                change. Adds stateless Redis-only session
                                tokens (no Mongo on the WS hot path),
                                WS-protocol-v2 batched frames, gateway-side
                                write coalescer, drain-pool worker pattern,
                                adaptive per-session backpressure.
                                CAPACITY TARGET: 50K concurrent WS sessions,
                                25K msg/sec distributed across the fleet.

    Tier 3 (weeks 4-12)     — Process-level isolation + deploy HA. Multi-
                                replica gateway behind a Caddy load balancer
                                with sticky-cookie WS affinity, Redis Cluster
                                (3-node Sentinel + 2 shards), MongoDB
                                sharded (config svr + 2 shards + 2 mongos),
                                and a **DECISION_BLOCKER** on the vibe-core
                                upgrade path (Go rewrite vs D-lib bump vs
                                accept-limits). Sub-plan t3-upgrade-vibe-core.
                                CAPACITY TARGET: 200K concurrent WS sessions,
                                100K msg/sec distributed, multi-region
                                failover simulated.

  Each tier's success criterion is its own load test. We do NOT ship a tier
  to OVH prod until its tier gate passes (see rollout_plan at the bottom).
created_at: 2026-07-04T22:30:00Z
updated_at: 2026-07-04T22:30:00Z
created_by: gem-planner
status: pending
tldr: |
  Three-tier enterprise redesign of the IRC Fiber gateway. Tier 1 (11 tasks
  across 4 waves) keeps the existing fiber-level isolation fixes but
  reshapes them into a single deploy unit. Tier 2 (12 tasks across 4 waves)
  adds internal abstractions — stateless Redis-backed sessions, WS
  protocol v2 batched frames, gateway write coalescer — for 50K-user
  single-process scale. Tier 3 (10 tasks across 5 waves) introduces
  process-level isolation via multi-replica gateway behind Caddy LB,
  Redis Cluster, MongoDB sharded, and a sub-plan for the vibe-core
  upgrade decision (Go rewrite vs D-lib bump vs accept limits). Each
  tier has its own loadtest progression (10K → 25K+50K WS → 200K WS
  across 4 replicas) and its own CI gate that must pass before the
  next tier ships.

