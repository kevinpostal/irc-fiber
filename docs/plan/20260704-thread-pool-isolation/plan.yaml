  - id: t1-w4-t2-load-test-gate
    title: "Tier 1 — Load-test p99 < 200ms gate in pre-deploy script"
    description: |
      Pre-deploy gate `./scripts/check-tier-gate.sh --tier 1`:

      1. Spins up the docker-compose stack locally
         (`docker compose -f docker-compose.test.yml up -d`).
      2. Registers a test user + test network in Mongo.
      3. Runs `./scripts/run-loadtest.sh --tier 1 --rps 10000 --duration 60`.
      4. Polls /api/health every 5s during the flood; collects p50/p99/avg
         latency.
      5. Asserts p99 < 200ms and zero timeout errors.
      6. Tears the stack down.
      7. Exits 0 on PASS, 1 on FAIL.

      Wire into `make pre-deploy` (existing target). Default execution
      skips with a `[SKIP]` line if no docker compose available.

      This gate is the proof that the structural isolation works. Without
      it, we can revert to the wedged state without noticing.
