  - id: W3-T01
    title: ConnectionStatus.svelte full rewrite — 11 states + countdown + state-aware button
    description: |
      Rewrite `frontend/src/components/ConnectionStatus.svelte` to render
      the IRCCloud-style 11-state banner with structured failure rendering,
      ordinal attempt counts, 1s countdown timer, and the hairline-bar
      visual treatment.

      11 STATES (lifted verbatim from
      irccloud-webpack-study/app/src/view/connectionstatusview.js:64-123):

      | Status | Text template |
      |---|---|
      | `waiting_to_retry` (will retry) | "Reconnecting in {delay}s ({Nth} attempt)" |
      | `waiting_to_retry` (give up) | "Reconnecting…" |
      | `queued` | "Connection queued; waiting our turn…" |
      | `connecting` | "Connecting to {host}…" |
      | `connected` | "Connected; handshaking…" |
      | `connected_joining` | "Connected; setting up…" |
      | `quitting` | "Quitting…" |
      | `ip_retry` | "Connecting to {ip} failed ({error}); resolving a new IP…" |
      | `disconnected` (not failed) | "Disconnected" |
      | `connected_ready` (focusOnMakeBuffer==='*') | "Connected; waiting to join…" |
      | `connected_ready` (focusOnMakeBuffer is channel) | "Connected; waiting to join {chan}…" |

      COUNTDOWN — use Svelte 5 runes with $effect + onCleanup:

      ```ts
      let countdown = $state(0);
      $effect(() => {
        const rs = activeNetwork?.retryStatus;
        if (!rs) { countdown = 0; return; }
        const tick = () => {
          const remaining = Math.max(0, Math.ceil((rs.nextRetryAtMs - Date.now()) / 1000));
          if (countdown !== remaining) countdown = remaining;
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => clearInterval(id);
      });
      ```

      The cleanup returns from $effect; Svelte 5 wires it automatically.
      On unmount OR when `retryStatus` flips (e.g. user clicks Reconnect
      which sets it to null), the interval is cleared. NO timer leak.

      ORDINAL ATTEMPT COUNT — lift from connectionstatusview.js:46-50:

      ```ts
      function ordinal(n: number): string {
        const suffix = ['th', 'st', 'nd', 'rd'];
        const mod = n % 100;
        return n + (suffix[(mod - 20) % 10] || suffix[mod] || suffix[0]);
      }
      ```

      Used in: "Reconnecting in 5s (2nd attempt)". Only when attemptCount > 1.

      STATE-AWARE BUTTON — derived from the existing connectionState +
      failInfo:
      - `disconnected` AND no failInfo: <button>Click to reconnect</button>
      - `disconnected` AND `failInfo.type === 'killed'`: <button>Click to disconnect</button>
      - `disconnected` AND `failInfo.type === 'connecting_restricted'` OR `'connection_blocked'`: <button>Click to see upgrade options</button> (degrades to reconnect in fiber; TODO header)
      - `waiting_to_retry` AND willRetry: <button>Click to cancel reconnect</button> (calls disconnectNetwork)
      - All other states: no button (banner is informational only)

      RICH FAILURE RENDERING — lift the failure branch from
      connectionstatusview.js:146-233. For each failInfo field:

      - `failInfo.type === 'connecting_restricted'`: render
        `renderRestricted(failInfo.reason)`. Bold the upgrade CTA (fiber
        has no tier system; render `Disconnected` for unknown reasons).
      - `failInfo.type === 'connection_blocked'`: render
        "Disconnected - Connections to this server have been blocked".
      - `failInfo.type === 'killed'`: render "Disconnected - Killed: {strip(killedReason)}".
      - `failInfo.reason === 'ssl_verify_error'`: render
        `<i class="warning-icon"></i> Strict transport security error: {renderSSLVerify(failInfo.sslVerifyError)}`.
      - `failInfo.type === 'connecting_failed'`: render
        "Failed to connect - {renderReason(failInfo.reason)}".
      - Otherwise: render "Disconnected: {renderReason(failInfo.reason)}".

      Inline suspicious-port / suspicious-host warnings:
      - If `isSuspiciousPort(net.tls === 'on', net.port)`, render
        `<b>You're trying to connect {via|without} SSL on port {port}.</b>`.
      - If `!net.systemManaged && isSuspiciousHostname(net.host)`, render
        `<b>Your hostname looks invalid: {host}</b>`.

      HAIRLINE-BAR VISUAL — adopt IRCCloud's `.connectionStatus` styling
      (full-width hairline border top+bottom, tinted bg, right-floated
      label, hover/focus brighten). The current fiber banner uses an
      inline gradient — replace with hairline + tinted bg:

      ```css
      .connectionStatus {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        background: var(--fiber-blue-soft, rgba(103,232,249,0.06));
        border-top: 1px solid var(--fiber-line);
        border-bottom: 1px solid var(--fiber-line-2);
        color: var(--fiber-cloud);
        font-family: var(--font-sans, sans-serif);
        font-size: 12px;
        line-height: 18px;
        transition: background-color 120ms ease;
      }
      .connectionStatus:hover { background: var(--fiber-blue-soft-hover); }
      .connectionStatus--fail  { background: var(--fiber-amber-soft); border-color: var(--fiber-amber); }
      .connectionStatus--reconnect { /* default */ }
      .connectionStatus .label { flex: 1; min-width: 0; }
      .connectionStatus .button { flex-shrink: 0; margin-left: auto; }
      ```

      State classes — apply via `:class={...}` (Svelte 5):
      - `.connectionStatus--away`
      - `.connectionStatus--connecting`
      - `.connectionStatus--reconnect`
      - `.connectionStatus--fail`
      - `.connectionStatus--disconnect`
      - `.connectionStatus--upgrade`

      Keep the existing `.connectionstatuscell.show` wrapper (used to
      toggle visibility). Don't remove the outer `<div>` — just rewrite
      the inner content.

      TYPING — keep using Space Grotesk for labels, fiber-mono for
      content (counts / time). No font family changes.

      AWAY STATE — unchanged. The "Click to come back (or type /back)"
      banner is structurally identical to IRCCloud's `away` state.

      DO NOT TOUCH: existing props (`onSendRaw`, `onReconnect`),
      `setActiveBuffer` import, `requestSync` import. The new banner
      adds state-aware behaviour on top of these callbacks.
