plan_id: 20260716-irccloud-parity
objective: Make the IRC Fiber "Connecting / Server log" surface (ConnectionStatus banner + ServerLogTimeline) match IRCCloud's information density, error rendering, and visual restraint — without cloning IRCCloud's brand. Bridge the existing `disconnectReason` string to a structured `failInfo` payload emitted by the engine, render every connection-attempt phase under one persistent hairline-bar connection-events panel, render IRCCloud-style suspicious-host / suspicious-port warnings inline, and replace the cyan-chip + cyan-stripe welcome / MOTD styling with type_info_response / type_motd_response rows that match the IRCCloud visual grammar while keeping the fiber palette.
created_at: '2026-07-16T18:00:00Z'
created_by: gem-planner
status: pending
tldr: |
  Three cohesive UX gaps between fiber and IRCCloud converge on one plan:

  (1) ConnectionStatus is a 3-state banner that silently drops a lot of information IRCCloud
  surfaces in the same area — 11 connection phases, an ordinal "Nth attempt" label, a 1s
  countdown via setInterval, structured failInfo (pool_lost / nxdomain / econnrefused /
  ssl_certificate_error / killed_reason), suspicious-port + suspicious-hostname warnings,
  IRCCloud's hairline-bar visual treatment, and a state-aware button (reconnect | disconnect
  | upgrade). The engine already has all the data — applyIsupport already emits structured
  events; the 005-handler already mirrors failInfo fields — but the connection.d reconnect
  loop and the engine's snapshot path don't surface them, and the frontend banner doesn't
  render them.

  (2) ServerLogTimeline currently dumps phase / notice / motd / numerics directly into the
  card; IRCCloud wraps all of that in a single "Connection events (N)" <details> block,
  collapsed by default, with a top-level "Show connection events in server log" toggle
  in the context menu. This plan wraps the existing attempt.phases + welcome + motd +
  numerics + isupport + notices rows in `<details class="connection-events" open={!pref}>`,
  default-collapsed, and persists the pref in localStorage as `serverlogCollapseEvents`
  (global, not per-network — matches the IRCCloud model and avoids key proliferation).

  (3) Welcome banner rows (001-004) and MOTD rows currently paint with a cyan stripe +
  cyan-stripe row--info + cyan chip row-tag. IRCCloud renders these as type_info_response /
  type_motd_response rows with `padding:10px` and no cyan accent. We adopt the IRCCloud
  visual grammar (padding, no cyan stripe on the row itself) but keep the cyan-blue palette
  tokens — the fiber brand stays ours. Per-row type tint comes from a new `rowClassForCommand`
  helper; status / notice prefixes use mono `type_status` / `type_notice` typography.

  Across all three: replace the legacy `disconnectReason` string with a structured
  `failInfo{type,reason,ssl_verify_error,killed_reason}` payload emitted by the engine as
  a new `CONNECTION_FAIL` synthetic event, AND keep emitting `disconnectReason` for
  back-compat with code that pre-dated the structured payload. Frontend reads the
  structured field via renderReasons.ts (port of IRCCloud's `renderreasons.js`) and falls
  back to the legacy string when structured info is absent.

