tasks:
  # ─────────────────────────────────────────────────────────────────────────
  # WAVE 1 — Engine: structured retry / fail tracking + wire events
  # ─────────────────────────────────────────────────────────────────────────
  - id: W1-T01
    title: Engine: structured retry/fail tracking, CONNECTION_RETRY_STATUS + CONNECTION_FAIL events, snapshot retryStatus
    description: |
      Extend the IRC engine to surface connection-lifecycle state in a
      structured form the frontend can render (instead of free-text
      `disconnectReason`). Five sites:

       A. `source/ircfiber/irc/connection.d` —
          · Add `waiting_to_retry` to the `ConnectionState` enum at
            line 39-44. Currently the enum declares only
            `disconnected`, `connecting`, `connected`, `disconnecting`;
            the frontend's `ConnectionState` (frontend/src/types.ts:17-23)
            already has `waiting_to_retry` as a variant, but no engine
            site writes it. Without this enum entry the rest of B1 is
            impossible (the engine would have no way to express the
            "sleeping before next reconnect attempt" state). No other
            frontend variants (`queued`, `connected_joining`) need to
            land in the engine enum for this plan — those are derived
            from `connecting` / `connected` on the frontend side.
          · Add `int attemptCount` and `long nextRetryAtMs` fields to
            `PersistentIRCClient` (read-only public accessors via getter
            pair, alongside existing `getIsupport` / `getAckedCaps`).
          · At the reconnect-loop site immediately before the deadline
            sleep (the canonical site is `auto deadline =
            Clock.currTime + delay;` at line 1595, inside the `while
            (Clock.currTime < deadline)` block start):
              1. Set `state = ConnectionState.waiting_to_retry;`
                 — this REPLACES the existing `state =
                 ConnectionState.connecting;` at line 1575 (whose
                 "snapshotter reports connecting" rationale is now
                 satisfied by `waiting_to_retry` plus the retry-status
                 payload below; the user-click Disconnect affordance
                 that 1575 wanted is unchanged because the WS sync
                 still ships `connectionState = waiting_to_retry`).
              2. Bump `backoff.currentAttempt()` and compute
                 `nextRetryAtMs = Clock.currTime.toUnixTime!long * 1000
                 + delay.total!"msecs"`,
                 `attemptCount = backoff.currentAttempt()`.
              3. Call
                 `eventChannel.put(IRCRawEvent.makeConnectionRetryStatus(
                     network, nid, attemptCount,
                     Clock.currTime.toUnixTime!long * 1000 +
                       delay.total!"msecs",
                     delay.total!"msecs"))`
                 so the frontend can render the ordinal label and the
                 1s countdown. Emit AFTER the existing `emitLog("queued",
                 …)` call (line 1587-1591) so the user-visible log line
                 lands before the structured event.
              4. After the `while (Clock.currTime < deadline)` sleep
                 loop exits, the next iteration of the outer reconnect
                 loop (line 1370) calls `attemptConnection()` →
                 `attemptConnectionImpl` (line 1691) which already sets
                 `state = ConnectionState.connecting;` at line 1704.
                 LEAVE that line alone — it correctly transitions OUT
                 of `waiting_to_retry` once the timer fires (this is
                 the "After the timer fires (state is still
                 `waiting_to_retry`), set `state =
                 ConnectionState.connecting;` before
                 `attemptConnection()`." sequence the brief asks for).
          · At EVERY `backoff.reset()` site emit a zero-valued clear so
            `applyRetryStatus(networkId, null)` fires on the frontend
            and clears both `net.retryStatus` AND `net.failInfo`:
              - Line 1044 (success path after registration) — set
                `attemptCount = 0; nextRetryAtMs = 0;` then
                `eventChannel.put(IRCRawEvent.makeConnectionRetryStatus(
                    network, nid, 0, 0, 0))`.
              - Line 1193 (success path after reconnect) — same.
              - Line 1831 (success path after a fail cycle completes
                a subsequent reconnect) — same.
            Without these emissions the banner shows "Reconnecting… /
            Disconnected: …" stale even after a successful reconnect
            because the frontend only nulls the store fields when it
            observes a CONNECTION_RETRY_STATUS event (see B3).
            Cross-reference: see section G for the smoke test that
            verifies this.
         · Build `failInfo` at the disconnect site (around line 1422-1431
           where lastEmittedReason is set): parse the reason text against
           a fixed table of structured cases — `etimedout`, `econnrefused`,
           `nxdomain`, `ssl_certificate_error`, `ssl_error`,
           `pool_lost`, `ehostunreach`, `enetdown`, `crash`,
           `killed_reason`. Emit `CONNECTION_FAIL` with the structured
           payload via `eventChannel.put(IRCRawEvent.makeConnectionFail(...))`.
           The legacy `lastEmittedReason` string is still set and the
           DISCONNECTED event still carries the string (back-compat).

      B. `source/ircfiber/irc/manager.d` —
         No code change here. `eventChannel.put` on the per-client channel
         already publishes to the main dispatch channel; CONNECTION_RETRY_STATUS
         / CONNECTION_FAIL propagate automatically. Wave 1 verifies by
         reading the existing addAndStartNetwork + getClient path.

      C. `source/ircfiber/models/irc_event.d` —
         Add two factory methods next to `makeIsupport` (line 209):
         ```d
         static IRCRawEvent makeConnectionRetryStatus(
             string network, string networkId,
             int attemptCount, long nextRetryAtMs, long delayMs) { ... }
         static IRCRawEvent makeConnectionFail(
             string network, string networkId,
             const ref FailInfo info) { ... }
         ```
          Define a `FailInfo` struct next to the factory. Pick ONE
          nested shape so the engine and the frontend agree on every
          field (see B2): both layers use the SAME wire shape, no
          per-side conversion in messageHandler.ts.

          `vibe.data.json` is already imported at line 4 of irc_event.d
          and `Json` is the existing `vibe.d.data.json.Json`
          (used at lines 49 / 65); no new imports needed.
          ```d
          struct FailInfo {
              string type;            // "connecting_failed" | "killed" | "ssl_verify_error" | "socket_closed"
              string reason;          // raw reason (matches IRCCloud's RENDER_REASONS keys)
              string killedReason;    // populated when type=="killed"; empty otherwise
              Json   sslVerifyError;  // populated when reason=="ssl_verify_error";
                                       // nested Json object: { "type": <string>,
                                       //                       "error": <string> }
                                       // Use Json(string[string]) so the wire shape
                                       // is a JSON object, not a flat pair.
                                       // Leave at the Json() default (empty) for
                                       // non-ssl cases — deserialised as null.
          }

          // Helper that builds the nested sslVerifyError Json object so
          // call-sites stay tidy and the wire shape matches the
          // frontend's TS interface exactly:
          void setSSLVerify(FailInfo* dst, string type, string error) {
              string[string] inner;
              inner["type"]  = type;
              inner["error"] = error;
              dst.sslVerifyError = Json(inner);
          }
          ```

          Invariants:
          - For non-ssl failInfo (the common case) call-sites LEAVE
            `info.sslVerifyError` at the default — the JSON serialiser
            emits `null` for the field, which decodes as
            `sslVerifyError?: null` on the TS side (optional, so
            existence is the truthy check, not a null check).
          - For ssl failInfo, `info` is constructed locally then
            passed `&info` to `setSSLVerify(&info, "bad_cert",
            "cert_expired")` (or whatever the verification detail is),
            THEN handed to `IRCRawEvent.makeConnectionFail(network,
            nid, info)`.
          - Engine NEVER writes the legacy flat shape
            (`sslVerifyErrorType` + `sslVerifyErrorError` siblings) —
            that struct is gone (see B2).

      D. `source/ircfiber/redis/protocol.d` —
         `NetworkStateSnapshot` gains:
         ```d
         /// Structured retry state surfaced from the engine's reconnect loop.
         /// Frontend uses this to render the ordinal "Nth attempt" label,
         /// the 1s countdown via setInterval, and the "Reconnecting..." state
         /// badge in ConnectionStatus. Nullable — absent when the network is
         /// healthy (no scheduled retry).
         RetryStatus retryStatus;
         struct RetryStatus {
             int attemptCount;
             long nextRetryAtMs;
             long delayMs;
         }
         ```
         Serialise in `toJson()` as `j["retryStatus"] = Json(retryStatus.toJson())`
         (or null when absent). Deserialise in `fromJson()` symmetrically.

      E. `source/ircfiber/engine/state.d` —
         In `writeStateSnapshotForNetwork`, populate `snap.retryStatus` from
         the client: `if (client) snap.retryStatus = client.getRetryStatus()`.
         Add `getRetryStatus()` to `PersistentIRCClient` returning a
         `RetryStatus` value (or null when both fields are zero).

      F. `source/ircfiber/api/websocket.d` —
         In `performStateDump` (around line 444-505), after the isupport
         serialisation block, ship `netObj["retryStatus"] = snap.retryStatus.toJson()`
         when the field is present; absent otherwise (frontend falls back
         to derive from connectionState). Use the same pattern as the
         existing `isupportObj` block.

      G. Verify — `dub build --config=connection-registration-test`
         exercises the connection-registration timeout path (per
         source/connection_registration_test.d, included via dub.sdl:94-100).
         It does not currently exercise the reconnect loop, so add
         smoke paths. Three scenarios:

         1. Closed-port retry-loop observable. Launch a network
            pointing at `127.0.0.1:1`. Sleep at least 15 s
            (longer than the 5 s `MIN_RECONNECT_DELAY_MS` floor at
            connection.d:1554 × 2 attempts + a margin). Observe
            `irc:state:<sid>:<nid>` via `redis-cli HGET ... data | jq
            .retryStatus` and assert:
              - `attemptCount >= 2` (the engine has cycled the
                backoff at least twice → the first connection-cycle
                actually fired CONNECTION_RETRY_STATUS, not just a
                single-shot at startup),
              - `nextRetryAtMs` is within `delayMs + 1 s` of `now`
                (the engine's timer math agrees with wall clock),
              - `delayMs > 0` (a real schedule, not a zero-valued
                clear).
            This is the strengthened smoke that supersedes the
            earlier "at least one cycle" criterion (the old one was
            too weak — it could pass after a single emit at t=0).

         2. CONNECTION_FAIL emission with the nested FailInfo shape.
            Continue from the same closed-port run. Assert the WS sync
            payload (or `irc:state:<sid>:<nid>.failInfo`) carries a
            `failInfo` object with `type`, `reason` AND — for an
            `ssl_certificate_error` reason — `sslVerifyError` as a
            nested object `{type: "bad_cert", error: "cert_expired"}`
            (NOT the legacy flat `sslVerifyErrorType` +
            `sslVerifyErrorError` siblings — those must be gone per
            B2).

         3. failInfo cleared after successful reconnect. Force the
            engine through one fail cycle (closed port → at least one
            `waiting_to_retry` + `CONNECTION_FAIL`), then re-point the
            network at a working IRC server (e.g. localhost:6667),
