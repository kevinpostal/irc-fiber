  # ─────────────────────────────────────────────────────────────────────────
  # WAVE 4 — ServerLogTimeline collapse + restyle
  # ─────────────────────────────────────────────────────────────────────────
  - id: W4-T01
    title: ServerLogTimeline connection-events wrap + restyle (real ship)
    description: |
      Finalize the Wave 2 W2-T04 work in ServerLogTimeline.svelte.

      The Wave 2 W2-T04 task already lays out the design; this task
      ships the FINAL implementation after Wave 3's banner rewrite has
      established the visual vocabulary.

      Specifically:
      - Wrap attempt.phases + welcome + motd + numerics + isupport + notices
        in a single <details class="connection-events" open={!getServerlogCollapseEvents()}>.
      - <summary> shows "Connection events ({N})".
      - <details> ontoggle syncs the pref via setServerlogCollapseEvents.
      - Restyle .row--info + .row--motd padding to 10px (drop cyan stripe + bg).
      - Replace cyan-chip row-tag with mono type_status / type_notice prefix.
      - Replace cyan-chip NOTICE block summary with inline `*** NOTICE · N messages`.

      A. Real <details> binding — use Svelte 5 `bind:open` (a native
      directive, NOT the `$bindable` rune) with a LOCAL `$state`
      mirror of the pref, plus an `$effect` that mirrors STORE
      CHANGES BACK into the local state. The browser toggles `open`
      natively on click and fires `ontoggle`; we mirror the
      browser's value into the store via that event. External
      triggers (storage event in another tab, context-menu toggle,
      setServerlogCollapseEvents from elsewhere) flow through the
      `$effect`. This is the correct Svelte 5 pattern for two-way
      binding on a native DOM attribute — see B4.

      ```svelte
      <script lang="ts">
        import {
          getServerlogCollapseEvents,
          setServerlogCollapseEvents,
        } from '$lib/stores/preferences.svelte';

        // Local mirror. `bind:open` writes here on user click;
        // the $effect below pulls external pref changes back in.
        let eventsOpen = $state(!getServerlogCollapseEvents());

        // Mirror external pref changes (storage event in another
        // tab, context-menu toggle, programmatic call) into local
        // state so the <details> rerenders without a page reload.
        $effect(() => {
          eventsOpen = !getServerlogCollapseEvents();
        });
      </script>

      <details
        class="connection-events"
        bind:open={eventsOpen}
        ontoggle={(e) => {
          const isOpen = (e.currentTarget as HTMLDetailsElement).open;
          setServerlogCollapseEvents(!isOpen);
        }}
      >
        <summary class="connection-events-summary">Connection events ({N})</summary>
        ... existing attempt rows ...
      </details>
      ```

      Why this pattern (and not `$bindable`): `<details>`'s `open`
      attribute is a native DOM property the BROWSER toggles
      independently of any Svelte prop. Svelte 5's `$bindable`
      rune is for two-way binding across a component-prop
      boundary, not for forcing reactivity onto a native
      attribute — using `$bindable` on a plain HTML element
      produces a write-once behaviour that fights the browser's
      own toggle and yields a stale `open` state on the second
      click. `bind:open` is the native Svelte 5 directive that
      correctly proxies a native element's two-way state into a
      local `$state`. Combined with the `$effect` mirror, this
      gives a clean two-way flow: browser ↔ local `$state` ↔
      preference store ↔ localStorage ↔ other tabs.

      B. 005 ISUPPORT panel MUST live inside the <details>. The existing
      <ServerFeaturesPanel> is at line 494-503; the <details> wrap
      happens above it. Verify by component test.

      C. The collapse auto-close $effect (line 319-337) stays — it
      operates on per-attempt serverlogCollapsedMap keys, independent of
      the global connection-events pref. No conflict.

      D. CSS for the connection-events <details> + summary:

      ```css
      .connection-events {
        margin: 0;
        padding: 0;
      }
      .connection-events-summary {
        cursor: pointer;
        padding: 6px 14px;
        font-family: var(--font-mono-fiber, monospace);
        font-size: 11px;
        color: var(--fiber-mist);
        letter-spacing: 0.04em;
        border-bottom: 1px solid var(--fiber-line);
        user-select: none;
      }
      .connection-events-summary:hover { color: var(--fiber-cloud); background: rgba(255,255,255,0.02); }
      .connection-events-summary::marker { color: var(--fiber-blue); }
      ```

      E. Extend `ServerLogTimeline.test.ts` (already extended in W2-T04)
      with one more case verifying the count badge updates correctly
      after a phase row is added.
