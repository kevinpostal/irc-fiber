  - id: W2-T01
    title: renderReasons.ts + suspiciousConnection.ts (port of IRCCloud helpers)
    description: |
      Two new pure-helper files under `frontend/src/lib/`. No Svelte
      imports — these are utility modules consumed by ConnectionStatus.svelte
      and ServerLogTimeline.svelte.

      A. `frontend/src/lib/renderReasons.ts` (NEW)

      Port IRCCloud's `app/src/view/renderreasons.js` (irccloud-webpack-study)
      1:1 to TypeScript. Exports:

      ```ts
      export function renderReason(reason: string): string;
      export function renderSSLVerify(info: { type: string; error: string } | null | undefined): string | undefined;
      export function renderRestricted(reason: string): string;     // degrades to generic 'Disconnected' for unknown — fiber has no tier system
      export function renderRestrictedShort(reason: string): string; // degrades to 'Limited'
      export function renderPostError(response: { message?: string; size?: number; content_length?: number } | null, message?: boolean): string;
      ```

      Tables (lifted from renderreasons.js):
      - `RENDER_REASONS`: pool_lost, no_pool, enetdown, etimedout, timeout, closed, enotconn, ehostunreach, econnrefused, nxdomain, einval, ssl_certificate_error, ssl_error, crash. Default fallback: return the raw reason string.
      - `SSL_VERIFY_ERRORS`: nested map (bad_cert → {unknown_ca, selfsigned_peer, cert_expired, invalid_issuer, invalid_signature, name_not_permitted, missing_basic_constraint, invalid_key_usage}; ssl_verify_hostname → {unable_to_match_altnames, unable_to_match_common_name, unable_to_decode_common_name}). Default fallback for renderSSLVerify: return `info.type + ': ' + info.error`.
      - `RESTRICTED_REASONS`: networks, unverified, passworded_servers, slack_disallowed. Default fallback: 'You can't connect to this server with a free account. Upgrade now'. Fiber-specific: when fiber has no tier system, this branch never renders the upgrade CTA; instead ConnectionStatus degrades to the 'Click to reconnect' button. Document in renderReasons.ts TODO header.
      - `RESTRICTED_REASONS_SHORT`: short variants.
      - `POST_ERRORS`: connection_down, connection_unavailable, database_down, auth, invalid_org_id, invalid_cid, invalid_nick, invalid_edit, paste_too_large, paste_invalid, paste_empty, file_too_large (function with message + response), invalid_file_type, image_too_large, file_write_error, banned_content, upload_limit_reached, unverified, missing_file, upload_already_exists, invalid_upload_id, upload_not_found, upload_error, batch_upload_failed, blocked_command, invalid_topic.

      File wrapper is NOT ported (fiber has no client-side sizeToString; file_too_large falls back to the static 'Sorry, you can't upload files larger than 15 MB.' without the size suffix).

      B. `frontend/src/lib/suspiciousConnection.ts` (NEW)

      Port IRCCloud's `connection.js:isSuspiciousPort` + `isSuspiciousHostname`:

      ```ts
      export function isSuspiciousPort(isSSL: boolean, port: number, defaultPort = 6667, defaultSSLPort = 6697): boolean {
        return (isSSL && port === defaultPort) || (!isSSL && port === defaultSSLPort);
      }

      export function isSuspiciousHostname(hostname: string): boolean {
        if (!hostname) return false;
        return hostname[0] === '.'
            || hostname[hostname.length - 1] === '.'
            || (hostname.indexOf('.') === -1 && hostname.indexOf(':') === -1);
      }
      ```

      C. Tests — `frontend/src/lib/renderReasons.test.ts` (NEW, vitest, project=lib)
      Exhaustively assert every RENDER_REASONS key returns the expected string. Assert renderSSLVerify returns the nested-key string for each (type,error) pair. Assert renderReason returns the raw reason for unknown keys. Assert isSuspiciousPort for the four combinations. Assert isSuspiciousHostname for each branch.

      D. Tests — `frontend/src/lib/suspiciousConnection.test.ts` (NEW, vitest, project=lib)
      Direct port of IRCCloud's test cases (these were simple synchronous functions, easy to enumerate):
      - isSuspiciousPort(true, 6667) === true; isSuspiciousPort(true, 6697) === false
      - isSuspiciousPort(false, 6697) === true; isSuspiciousPort(false, 6667) === false
      - isSuspiciousHostname('irc.example.org') === false
      - isSuspiciousHostname('.irc.example.org') === true (leading dot)
      - isSuspiciousHostname('irc.example.org.') === true (trailing dot)
      - isSuspiciousHostname('localhost') === true (no dot, no colon)
      - isSuspiciousHostname('::1') === false (IPv6 has colon)
      - isSuspiciousHostname('') === false (defensive)

      The required_test_first for this task is the renderReasons.test.ts file —
      it pins the IRCCloud table values before any consumer is built.
