  - id: W2-T02
    title: types.ts + ircStore.svelte.ts + messageHandler.ts plumbing for retryStatus + failInfo
    description: |
      Plumbing to deliver retryStatus + failInfo from the WS wire to the
      ConnectionStatus banner. Three files.

      A. `frontend/src/types.ts` — extend the Network interface:

      ```ts
      export interface RetryStatus {
        attemptCount: number;
        nextRetryAtMs: number;
        delayMs: number;
      }

      export interface FailInfo {
        type: string;            // "connecting_failed" | "killed" | "ssl_verify_error" | "socket_closed" | ...
        reason: string;          // raw reason (RENDER_REASONS key)
        killedReason?: string;
        sslVerifyError?: { type: string; error: string };
      }

      export interface Network {
        // ... existing fields ...
        /** Engine-reported retry state. Populated from CONNECTION_RETRY_STATUS
         *  events and from the WS sync retryStatus field. Cleared on successful
         *  connection (backoff.reset equivalent). */
        retryStatus?: RetryStatus | null;
        /** Structured disconnect reason. Populated from CONNECTION_FAIL events.
         *  Preferred over `disconnectReason` (the legacy string) for new code. */
        failInfo?: FailInfo | null;
      }
      ```

      Keep `disconnectReason: string` (line 44) — it remains the legacy
      fallback. New code reads `failInfo` first, falls back to
      `disconnectReason` if absent.

      B. `frontend/src/stores/ircStore.svelte.ts` — add two exports near
      the existing applyIsupportUpdate (line 2094):

      ```ts
      export function applyRetryStatus(networkId: string, status: RetryStatus | null): void {
        const net = ircState.networks.find(n => n.networkId === networkId);
        if (!net) return;
        net.retryStatus = status;
        if (!status) net.failInfo = null;  // retry cleared → not failed
      }

      export function applyFail(networkId: string, failInfo: FailInfo): void {
        const net = ircState.networks.find(n => n.networkId === networkId);
        if (!net) return;
        net.failInfo = failInfo;
      }
      ```

      Also extend `updateNetworkFromSync` (line 1308+) so the sync snapshot
      adopts `retryStatus` from the snapshot (analogous to how
      `isupport` is adopted at line 488-499 of websocket.d):

      ```ts
      if (net.retryStatus) existing.retryStatus = net.retryStatus;
      else existing.retryStatus = null;
      ```

      C. `frontend/src/lib/messageHandler.ts` — extend `unpackEvent` or
      the dispatch in the main handler function to route two new command
      names. Place the dispatch in the same switch the ISUPPORT handler
      lives in (around line 226):

      ```ts
      if (cmd === 'CONNECTION_RETRY_STATUS') {
        const rs = data.rs as RetryStatus | undefined;
        if (rs) applyRetryStatus(networkId, rs);
        return {};
      }
      if (cmd === 'CONNECTION_FAIL') {
        const fi = data.fi as FailInfo | undefined;
        if (fi) applyFail(networkId, fi);
        return {};
      }
      ```

      Both are immediate (bypass batcher) — they enter through the
      _server buffer or directly mutate network state, not message appends.

      D. Extend the NetworkStateSnapshot sync adopt — when the WS sync
      delivers a non-null retryStatus, it overwrites the prior value
      atomically. Test for the case where a stale retryStatus from a
      prior connection attempt survives a successful connect (the
      backoff.reset path should null it out, and the sync should
      reflect that).
