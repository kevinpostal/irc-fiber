quality_warnings:
  - "Engine emit BOTH `disconnectReason` (legacy string, consumed by ircStore.svelte.ts:2069-2073) AND structured `failInfo` (new). Document this dual-emit in connection.d so future code knows which to consume; new code MUST consume the structured payload."
  - "setInterval inside Svelte 5 rune component must be torn down on unmount AND on status change (avoid stale timers when the user clicks Reconnect, which mutates connectionState). Use $effect + onCleanup pattern; do not store the interval id on a plain let (must be in $state or captured by the closure)."
  - "ServerLogTimeline's `getServerLogCollapsedKey` returns keys shaped `networkId:eid` or `networkId:msgid:<msgid>` — these are per-attempt. The new global `serverlogCollapseEvents` pref is independent and just toggles the open attribute on the wrapping `<details>`. Don't try to unify the two collapse concepts; they're orthogonal (one is per-attempt UI state, one is a viewing pref)."
  - "ConnectionStatus is mounted in ChatArea — it must not leak setInterval handles when switching buffers. Render-test on the same activeNetwork across two `setActiveBuffer` calls should yield exactly one active interval at any time."
  - "005 ISUPPORT panel must keep working inside the new collapsed-events frame. The <details> wraps `attempt.phases + welcome + numerics + isupport + notices`, so ServerFeaturesPanel needs to render identically inside or outside the <details> — verify by visual + component test."
  - "Keep fiber palette as theme. No new color tokens. Cyan is welcome-seg / cap-tag only. The IRCCloud dusk palette tokens (#1d4063, #3473b2, #6199d1, #17334f, #c4d9ee, #dbb300, #af3a00) listed in the brief are REFERENCE colors; map them to fiber tokens, do NOT introduce them as CSS variables."

open_questions:
  - question: "Should the engine emit BOTH `disconnectReason` (back-compat) AND structured `failInfo`?"
    context: "Existing ircStore.svelte.ts:2069-2073 reads net.disconnectReason (a string). The new CONNECTION_FAIL event carries a structured failInfo. Both can co-exist; the frontend prefers the structured payload but falls back to the legacy string when structured info is absent. Recommendation: emit both."
    type: decision_blocker
    affects: [W1-T01, W2-T01]
  - question: "Per-network or global `serverlogCollapseEvents` pref?"
    context: "IRCCloud's pref is global (the context-menu item just says 'Collapse disconnects' / 'Expand disconnects' without per-network scope). Per-network would require keying `networkId:collapseEvents` in localStorage and complicates the onChange handler. Recommendation: global, simple key `ircfiber:serverlogCollapseEvents`."
    type: decision_blocker
    affects: [W2-T04, W4-T01]
  - question: "connection_blocked / connecting_restricted states — render or skip?"
    context: "IRCCloud surfaces these as 'Click to see upgrade options' / 'You can't connect to this server with a free account'. Fiber has no tier system; the typed `failInfo.type='connecting_restricted'` will arrive on the wire but renderReasons.ts should return a generic 'Disconnected' for unknown types so the UI degrades gracefully. Document in renderReasons.ts TODO. Future paid-tier work can extend the table."
    type: decision_blocker
    affects: [W2-T01]

assumptions:
  - "Engine already has `applyIsupport` and `IRCRawEvent.makeIsupport` (source/ircfiber/models/irc_event.d:209-220) — we add two new factories `makeConnectionRetryStatus` and `makeConnectionFail` next to those, mirroring the makeIsupport pattern."
  - "Engine reconnect loop in source/ircfiber/irc/connection.d:1521-1600 already computes `backoff.currentAttempt()` and `delay.total!'msecs'`. We surface these on PersistentIRCClient as `attemptCount` (int) and `nextRetryAtMs` (long) and emit a `CONNECTION_RETRY_STATUS` event after each `delay` calculation."
  - "`disconnectReason` (string) stays in NetworkStateSnapshot.toJson() — no removal. We ADD `retryStatus:{nextRetryAtMs,attemptCount,delayMs}` next to it. Existing frontend code keeps reading disconnectReason; new code reads retryStatus."
  - "renderreasons.js is plain JS, port it 1:1 to TypeScript with the same RENDER_REASONS table, SSL_VERIFY_ERRORS nested map, RESTRICTED_REASONS (degrade to 'Disconnected' for unknown), and POST_ERRORS (post-error helper is not used by this plan but exported for completeness)."
  - "Fiber palette tokens (--fiber-blue, --fiber-blue-hi, --fiber-blue-soft, --fiber-paper, --fiber-cloud, --fiber-amber) exist already (see homepage CSS). Map the IRCCloud dusk tokens from the brief (#1d4063, #3473b2, #6199d1, #17334f, #c4d9ee, #dbb300, #af3a00) to fiber tokens; do not introduce new variables."
  - "IRCCloud's 'Click to come back' away banner is identical in shape to the current fiber banner — no change. The 'state-aware button' (reconnect | disconnect | upgrade) is owned by ConnectionStatus and uses the existing reconnectNetwork / disconnectNetwork REST calls. There is no 'upgrade' action in fiber; that branch is a TODO and degrades to the reconnect button."
  - "Message-batching in lib/messageBatcher.ts already handles server-log immediate-passthrough via shouldBypassBatcher (line 36-43). The new CONNECTION_RETRY_STATUS / CONNECTION_FAIL events must also bypass batching — they enter through the _server buffer (per the `bufferName === '_server'` early return), so the existing bypass works."
  - "Engine's `dub test` is broken on main (per AGENTS.md / Known Issues). Don't try to fix it. Engine verification uses `dub build --config=connection-registration-test` (the binary that exercises connection-registration timeout and reconnect paths) plus smoke against a live IRC server."
  - "WS message order: CONNECTION_RETRY_STATUS events arrive every reconnect cycle; CONNECTION_FAIL events arrive on disconnect. The frontend applies them in order via the existing unpackEvent + appendMessage path. Late-arriving retry-status events from a recovered network are idempotent — the store's `applyRetryStatus` overwrites the prior fields by design."

gaps:
  - "IRCCloud's join/part grouping (different surface area — applies to channel buffers, not server log) — out of scope per brief. Wave 5 documents it as future work in AGENTS.md but no code change here."
  - "IRCCloud's `failed` / `failedMessage` pending-row styles (different surface — applied to the JOIN/MODE response rows in channel buffers, not server log). Out of scope. The brief explicitly excludes this."
  - "Fiber brand font replacement (Space Mono → user wants fiber feel not IRCCloud clone). Already uses Space Grotesk for labels and fiber-mono for content per ServerLogTimeline.svelte:660-680. No change here; just preserve."
  - "The brief's IRCCloud palette tokens (#1d4063, #3473b2, etc.) are referenced for grounding but not introduced as new CSS variables. Map to fiber palette."

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: "setInterval leaks across component instances or status flips, leaving a stale timer that mutates a stale snapshot."
      likelihood: medium
      impact: medium
      mitigation: "Wave 3 task W3-T01 enforces the $effect + onCleanup pattern in ConnectionStatus.svelte: the interval is created inside an $effect that depends on retryStatus.attemptCount + activeNetwork.networkId, and onCleanup clears it. Component test asserts that switching activeNetwork from a connected state to a disconnected state with retryStatus drains the previous interval; switch activeBuffer to a channel buffer and back to _server, assert exactly one tick per second while in retry state."
    - scenario: "ServerLogTimeline collapses the connection events <details> but ServerFeaturesPanel (ISUPPORT 005) is rendered before the wrapping <details>, so the panel ends up outside the collapsed region."
      likelihood: low
      impact: medium
      mitigation: "Wave 4 task W4-T01 puts the wrapping <details> around ALL of attempt.phases + welcome + motd + numerics + isupport + notices — the <ServerFeaturesPanel> lives inside. Component test renders an attempt with both isupport and motd and asserts the panel is inside the <details>."
    - scenario: "Engine snapshot writer publishes retryStatus as a number-encoded retry-status object but the WS sync serialiser (websocket.d) forgets to ship it."
      likelihood: low
      impact: high
      mitigation: "Wave 1 task W1-T01 includes the WS sync serialisation site explicitly. Test by: launch a network, force a disconnect, observe WS sync payload contains retryStatus."
    - scenario: "renderReasons.ts drops a known IRCCloud reason (e.g. 'killed_reason') because we forgot to port a key."
      likelihood: medium
      impact: low
      mitigation: "Wave 2 task W2-T01 includes a unit test that exhaustively checks every key in IRCCloud's RENDER_REASONS (pool_lost, no_pool, enetdown, etimedout, timeout, closed, enotconn, ehostunreach, econnrefused, nxdomain, einval, ssl_certificate_error, ssl_error, crash) and every key in SSL_VERIFY_ERRORS nested map. The test file is co-located with renderReasons.ts and is required_test_first."
    - scenario: "Engine CONNECTION_FAIL emits structured failInfo but the frontend banner still reads net.disconnectReason (the legacy string) because the messageHandler doesn't dispatch CONNECTION_FAIL."
      likelihood: medium
      impact: medium
      mitigation: "Wave 2 task W2-T01 explicitly dispatches CONNECTION_FAIL through unpackEvent + a new handler in messageHandler.ts that calls net.applyFail(failInfo). Component test renders a network with failInfo set and asserts the banner reads the structured reason."
    - scenario: "serverlogCollapseEvents pref is read once at mount and doesn't react to subsequent toggles."
      likelihood: low
      impact: low
      mitigation: "Export serverlogCollapseEvents as a $state getter (not a value) so $derived in ServerLogTimeline.svelte re-reads it. Wave 4 task W4-T01 includes this."
    - scenario: "Type-prefix restyle (type_status, type_notice) breaks the existing cyan-stripe row--info look that other components may depend on."
      likelihood: low
      impact: low
      mitigation: "Wave 4 task W4-T01 (and its predecessor W2-T04) preserve the row--info / row--motd classes for CSS hook compatibility (other components may target them). Only the visible cyan-stripe inside .row--info is removed; the type-prefix row-tag is changed from cyan chip to mono. (W4-T02 was a reviewer task that did not exist pre-critique and is now dropped per OE5.)"

